<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#4f8c4a"><title>GDR Quinta Nova POS</title><style>
:root{--g:#4f8c4a;--b:#2d9fd0;--i:#17233a;--bg:#f7f7f5;--line:#dedede;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--i)}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:145px;background:#fafafa}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}.brand{display:flex;align-items:center;gap:11px}.logo{width:68px;height:58px;border-radius:15px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:950;box-shadow:0 5px 16px #4f8c4a35}.brand h1{font-size:1.15rem;margin:0}.brand small{color:var(--g);font-weight:850}main{padding:14px}button,input{font:inherit}.toprow{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px}.toprow button{height:49px;border-radius:14px;font-weight:900}.open{border:0;background:var(--g);color:#fff;text-align:left;padding:0 14px}.accountsBtn,.menu{border:1px solid var(--line);background:#fff;color:var(--i)}.menu{font-size:1.35rem}.sub{color:#777;margin:8px 2px 14px;font-size:.9rem}.section{display:flex;justify-content:space-between;align-items:end;margin:16px 2px 9px}.section h2{font-size:1rem;margin:0}.section small{color:#777}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{min-height:104px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-weight:850;box-shadow:0 4px 14px #0000000b}.tile span{font-size:1.85rem}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.product{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px;text-align:left;min-height:82px}.product strong{display:block}.product b{display:block;margin-top:8px;color:var(--g)}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:850}.hidden{display:none!important}.accountCard{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;box-shadow:0 4px 14px #0000000b}.accountHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.accountHead h2{margin:0}.badge{background:#e9f5e7;color:#2e6f2b;padding:6px 9px;border-radius:999px;font-size:.8rem;font-weight:900}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.metric{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fafafa}.metric small{display:block;color:#777}.metric b{display:block;margin-top:4px}.accountActions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.addProducts{border:0;border-radius:14px;padding:14px;background:var(--g);color:#fff;font-weight:900}.line{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px dashed #ddd}.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#eee;font-weight:900}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);padding:10px 14px 14px;z-index:30}.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:900;margin:7px 0}.total b{color:var(--g);font-size:1.35rem}.pay{width:100%;border:0;border-radius:16px;padding:15px;background:var(--b);color:#fff;font-weight:900;font-size:1.08rem}.pay:disabled{background:#b9c3c8}.overlay{position:fixed;inset:0;background:#0008;z-index:100;display:grid;place-items:center;padding:16px}.panel{background:#fff;width:min(470px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:18px}.panel h2{margin-top:0}.field,.list{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:5px 0;background:#fff}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:var(--g);color:#fff;font-weight:900}.secondary{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;font-weight:850;margin-top:8px}.cancel{width:100%;border:0;border-radius:12px;padding:12px;background:#eee;font-weight:850;margin-top:8px}.error{background:#fee;color:#900;padding:10px;border-radius:10px;margin:8px 0}.success{background:#e9f7ec;color:#246b2a;padding:10px;border-radius:10px;margin:8px 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:850}.choice button.active{background:#e9f5e7;border-color:var(--g)}.moneyRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.moneyBox{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fafafa}.moneyBox small{display:block;color:#777}.moneyBox b{font-size:1.15rem}.muted{color:#777;font-size:.9rem}</style></head><body>
<div id="login" class="overlay"><div class="panel"><div class="logo" style="margin:auto">GDR</div><h2 style="text-align:center">Entrada no POS GDR Quinta Nova</h2><input id="code" class="field" placeholder="Operador"><input id="pin" class="field" type="password" inputmode="numeric" placeholder="PIN"><div id="err" class="error hidden"></div><button class="primary" onclick="doLogin()">🔐 Entrar</button></div></div>
<div class="app"><header><div class="brand"><div class="logo">GDR</div><div><h1>GDR Quinta Nova POS</h1><small id="operator">FRONT OFFICE</small></div></div></header><main>
<div class="toprow"><button class="open" onclick="openNew()">＋ ABRIR CONTA</button><button class="accountsBtn" onclick="openAccounts()">📋 CONTAS</button><button class="menu" onclick="openAccounts()">⋯</button></div><div id="accountSub" class="sub">Nenhuma conta selecionada</div>
<section id="accountMode" class="hidden"></section>
<section id="families"><div class="section"><h2>FAMÍLIAS</h2><small id="catCount"></small></div><div id="categories" class="grid"></div></section>
<section id="products" class="hidden"><button class="back" onclick="backToAccount()">← Voltar à conta</button><div class="section"><h2 id="productTitle">PRODUTOS</h2><small id="productCount"></small></div><div id="productGrid" class="products"></div></section>
</main></div>
<div class="bottom"><div id="lines"></div><div class="total"><span>Total</span><b id="total">0,00 €</b></div><button id="payBtn" class="pay" onclick="openPayment()" disabled>💶 Receber 0,00 €</button></div>
<div id="modal" class="overlay hidden"><div class="panel"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="cancel" onclick="closeModal()">Fechar</button></div></div>
<script>
const REST='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const APIKEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';
let token=localStorage.getItem('pos_gdr_token'),data={categories:[],products:[],customers:[],accounts:[]},active=null,cat=null,paymentMode='full';
const euro=v=>Number(v||0).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function rpc(n,a){const r=await fetch(REST+n,{method:'POST',headers:{'apikey':APIKEY,'content-type':'application/json'},body:JSON.stringify(a||{})});const j=await r.json().catch(()=>null);if(!r.ok){const e=new Error(j?.message||('HTTP '+r.status));e.code=j?.code;e.detail=j;throw e}return j}
async function doLogin(){try{err.classList.add('hidden');const r=await rpc('pos_front_login',{p_operator_code:code.value.trim(),p_pin:pin.value});token=r.token;localStorage.setItem('pos_gdr_token',token);await load()}catch(e){err.textContent='Operador ou PIN inválido';err.classList.remove('hidden')}}
async function load(){try{data=await rpc('pos_front_bootstrap',{p_token:token});operator.textContent=data.operator.name;login.classList.add('hidden');if(active)active=data.accounts.find(a=>String(a.id)===String(active.id))||null;render()}catch(e){localStorage.removeItem('pos_gdr_token');login.classList.remove('hidden')}}
function render(){const ids=new Set(data.products.map(p=>String(p.category_id)));data.categories=data.categories.filter(c=>ids.has(String(c.id)));catCount.textContent=data.categories.length+' famílias';const icons={CAFETARIA:'☕',CERVEJAS:'🍺',VINHOS:'🍷',ESPIRITUOSAS:'🥃',PETISCOS:'🥣',SANDES:'🥪',REFRIGERANTES:'🥤',AGUAS:'💧',REFEICOES:'🍽️'};categories.innerHTML=data.categories.map(c=>'<button class="tile" onclick="selectCat(\\''+c.id+'\\')"><span>'+(icons[c.code]||'•')+'</span>'+esc(c.name)+'</button>').join('');renderAccount()}
function renderAccount(){const ls=active?.lines||[];lines.innerHTML=ls.map(l=>'<div class="line"><span>'+esc(l.name)+'</span><span class="qty"><button aria-label="Diminuir" onclick="qty(\\''+l.line_id+'\\','+(Number(l.quantity)-1)+')">−</button> <b>'+l.quantity+'x</b> <button aria-label="Aumentar" onclick="qty(\\''+l.line_id+'\\','+(Number(l.quantity)+1)+')">+</button></span><b>'+euro(l.line_total)+'</b></div>').join('');const amount=Number(active?.total_amount||0);total.textContent=euro(amount);payBtn.textContent='💶 Receber '+euro(amount);payBtn.disabled=!active||!ls.length||amount<=0;accountSub.textContent=active?active.account_name:'Nenhuma conta selecionada';if(active){families.classList.add('hidden');products.classList.add('hidden');accountMode.classList.remove('hidden');accountMode.innerHTML='<div class="accountCard"><div class="accountHead"><div><h2>'+esc(active.account_name)+'</h2><div class="muted">Conta ativa • operador '+esc(data.operator.name)+'</div></div><span class="badge">ABERTA</span></div><div class="summary"><div class="metric"><small>Artigos</small><b>'+ls.reduce((s,l)=>s+Number(l.quantity),0)+'</b></div><div class="metric"><small>Linhas</small><b>'+ls.length+'</b></div><div class="metric"><small>Total</small><b>'+euro(amount)+'</b></div></div><div>'+ (ls.length?ls.map(l=>'<div class="line"><span>'+esc(l.name)+'</span><span>'+l.quantity+'x</span><b>'+euro(l.line_total)+'</b></div>').join(''):'<p class="muted">Ainda não existem produtos nesta conta.</p>') +'</div><div class="accountActions"><button class="addProducts" onclick="showFamilies()">＋ Acrescentar produtos</button></div></div>'}else{accountMode.classList.add('hidden');families.classList.remove('hidden')}}
function selectCat(id){cat=id;const c=data.categories.find(x=>String(x.id)===String(id));const ps=data.products.filter(p=>String(p.category_id)===String(id));productTitle.textContent=c?c.name:'PRODUTOS';productCount.textContent=ps.length+' produtos';productGrid.innerHTML=ps.map(p=>'<button class="product" onclick="add(\\''+p.id+'\\')"><strong>'+esc(p.name)+'</strong><b>'+euro(p.price)+'</b></button>').join('');families.classList.add('hidden');accountMode.classList.add('hidden');products.classList.remove('hidden')}
function showFamilies(){products.classList.add('hidden');accountMode.classList.add('hidden');families.classList.remove('hidden')}
function backToAccount(){products.classList.add('hidden');families.classList.add('hidden');renderAccount()}
async function refresh(id){await load();active=data.accounts.find(a=>String(a.id)===String(id))||null;renderAccount()}
async function add(id){if(!active){openNew();return}try{await rpc('pos_front_add_item',{p_token:token,p_sale:active.id,p_product:id,p_quantity:1});await refresh(active.id);showToast('Produto acrescentado','success')}catch(e){showError('Não foi possível acrescentar o produto.',e)}}
async function qty(id,q){try{await rpc('pos_front_set_quantity',{p_token:token,p_line:id,p_quantity:q});await refresh(active.id)}catch(e){showError('Não foi possível alterar a quantidade.',e)}}
function openM(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
function showError(msg,e){openM('Não foi possível concluir','<div class="error">'+esc(msg)+'</div><p class="muted">'+esc(e?.message||'Erro inesperado')+'</p>')}
function showToast(msg,type='success'){openM('Operação concluída','<div class="'+type+'">'+esc(msg)+'</div>')}
function openAccounts(){openM('📋 Contas abertas',data.accounts.map(a=>'<button class="list" onclick="choose(\\''+a.id+'\\')"><strong>'+esc(a.account_name)+'</strong> — '+euro(a.total_amount)+'</button>').join('')||'<p>Sem contas abertas.</p>')}
function choose(id){active=data.accounts.find(a=>String(a.id)===String(id))||null;closeModal();renderAccount()}
function openNew(){openM('＋ Abrir conta','<button class="list" onclick="openCounter()">Balcão</button><button class="list" onclick="openNamedForm()">Mesa / nome</button>'+data.customers.map(c=>'<button class="list" onclick="openCustomer(\\''+c.id+'\\')">'+esc(c.display_name)+'</button>').join(''))}
async function openCounter(){try{const r=await rpc('pos_front_open_account',{p_token:token,p_customer:null,p_label:'Balcão'});closeModal();await refresh(r.sale_id)}catch(e){showError('Não foi possível abrir a conta.',e)}}
function openNamedForm(){openM('Mesa ou nome da conta','<input id="namedAccount" class="field" placeholder="Ex.: Mesa 3 ou António"><button class="primary" onclick="openNamed()">＋ Abrir conta</button>')}
async function openNamed(){const n=document.getElementById('namedAccount').value.trim();if(!n){showError('Indique um nome para a conta.');return}try{const r=await rpc('pos_front_open_account',{p_token:token,p_customer:null,p_label:n});closeModal();await refresh(r.sale_id)}catch(e){showError('Não foi possível abrir a conta.',e)}}
async function openCustomer(id){try{const r=await rpc('pos_front_open_account',{p_token:token,p_customer:id,p_label:null});closeModal();await refresh(r.sale_id)}catch(e){showError('Não foi possível abrir a conta do cliente.',e)}}
function openPayment(){if(!active||!(active.lines||[]).length){openM('Conta vazia','<div class="error">Acrescente produtos antes de receber.</div>');return}paymentMode='full';renderPayment()}
function renderPayment(){const total=Number(active.total_amount||0);openM('💶 Receber '+euro(total),'<div class="choice"><button id="fullBtn" class="'+(paymentMode==='full'?'active':'')+'" onclick="setPaymentMode(\\'full\\')">Pagamento total</button><button id="partialBtn" class="'+(paymentMode==='partial'?'active':'')+'" onclick="setPaymentMode(\\'partial\\')">Pagamento parcial</button></div><label class="muted">Meio de pagamento</label><select id="payMethod" class="field" onchange="updatePaymentForm()"><option value="cash">💶 Dinheiro</option><option value="mb_way">📱 MB Way</option><option value="deferred">🧾 Fiado</option></select><label class="muted">Valor a aplicar</label><input id="appliedAmount" class="field" inputmode="decimal" value="'+total.toFixed(2)+'" '+(paymentMode==='full'?'readonly':'')+' oninput="calcChange()"><div id="tenderWrap"><label class="muted">Valor recebido</label><input id="tenderedAmount" class="field" inputmode="decimal" value="'+total.toFixed(2)+'" oninput="calcChange()"></div><div class="moneyRow"><div class="moneyBox"><small>Total</small><b>'+euro(total)+'</b></div><div class="moneyBox"><small>Troco</small><b id="changeAmount">'+euro(0)+'</b></div></div><button class="primary" onclick="confirmPayment()">✓ Confirmar recebimento</button>')}
function setPaymentMode(m){paymentMode=m;renderPayment()}
function updatePaymentForm(){const method=document.getElementById('payMethod').value;document.getElementById('tenderWrap').classList.toggle('hidden',method!=='cash');calcChange()}
function val(id){return Number(String(document.getElementById(id)?.value||'0').replace(',','.'))}
function calcChange(){const method=document.getElementById('payMethod')?.value;if(!document.getElementById('changeAmount'))return;changeAmount.textContent=euro(method==='cash'?Math.max(0,val('tenderedAmount')-val('appliedAmount')):0)}
async function confirmPayment(){try{const method=document.getElementById('payMethod').value,applied=val('appliedAmount'),total=Number(active.total_amount||0);if(!(applied>0)||applied>total){showError('O valor a aplicar deve ser superior a zero e não pode ultrapassar o total.');return}if(paymentMode==='partial'){await rpc('pos_front_settle_customer',{p_token:token,p_customer:active.customer_id,p_method:method,p_tendered:method==='cash'?val('tenderedAmount'):applied,p_applied:applied,p_key:crypto.randomUUID()})}else{const a={p_token:token,p_sale:active.id,p_method:method};if(method==='cash')a.p_tendered=val('tenderedAmount');await rpc('pos_front_pay',a)}active=null;closeModal();await load();showToast('Pagamento registado.')}catch(e){showError('Não foi possível registar o pagamento.',e)}}
if(token)load();
</script></body></html>
