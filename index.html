<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS GDR Quinta Nova</title><style>body{font-family:system-ui;background:#f5f7f9;color:#17233a;margin:0}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}input,button{font:inherit;padding:14px;border-radius:12px}input{border:1px solid #ccd5dd;box-sizing:border-box}button{border:0;font-weight:750;background:#e8eef3}.primary{background:#15803d;color:#fff}.pay{width:100%;font-size:20px;background:#1594c4;color:#fff;margin-top:14px}.hidden{display:none}.error{color:#b91c1c;white-space:pre-wrap}.ok{color:#166534}.product{background:#fff;border:1px solid #d7dee7}.muted{color:#64748b}.proof{padding:12px;border-radius:12px;background:#ecfdf5;margin:12px 0}.debt{text-align:left}</style></head><body><main><h1>POS GDR Quinta Nova</h1><div id="status"></div>
<section id="loginBox" class="card"><h2>Entrada</h2><div class="row"><input id="operatorCode" autocomplete="username" placeholder="Operador"><input id="operatorPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button id="loginBtn" class="primary" type="button">Entrar</button></div></section>
<section id="homeBox" class="card hidden"><h2 id="operatorName"></h2><p id="bootInfo"></p><div class="grid"><button id="openClientsBtn" class="primary" type="button">ABRIR CLIENTE</button><button id="openDebtsBtn" type="button">CONTAS CORRENTES</button></div></section>
<section id="clientsBox" class="card hidden"><div class="row"><button id="backBtn">← Voltar</button><h2>Clientes</h2></div><input id="searchBox" style="width:100%" placeholder="Pesquisar cliente"><div id="clientList" class="grid" style="margin-top:12px"></div></section>
<section id="accountBox" class="card hidden"><h2>Conta ativa</h2><p>Cliente: <b id="accountName"></b></p><p>Total: <b id="accountTotal"></b></p><p>Linhas: <b id="lineCount"></b></p><button id="showFamiliesBtn" class="primary">VER FAMÍLIAS</button><button id="receiveBtn" class="pay">RECEBER</button><button id="accountBackBtn" style="margin-top:10px">← Voltar aos clientes</button></section>
<section id="familiesBox" class="card hidden"><h2>Famílias</h2><p>Cliente: <b id="familyClientName"></b></p><div id="familyList" class="grid"></div><button id="familiesBackBtn" style="margin-top:12px">← Voltar à conta</button></section>
<section id="productsBox" class="card hidden"><h2 id="productFamilyName"></h2><p>Cliente: <b id="productClientName"></b></p><div id="productList" class="grid"></div><button id="productsBackBtn" style="margin-top:12px">← Voltar às famílias</button></section>
<section id="paymentBox" class="card hidden"><h2>Pronto para receber</h2><p>Cliente: <b id="paymentClient"></b></p><p>Total: <b id="paymentTotal"></b></p><div class="grid"><button id="cashBtn" class="primary">Dinheiro</button><button id="deferredBtn">Conta corrente</button></div><div id="payProof" class="proof hidden"></div><button id="paymentBackBtn" style="margin-top:12px">← Voltar à conta</button></section>
<section id="debtsBox" class="card hidden"><div class="row"><button id="debtsBackBtn">← Voltar</button><h2>Contas correntes</h2></div><p id="debtCount"></p><div id="debtList" class="grid"></div></section>
<section id="debtDetailBox" class="card hidden"><h2>Conta corrente</h2><p>Cliente: <b id="debtName"></b></p><p>Saldo em dívida: <b id="debtAmount"></b></p><p>Linhas: <b id="debtLines"></b></p><div id="debtProof" class="proof"></div><button id="debtDetailBackBtn">← Voltar às contas correntes</button></section>
<script>
const RPC='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const KEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';let token=null,data=null,activeSaleId=null,baselineSaleId=null,activeCustomerId=null;
const $=id=>document.getElementById(id);const status=$('status');const boxes=['loginBox','homeBox','clientsBox','accountBox','familiesBox','productsBox','paymentBox','debtsBox','debtDetailBox'].map($);
async function rpc(n,a){const r=await fetch(RPC+n,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(a)});const t=await r.text();let b;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw new Error(b?.message||b?.error||t||('HTTP '+r.status));return b}
function show(b){boxes.forEach(x=>x.classList.add('hidden'));b.classList.remove('hidden')}function ok(t){status.className='ok';status.textContent=t}function err(e){status.className='error';status.textContent=e?.message||String(e)}
async function login(){try{const c=$('operatorCode').value.trim(),p=$('operatorPin').value;if(!c||!p)throw new Error('Preenche operador e PIN.');const a=await rpc('pos_front_login',{p_operator_code:c,p_pin:p});token=a.token;data=await rpc('pos_front_bootstrap',{p_token:token});$('operatorName').textContent=a.operator_name;$('bootInfo').textContent=(data.categories||[]).length+' famílias · '+(data.customers||[]).length+' clientes';ok('Entrada concluída.');show($('homeBox'))}catch(e){err(e)}}
$('loginBtn').onclick=login;$('operatorPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function renderClients(){const q=$('searchBox').value.trim().toLocaleLowerCase('pt-PT');$('clientList').innerHTML='';for(const c of (data.customers||[]).filter(x=>(x.display_name||'').toLocaleLowerCase('pt-PT').includes(q))){const b=document.createElement('button');b.textContent=c.display_name;b.onclick=()=>openCustomer(c);$('clientList').appendChild(b)}}
$('openClientsBtn').onclick=()=>{$('searchBox').value='';renderClients();show($('clientsBox'))};$('searchBox').oninput=renderClients;$('backBtn').onclick=()=>show($('homeBox'));$('accountBackBtn').onclick=()=>{renderClients();show($('clientsBox'))};
async function openCustomer(c){try{const a=await rpc('pos_front_open_account',{p_token:token,p_customer:c.id,p_label:null});activeSaleId=a.sale_id;baselineSaleId=a.sale_id;activeCustomerId=c.id;$('accountName').textContent=c.display_name;$('accountTotal').textContent=Number(a.total_amount||0).toFixed(2)+' €';$('lineCount').textContent=(a.lines||[]).length;$('receiveBtn').textContent='RECEBER '+Number(a.total_amount||0).toFixed(2)+' €';ok('Conta aberta.');show($('accountBox'))}catch(e){err(e)}}
$('showFamiliesBtn').onclick=()=>{ $('familyClientName').textContent=$('accountName').textContent;$('familyList').innerHTML='';for(const c of (data.categories||[])){const b=document.createElement('button');b.textContent=c.name;b.onclick=()=>openProducts(c);$('familyList').appendChild(b)}show($('familiesBox'))};
$('familiesBackBtn').onclick=async()=>{try{data=await rpc('pos_front_bootstrap',{p_token:token});const f=(data.accounts||[]).find(a=>a.id===activeSaleId);if(f){$('accountTotal').textContent=Number(f.total_amount||0).toFixed(2)+' €';$('lineCount').textContent=(f.lines||[]).length;$('receiveBtn').textContent='RECEBER '+Number(f.total_amount||0).toFixed(2)+' €'}show($('accountBox'))}catch(e){err(e)}};
function openProducts(c){$('productClientName').textContent=$('accountName').textContent;$('productFamilyName').textContent=c.name;$('productList').innerHTML='';for(const p of (data.products||[]).filter(x=>x.category_id===c.id)){const b=document.createElement('button');b.className='product';b.innerHTML='<b>'+p.name+'</b><br><span class="muted">'+Number(p.price||0).toFixed(2)+' €</span>';b.onclick=()=>addProduct(p,b);$('productList').appendChild(b)}show($('productsBox'))}
$('productsBackBtn').onclick=()=>show($('familiesBox'));
async function addProduct(p,b){try{b.disabled=true;const before=activeSaleId;await rpc('pos_front_add_item',{p_token:token,p_sale:before,p_product:p.id,p_quantity:1});data=await rpc('pos_front_bootstrap',{p_token:token});const f=(data.accounts||[]).find(a=>a.id===before);if(!f||f.id!==baselineSaleId)throw new Error('sale_id_alterado');$('accountTotal').textContent=Number(f.total_amount||0).toFixed(2)+' €';$('lineCount').textContent=(f.lines||[]).length;$('receiveBtn').textContent='RECEBER '+Number(f.total_amount||0).toFixed(2)+' €';ok(p.name+' adicionado.')}catch(e){err(e)}finally{b.disabled=false}}
$('receiveBtn').onclick=()=>{$('paymentClient').textContent=$('accountName').textContent;$('paymentTotal').textContent=$('accountTotal').textContent;$('payProof').classList.add('hidden');show($('paymentBox'))};$('paymentBackBtn').onclick=()=>show($('accountBox'));
async function pay(method){try{const amount=Number(String($('accountTotal').textContent).replace(',','.').replace(/[^0-9.]/g,''))||null;const r=await rpc('pos_front_pay',{p_token:token,p_sale:activeSaleId,p_method:method,p_tendered:method==='cash'?amount:null});$('payProof').classList.remove('hidden');if(method==='cash'){$('payProof').innerHTML='<b>Pago.</b> Restante 0,00 €';activeSaleId=null;ok('Pagamento em dinheiro concluído.')}else{$('payProof').innerHTML='<b>Conta corrente registada.</b><br>Saldo: '+Number(r?.deferred?.outstanding??r?.remaining??0).toFixed(2)+' €';ok('Conta corrente registada.')}data=await rpc('pos_front_bootstrap',{p_token:token})}catch(e){err(e)}}
$('cashBtn').onclick=()=>pay('cash');$('deferredBtn').onclick=()=>pay('deferred');
$('openDebtsBtn').onclick=loadDebts;$('debtsBackBtn').onclick=()=>show($('homeBox'));$('debtDetailBackBtn').onclick=()=>show($('debtsBox'));
async function loadDebts(){try{const ds=await rpc('pos_front_debts',{p_token:token});$('debtList').innerHTML='';$('debtCount').textContent=ds.length+' dívida(s) em aberto';for(const d of ds){const b=document.createElement('button');b.className='debt';b.innerHTML='<b>'+d.customer_name+'</b><br>'+Number(d.outstanding_amount).toFixed(2)+' €';b.onclick=()=>openDebt(d);$('debtList').appendChild(b)}show($('debtsBox'))}catch(e){err(e)}}
async function openDebt(d){try{const a=await rpc('pos_front_customer_account',{p_token:token,p_customer:d.customer_id});const h=(a.history||[]).find(x=>x.receivable_id===d.receivable_id);if(!h||h.sale_id!==d.sale_id)throw new Error('divida_inconsistente');$('debtName').textContent=d.customer_name;$('debtAmount').textContent=Number(d.outstanding_amount).toFixed(2)+' €';$('debtLines').textContent=(h.lines||[]).length;$('debtProof').innerHTML='Mesmo sale_id recuperado; nenhuma nova venda criada.';ok('Conta corrente recuperada.');show($('debtDetailBox'))}catch(e){err(e)}}
</script></main></body></html>
