<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#4f8c4a"><title>POS GDR Quinta Nova</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f5f2;color:#17233a}.app{max-width:560px;margin:auto;min-height:100vh;background:#fafafa;padding-bottom:150px}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 14px}h1{font-size:20px;margin:0}.sub{font-size:13px;color:#666}.login{position:fixed;inset:0;z-index:50;background:#fff;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);border:1px solid #ddd;border-radius:18px;padding:20px}.logo{width:90px;height:90px;border-radius:50%;background:#4f8c4a;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;margin:auto}.field,button{font:inherit}.field{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;margin:7px 0}button{border:0;border-radius:13px;padding:13px;font-weight:800}.primary{width:100%;background:#4f8c4a;color:#fff}.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}.toolbar button{background:#fff;border:1px solid #ddd}.mic{background:#d93d3d!important;color:#fff!important;font-size:22px;min-width:56px}.mic.listening{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.main{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.family,.product,.account{background:#fff;border:1px solid #ddd;text-align:left;min-height:76px}.product b{display:block;color:#4f8c4a;margin-top:7px}.back{margin-bottom:10px;background:#fff;border:1px solid #ddd}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid #ddd;padding:10px 14px;z-index:20}.line{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:4px 0}.qty button{padding:4px 9px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900}.pay{width:100%;background:#2d9fd0;color:#fff;margin-top:7px}.overlay{position:fixed;inset:0;z-index:40;background:#0008;display:grid;place-items:center;padding:16px}.panel{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:16px}.list{width:100%;background:#fff;border:1px solid #ddd;text-align:left;margin:5px 0}.cancel{width:100%;background:#eee;margin-top:8px}.confirm{width:100%;background:#4f8c4a;color:white;margin-top:8px}.error{color:#900;background:#fee;padding:9px;border-radius:10px;margin:7px 0}.voice-box{background:#f4f7f2;border:1px solid #cdd8c9;padding:12px;border-radius:12px;margin:8px 0}.voice-title{font-weight:900;margin-bottom:6px}.voice-item{padding:5px 0;border-bottom:1px dashed #ddd}.voice-warn{color:#8a5200;background:#fff4d9;padding:8px;border-radius:10px;margin-top:8px}</style></head><body>
<div id="login" class="login"><div class="card"><div class="logo">GDR</div><h2>POS GDR Quinta Nova</h2><input id="code" class="field" value="JP" placeholder="Operador"><input id="pin" class="field" type="password" inputmode="numeric" value="1234" placeholder="PIN"><div id="err" class="error hidden"></div><button class="primary" onclick="doLogin()">Entrar</button></div></div>
<div class="app"><header><h1>GDR Quinta Nova POS</h1><div id="operator" class="sub">Front Office</div><div class="toolbar"><button onclick="openNew()">＋ Abrir conta</button><button onclick="openAccounts()">📋 Contas</button><button id="micBtn" class="mic" onclick="startVoice()">🎤</button></div></header><main class="main"><section id="families"><h3>Famílias</h3><div id="familyGrid" class="grid"></div></section><section id="products" class="hidden"><button class="back" onclick="showFamilies()">← Famílias</button><h3 id="productTitle">Produtos</h3><div id="productGrid" class="grid"></div></section></main></div>
<div class="bottom"><div id="cart" class="sub">Nenhuma conta selecionada</div><div class="total"><span>Total</span><span id="total">0,00 €</span></div><button class="pay" onclick="pay()">Pedir conta</button></div>
<div id="modal" class="overlay hidden"><div class="panel"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="cancel" onclick="closeModal()">Fechar</button></div></div>
<script>
const sb=supabase.createClient('https://cxymfqaokexihupbphur.supabase.co','sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ');let token=localStorage.getItem('pos_token'),data={categories:[],products:[],customers:[],accounts:[]},active=null,pendingVoice=null;const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));async function rpc(n,a){const{data,error}=await sb.rpc(n,a);if(error)throw error;return data}async function doLogin(){try{err.classList.add('hidden');const r=await rpc('pos_front_login',{p_operator_code:code.value.trim(),p_pin:pin.value});token=r.token;localStorage.setItem('pos_token',token);operator.textContent=r.operator_name;login.classList.add('hidden');await load()}catch(e){err.textContent='Operador ou PIN inválido';err.classList.remove('hidden')}}async function load(){try{data=await rpc('pos_front_bootstrap',{p_token:token});render()}catch(e){localStorage.removeItem('pos_token');login.classList.remove('hidden')}}function render(){familyGrid.innerHTML=data.categories.map(c=>`<button class="family" onclick="selectCat('${c.id}')">${c.name}</button>`).join('');renderCart()}function selectCat(id){const c=data.categories.find(x=>String(x.id)===String(id));productTitle.textContent=c?c.name:'Produtos';productGrid.innerHTML=data.products.filter(p=>String(p.category_id)===String(id)).map(p=>`<button class="product" onclick="add('${p.id}')"><strong>${p.name}</strong><b>${euro(p.price)}</b></button>`).join('');families.classList.add('hidden');products.classList.remove('hidden')}function showFamilies(){products.classList.add('hidden');families.classList.remove('hidden')}function renderCart(){if(!active){cart.textContent='Nenhuma conta selecionada';total.textContent=euro(0);return}cart.innerHTML=(active.lines||[]).map(l=>`<div class="line"><span>${l.name}</span><span class="qty"><button onclick="qty('${l.line_id}',${Number(l.quantity)-1})">−</button> ${l.quantity} <button onclick="qty('${l.line_id}',${Number(l.quantity)+1})">+</button></span><b>${euro(l.line_total)}</b></div>`).join('')||'Conta vazia';total.textContent=euro(active.total_amount)}async function refresh(id){await load();active=data.accounts.find(a=>String(a.id)===String(id))||null;renderCart()}async function add(id){if(!active){openNew();return}await rpc('pos_front_add_item',{p_token:token,p_sale:active.id,p_product:id,p_quantity:1});await refresh(active.id)}async function qty(id,q){await rpc('pos_front_set_quantity',{p_token:token,p_line:id,p_quantity:q});await refresh(active.id)}function openModal(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}function openAccounts(){openModal('Contas abertas',data.accounts.map(a=>`<button class="list account" onclick="choose('${a.id}')">${a.account_name} — ${euro(a.total_amount)}</button>`).join('')||'<p>Sem contas abertas.</p>')}function choose(id){active=data.accounts.find(a=>String(a.id)===String(id))||null;closeModal();renderCart()}function openNew(){openModal('Abrir conta','<button class="list" onclick="openCounter()">Balcão</button><button class="list" onclick="openNamed()">Mesa / nome</button>'+data.customers.map(c=>`<button class="list" onclick="openCustomer('${c.id}')">${c.display_name}</button>`).join(''))}async function openCounter(){const r=await rpc('pos_front_open_account',{p_token:token,p_customer:null,p_label:'Balcão'});closeModal();await refresh(r.sale_id)}async function openNamed(){const n=prompt('Mesa ou nome da conta:');if(!n)return;const r=await rpc('pos_front_open_account',{p_token:token,p_customer:null,p_label:n});closeModal();await refresh(r.sale_id)}async function openCustomer(id){const r=await rpc('pos_front_open_account',{p_token:token,p_customer:id,p_label:null});closeModal();await refresh(r.sale_id)}async function pay(){if(!active||!(active.lines||[]).length){alert('A conta está vazia.');return}const m=prompt('Método: dinheiro, mbway ou fiado','dinheiro'),map={dinheiro:'cash',mbway:'mbway',fiado:'deferred'};if(!map[m])return;const a={p_token:token,p_sale:active.id,p_method:map[m]};if(map[m]==='cash'){const v=prompt('Valor recebido',String(active.total_amount));a.p_tendered=Number(String(v).replace(',','.'))}await rpc('pos_front_pay',a);active=null;await load();alert('Conta fechada.')}
const qtyWords={um:1,uma:1,dois:2,duas:2,'três':3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10};function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}function sim(a,b){a=norm(a);b=norm(b);if(a===b)return 1;if(a.includes(b)||b.includes(a))return .82;const A=new Set(a.split(' ')),B=new Set(b.split(' ')),i=[...A].filter(x=>B.has(x)).length;return i/Math.max(A.size,B.size,1)}function best(t,items,key,th=.48){let bi=null,bs=0;for(const i of items){const s=sim(t,i[key]);if(s>bs){bs=s;bi=i}}return bs>=th?bi:null}function qOf(s){for(const w of norm(s).split(' ')){if(qtyWords[w])return qtyWords[w];if(/^\d+$/.test(w))return Number(w)}return 1}function stripQ(s){return norm(s).split(' ').filter(w=>!qtyWords[w]&&!/^\d+$/.test(w)&&!['de','da','do','e','mais'].includes(w)).join(' ')}function parseVoice(text){const clean=norm(text),pool=[...data.accounts.map(a=>({...a,_label:a.account_name,_kind:'account'})),...data.customers.map(c=>({...c,_label:c.display_name,_kind:'customer'}))];let account=null;for(const a of pool){if(clean.startsWith(norm(a._label))||clean.includes(norm(a._label)+' ')){account=a;break}}let rem=clean;if(account)rem=rem.replace(norm(account._label),'').trim();const parts=rem.split(/\s+e\s+|,/).map(x=>x.trim()).filter(Boolean),items=[],unknown=[];for(const p of parts){const m=best(stripQ(p),data.products,'name');if(m)items.push({product:m,quantity:qOf(p),heard:p});else unknown.push(p)}return{original:text,account,items,unknown}}function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Abre o POS no Chrome para usar a voz.');return}const r=new SR();r.lang='pt-PT';r.interimResults=false;r.maxAlternatives=1;micBtn.classList.add('listening');micBtn.textContent='🔴';r.onresult=e=>{pendingVoice=parseVoice(e.results[0][0].transcript);showVoice(pendingVoice)};r.onerror=()=>alert('Não consegui ouvir corretamente.');r.onend=()=>{micBtn.classList.remove('listening');micBtn.textContent='🎤'};r.start()}function showVoice(v){const lines=v.items.map(x=>`<div class="voice-item"><b>${x.quantity}× ${x.product.name}</b><br><small>Ouvi: “${x.heard}”</small></div>`).join(''),warn=[];if(!v.account)warn.push('Não identifiquei a conta ou cliente.');if(v.unknown.length)warn.push('Não reconheci: '+v.unknown.join(', '));if(!v.items.length)warn.push('Não identifiquei produtos.');openModal('Confirmar pedido por voz',`<div class="voice-box"><div class="voice-title">Ouvi:</div>${v.original}</div><div class="voice-box"><div class="voice-title">Conta/cliente:</div>${v.account?v.account._label:'Não identificado'}</div><div class="voice-box"><div class="voice-title">Produtos:</div>${lines||'Nenhum produto reconhecido.'}</div>${warn.length?`<div class="voice-warn">${warn.join('<br>')}</div>`:''}<button class="confirm" onclick="confirmVoice()" ${(!v.account||!v.items.length)?'disabled':''}>Confirmar e registar</button><button class="list" onclick="closeModal();startVoice()">🎤 Tentar novamente</button>`)}async function confirmVoice(){const v=pendingVoice;if(!v||!v.account||!v.items.length)return;try{let sale=v.account._kind==='account'?v.account.id:(await rpc('pos_front_open_account',{p_token:token,p_customer:v.account.id,p_label:null})).sale_id;for(const x of v.items)await rpc('pos_front_add_item',{p_token:token,p_sale:sale,p_product:x.product.id,p_quantity:x.quantity});closeModal();await refresh(sale);alert('Pedido registado.')}catch(e){alert('Não foi possível registar: '+(e.message||e))}}if(token){login.classList.add('hidden');load()}
</script></body></html>
