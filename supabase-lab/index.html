<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>POS GDR Quinta Nova — LAB Supabase</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.shell{max-width:1080px;margin:auto;padding:12px}.head{display:flex;align-items:center;gap:12px;background:white;border:1px solid #d9dee3;border-radius:16px;padding:10px 14px;position:sticky;top:6px;z-index:10}.logo{width:54px;height:54px;object-fit:contain}.brand{flex:1}.brand b{display:block}.brand small{opacity:.65}.badge{font-size:.72rem;font-weight:800;border:1px solid #7f8c8d;border-radius:999px;padding:4px 8px}.notice,.error,.context,.cartbar,.summary{margin:12px 0;border-radius:12px;padding:12px;background:white;border:1px solid #d9dee3}.error{border-color:#b03a2e}.notice{border-color:#1e8449}.screen{background:white;border:1px solid #d9dee3;border-radius:16px;padding:16px;margin-top:12px}.screen h1{font-size:1.4rem;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.item{width:100%;min-height:68px;border:1px solid #d9dee3;border-radius:12px;background:white;padding:11px;text-align:left;display:flex;gap:10px;align-items:center}.grid .item{min-height:116px;display:flex;flex-direction:column;align-items:stretch;justify-content:center}.item img{width:100%;height:82px;object-fit:contain}.item-main{flex:1;min-width:0}.item-title{font-weight:750}.meta{font-size:.84rem;opacity:.66}.money{font-weight:800;font-variant-numeric:tabular-nums}.actions,.item-actions,.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button,.item-actions button,.quick button{min-height:44px;border:1px solid #aeb6bf;border-radius:10px;padding:9px 12px;background:white}.actions .primary{font-weight:800;border-color:#34495e}.actions button:disabled{opacity:.4}.fields{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:.86rem;font-weight:700}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid #aeb6bf;border-radius:10px;padding:10px;background:white}.field textarea{min-height:110px}.search{margin-bottom:10px}.search input{width:100%;min-height:44px;border:1px solid #aeb6bf;border-radius:10px;padding:10px}.cartbar{display:flex;justify-content:space-between;gap:12px}.busy{opacity:.58;pointer-events:none}@media(max-width:620px){.shell{padding:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{border-radius:12px}.screen{padding:12px}.actions button{flex:1 1 42%}}</style></head><body><div class="shell"><header class="head" id="homeHeader"><img class="logo" src="https://raw.githubusercontent.com/jpfuzeiro-del/pos-gdr-quinta-nova/bcc3ec9c94ebc0dfeb0102187e2e40cc09210daa/assets/gdr-quinta-nova-logo.png" alt="GDR Quinta Nova"><div class="brand"><b>GDR Quinta Nova</b><small>Front Office · LAB Supabase</small></div><span class="badge">LAB</span></header><div id="status"></div><main id="app"></main></div><script>(function(){'use strict';const G='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pug_frontoffice_core_clean_v1';const app=document.getElementById('app'),status=document.getElementById('status'),head=document.getElementById('homeHeader');let sid=sessionStorage.getItem('pug_supabase_lab_session')||'',model=null,busy=false,inputSource='manual';function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function euro(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}):''}function showError(m){status.innerHTML='<div class="error">'+esc(m)+'</div>'}async function call(op,body){const r=await fetch(G+'?op='+encodeURIComponent(op),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={error:t}}if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}function fields(){const o={};document.querySelectorAll('[data-field]').forEach(x=>o[x.dataset.field]=x.value);if(inputSource!=='manual')o.input_source=inputSource;return o}async function send(key,payload){if(busy||!sid||!key)return;busy=true;document.body.classList.add('busy');try{model=await call('dispatch',{p_session:sid,p_action:key,p_payload:Object.assign({},fields(),payload||{}),p_event_id:crypto.randomUUID()});inputSource='manual';render()}catch(e){showError(e.message)}finally{busy=false;document.body.classList.remove('busy')}}function labelFor(o){return o.display_name||o.name||o.label||o.operator_name||o.operator_code||o.code||o.id||''}function valueFor(o){return o.id||o.operator_id||o.customer_id||o.value||''}function renderFields(fs){if(!Array.isArray(fs)||!fs.length)return'';return'<div class="fields">'+fs.map(f=>{const val=f.value==null?'':f.value;let input='';if(f.type==='select'){const opts=Array.isArray(f.options)?f.options:[];input='<select data-field="'+esc(f.key)+'"><option value="">—</option>'+opts.map(o=>'<option value="'+esc(valueFor(o))+'">'+esc(labelFor(o))+'</option>').join('')+'</select>'}else if(f.type==='textarea'){input='<textarea data-field="'+esc(f.key)+'">'+esc(val)+'</textarea>'}else{const type=f.type==='money'?'number':(f.type||'text'),step=f.type==='money'?' step="0.01" min="0"':'';input='<input data-field="'+esc(f.key)+'" type="'+esc(type)+'"'+step+' value="'+esc(val)+'">'}return'<div class="field"><label>'+esc(f.label||f.key)+'</label>'+input+'</div>'}).join('')+'</div>'}function itemTitle(i){return i.title||i.name||i.product_name||i.customer_name||i.account_name||i.display_name||i.description_snapshot||'Item'}function itemAmount(i){for(const k of ['amount','line_total','total_amount','outstanding_total'])if(i[k]!=null)return i[k];return null}function renderItems(items,layout){if(!Array.isArray(items)||!items.length)return'<div class="meta">Sem registos.</div>';return'<div class="'+(layout==='tiles'?'grid':'list')+'">'+items.map(i=>{const a=i.action,tag=a?'button':'div',img=i.image_url?'<img src="'+esc(i.image_url)+'" alt="">':'',qty=i.quantity!=null?' · × '+esc(i.quantity):'',sub=(i.subtitle||'')+qty,amt=itemAmount(i),ia=Array.isArray(i.item_actions)?'<div class="item-actions">'+i.item_actions.map(x=>'<button type="button" data-key="'+esc(x.key)+'" data-payload="'+esc(JSON.stringify(x.payload||{}))+'">'+esc(x.label||x.key)+'</button>').join('')+'</div>':'';return'<'+tag+' class="item"'+(a?' data-key="'+esc(a.key)+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"':'')+'>'+img+'<span class="item-main"><span class="item-title">'+esc(itemTitle(i))+'</span>'+(sub?'<br><span class="meta">'+esc(sub)+'</span>':'')+'</span>'+(amt!=null?'<span class="money">'+euro(amt)+'</span>':'')+ia+'</'+tag+'>'}).join('')+'</div>'}function renderActions(actions){if(!Array.isArray(actions))return'';return'<div class="actions">'+actions.map(a=>'<button type="button" data-key="'+esc(a.key)+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"'+(a.disabled?' disabled':'')+' class="'+(a.style==='primary'?'primary':'')+'"'+(a.device?' data-device="'+esc(a.device)+'"':'')+'>'+esc(a.label||a.key)+'</button>').join('')+'</div>'}function renderExternal(actions){if(!Array.isArray(actions)||!actions.length)return'';return'<div class="actions">'+actions.map(a=>'<button type="button" data-protocol="'+esc(a.protocol)+'">'+esc(a.label||a.protocol)+'</button>').join('')+'</div>'}function renderLogin(){sid='';sessionStorage.removeItem('pug_supabase_lab_session');status.innerHTML='';app.innerHTML='<section class="screen"><h1>Entrada</h1><form id="login" class="fields"><div class="field"><label>Operador</label><input id="op" autocomplete="username" required></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></div><div class="actions"><button class="primary" type="submit">Entrar</button></div></form></section>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{model=await call('start',{p_operator_code:document.getElementById('op').value,p_pin:document.getElementById('pin').value});sid=model.session_id;sessionStorage.setItem('pug_supabase_lab_session',sid);render()}catch(err){showError(err.message)}}}function renderNotice(n){if(!n)return'';let d='';if(n.applied!=null)d+=' Recebido: '+euro(n.applied)+'.';if(n.change!=null&&Number(n.change)>0)d+=' Troco: '+euro(n.change)+'.';if(n.remaining!=null&&Number(n.remaining)>0)d+=' Restante: '+euro(n.remaining)+'.';return'<div class="notice"><b>'+esc(n.title||'Concluído')+'</b>'+esc(d)+'</div>'}function render(){if(!model){renderLogin();return}const s=model.screen||{};status.innerHTML=renderNotice(model.notice);let top='';if(model.selected_customer)top+='<div class="context"><b>Cliente:</b> '+esc(model.selected_customer.display_name||model.selected_customer.name||'')+'</div>';if(model.cart&&Number(model.cart.count)>0)top+='<div class="cartbar"><span><b>Carrinho</b> · '+esc(model.cart.count)+' item(ns)</span><span class="money">'+euro(model.cart.total)+'</span></div>';let html=top+'<section class="screen"><h1>'+esc(s.title||'')+'</h1>';if(s.summary)html+='<div class="summary"><span>'+esc(s.summary.label||'')+'</span><div class="money">'+euro(s.summary.amount)+'</div></div>';if(s.kind==='search_list')html+='<div class="search"><input id="search" placeholder="Pesquisar"></div>';html+=renderFields(s.fields);if(Array.isArray(s.quick_values)&&s.quick_values.length)html+='<div class="quick">'+s.quick_values.map(v=>'<button type="button" data-quick="'+esc(v)+'">'+euro(v)+'</button>').join('')+'</div>';if(s.review){const rr=s.review;html+='<div class="summary"><b>Reconhecido</b><div class="meta">'+esc(rr.raw||'')+'</div>'+(Array.isArray(rr.items)?rr.items.map(i=>'<div>'+esc(i.name)+' × '+esc(i.quantity)+'</div>').join(''):'')+(rr.unmatched_text?'<div class="error">Por rever: '+esc(rr.unmatched_text)+'</div>':'')+'</div>'}html+=renderItems(s.items,s.kind==='tiles'?'tiles':'list');html+=renderActions(s.actions);html+=renderExternal(s.external_actions);html+='</section>';app.innerHTML=html;bind()}function bind(){document.querySelectorAll('[data-key]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const device=b.dataset.device;if(device){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){showError('Reconhecimento de voz indisponível neste dispositivo.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=new SR();r.lang='pt-PT';r.interimResults=false;r.onresult=x=>{const t=x.results[0][0].transcript||'';if(device==='speech_fill'){const f=document.querySelector('[data-field]');if(f){f.value=t;inputSource='voice'}}else send(b.dataset.key,{transcript:t})};r.onerror=x=>showError('Microfone: '+x.error);r.start();return}let p={};try{p=JSON.parse(b.dataset.payload||'{}')}catch{}await send(b.dataset.key,p)});document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const f=document.querySelector('[data-field][type="number"]');if(f)f.value=b.dataset.quick});const q=document.getElementById('search');if(q)q.oninput=()=>{const n=q.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();document.querySelectorAll('.item').forEach(x=>x.style.display=!n||x.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(n)?'':'none')};document.querySelectorAll('[data-protocol]').forEach(b=>b.onclick=async()=>{const tel=document.querySelector('[data-field][type="tel"]'),ta=document.querySelector('textarea[data-field]'),p=tel?tel.value:'',m=ta?ta.value:'';if(b.dataset.protocol==='whatsapp')window.open('https://wa.me/'+p.replace(/\D/g,'')+'?text='+encodeURIComponent(m),'_blank');else if(b.dataset.protocol==='sms')location.href='sms:'+p.replace(/[^0-9+]/g,'')+'?body='+encodeURIComponent(m);else if(b.dataset.protocol==='clipboard'){await navigator.clipboard.writeText(m);status.innerHTML='<div class="notice">Mensagem copiada.</div>'}})}head.onclick=()=>{if(sid&&model&&model.home_action)send(model.home_action.key,model.home_action.payload||{})};(async()=>{if(!sid){renderLogin();return}try{model=await call('view',{p_session:sid});render()}catch(e){renderLogin();showError('Sessão expirada. Entre novamente.')}})();})();</script></body></html>
