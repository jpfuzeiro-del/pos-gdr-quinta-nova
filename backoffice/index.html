<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDR Quinta Nova — Back Office</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#171717}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:800}.tag{font-size:12px;border:1px solid #bbb;border-radius:999px;padding:3px 8px}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.nav button.active{font-weight:800;border-color:#222}button,input,select{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:10px;background:#fff}button{cursor:pointer}button.primary{background:#171717;color:#fff;border-color:#171717}button.danger{border-color:#a00;color:#a00}.hidden{display:none}.muted{color:#666;font-size:13px}.ok{color:#176b2c}.err{color:#a00;white-space:pre-wrap}.kpi{font-size:26px;font-weight:800}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#fafafa}pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:12px;border-radius:10px;max-height:420px;overflow:auto}.moduleTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eee;font-size:12px}.stockInput{width:90px}
</style></head><body>
<header><div><span class="brand">GDR Quinta Nova — Back Office</span> <span class="tag">operacional laboratório</span></div><div id="who" class="muted"></div></header>
<div class="wrap">
<section id="login" class="card"><h2>Entrar</h2><div class="row"><input id="code" placeholder="Código do operador" autocomplete="username"><input id="pin" placeholder="PIN" type="password" autocomplete="current-password"><button class="primary" id="loginBtn">Entrar</button></div><div id="loginMsg" class="muted"></div></section>
<section id="app" class="hidden">
<div class="card"><div class="nav" id="nav"></div></div>
<div id="status" class="card muted">Pronto.</div>
<div id="module" class="card"></div>
</section></div>
<script>
const API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_api';
let token=sessionStorage.getItem('bo_token')||'';let current='dashboard';let selectedStockCount='';
const modules=[['dashboard','Dashboard'],['sales_accounts','Vendas / Contas'],['products','Produtos'],['suppliers_invoices_purchases','Fornecedores / Faturas / Compras'],['expenses','Despesas'],['stock','Stock']];
const esc=v=>String(v==null?'':v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({action,token},payload))});const j=await r.json().catch(()=>({error:'Resposta inválida'}));if(!r.ok||j.ok===false)throw new Error((j.error||('HTTP '+r.status))+(j.detail?' — '+j.detail:''));return j;}
function setStatus(t,bad=false){const e=document.getElementById('status');e.textContent=t;e.className='card '+(bad?'err':'muted');}
function nav(){const n=document.getElementById('nav');n.innerHTML=modules.map(m=>'<button data-m="'+m[0]+'" class="'+(m[0]===current?'active':'')+'">'+m[1]+'</button>').join('')+'<button id="logoutBtn">Sair</button>';n.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{current=b.dataset.m;nav();loadCurrent();});document.getElementById('logoutBtn').onclick=logout;}
function scalarCards(obj){if(!obj||typeof obj!=='object'||Array.isArray(obj))return '';return '<div class="grid">'+Object.entries(obj).filter(x=>x[1]==null||['string','number','boolean'].includes(typeof x[1])).map(x=>'<div class="card"><div class="muted">'+esc(x[0])+'</div><div class="kpi">'+esc(x[1])+'</div></div>').join('')+'</div>';}
function table(arr,limit=100){if(!Array.isArray(arr)||!arr.length)return '<div class="muted">Sem registos.</div>';const rows=arr.slice(0,limit);const keys=[...new Set(rows.flatMap(o=>o&&typeof o==='object'?Object.keys(o):[]))].slice(0,10);return '<div class="tableWrap"><table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(o=>'<tr>'+keys.map(k=>'<td>'+esc(typeof o[k]==='object'?JSON.stringify(o[k]):o[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function renderGeneric(title,data){let h='<div class="moduleTitle"><h2>'+esc(title)+'</h2><button id="refreshModule">Atualizar</button></div>';if(data&&data.summary)h+=scalarCards(data.summary);for(const [k,v] of Object.entries(data||{})){if(k==='summary'||k==='meta')continue;if(Array.isArray(v))h+='<h3>'+esc(k)+'</h3>'+table(v);else if(v&&typeof v==='object')h+='<h3>'+esc(k)+'</h3>'+scalarCards(v)+'<details><summary>Detalhe</summary><pre>'+esc(JSON.stringify(v,null,2))+'</pre></details>';}h+='<details><summary>Dados técnicos</summary><pre>'+esc(JSON.stringify(data,null,2))+'</pre></details>';document.getElementById('module').innerHTML=h;document.getElementById('refreshModule').onclick=loadCurrent;}
function renderDashboard(d){let h='<div class="moduleTitle"><h2>Dashboard</h2><div class="row"><button id="openCash">Abrir caixa</button><button id="closeCash">Fechar caixa</button><button id="refreshModule">Atualizar</button></div></div>'+scalarCards(d.summary||{});if(d.action_queue)h+='<h3>Atenção</h3>'+table(d.action_queue);if(d.cash)h+='<h3>Caixa</h3>'+scalarCards(d.cash)+'<pre>'+esc(JSON.stringify(d.cash,null,2))+'</pre>';if(d.sales)h+='<h3>Últimas vendas</h3>'+table(d.sales,20);document.getElementById('module').innerHTML=h;document.getElementById('refreshModule').onclick=loadCurrent;document.getElementById('openCash').onclick=async()=>{const v=prompt('Fundo inicial de caixa (€):','30');if(v===null)return;try{setStatus('A abrir caixa...');await api('open_cash',{openingFloat:Number(v),idempotencyKey:'bo-open-'+Date.now()});setStatus('Caixa aberta.');loadCurrent();}catch(e){setStatus(e.message,true)}};document.getElementById('closeCash').onclick=async()=>{const id=prompt('ID da sessão de caixa a fechar:');if(!id)return;const v=prompt('Dinheiro contado (€):');if(v===null)return;try{setStatus('A fechar caixa...');await api('close_cash',{cashSession:id,countedCash:Number(v),idempotencyKey:'bo-close-'+Date.now()});setStatus('Caixa fechada.');loadCurrent();}catch(e){setStatus(e.message,true)}};}
function renderSuppliers(d){renderGeneric('Fornecedores / Faturas / Compras',d);const m=document.getElementById('module');m.insertAdjacentHTML('afterbegin','<div class="card"><h3>Novo fornecedor</h3><div class="row"><input id="supplierName" placeholder="Nome"><input id="supplierTax" placeholder="NIF"><button id="saveSupplier">Guardar</button></div></div>');document.getElementById('saveSupplier').onclick=async()=>{const name=document.getElementById('supplierName').value.trim();if(!name)return;try{await api('save_supplier',{name,taxId:document.getElementById('supplierTax').value||null});setStatus('Fornecedor guardado.');loadCurrent();}catch(e){setStatus(e.message,true)}};}
function renderStock(d){const balances=d.balances||[];const counts=d.counts||[];if(!selectedStockCount){const draft=counts.find(x=>x.status==='draft');if(draft)selectedStockCount=draft.id;}let h='<div class="moduleTitle"><h2>Stock</h2><div class="row"><button id="newFull">Novo inventário completo</button><button id="newCycle">Novo inventário cíclico</button><button id="postCount" class="primary">Lançar selecionado</button><button id="refreshModule">Atualizar</button></div></div>'+scalarCards(d.summary||{});h+='<div class="card"><div class="muted">Inventário selecionado</div><strong id="selectedCount">'+esc(selectedStockCount||'nenhum')+'</strong></div>';h+='<h3>Inventários</h3><div class="tableWrap"><table><thead><tr><th>Selecionar</th><th>Tipo</th><th>Estado</th><th>Corte</th><th>Linhas</th><th>Notas</th></tr></thead><tbody>'+counts.map(c=>'<tr><td><button class="selCount" data-id="'+esc(c.id)+'">'+(c.id===selectedStockCount?'Selecionado':'Selecionar')+'</button></td><td>'+esc(c.count_type)+'</td><td>'+esc(c.status)+'</td><td>'+esc(c.cutoff_at)+'</td><td>'+esc(c.line_count)+'</td><td>'+esc(c.notes)+'</td></tr>').join('')+'</tbody></table></div>';h+='<h3>Contagem física</h3><div class="muted">Cria/seleciona um inventário draft e introduz apenas as quantidades físicas. Em inventário completo todos os produtos controlados têm de ser contados antes do lançamento.</div><div class="tableWrap"><table><thead><tr><th>Produto</th><th>Saldo técnico</th><th>Quantidade física</th><th></th></tr></thead><tbody>'+balances.map(b=>'<tr><td>'+esc(b.name||b.sku)+'</td><td>'+esc(b.quantity_on_hand)+'</td><td><input class="stockInput" id="q_'+esc(b.product_id)+'" type="number" min="0" step="0.001"></td><td><button class="saveLine" data-product="'+esc(b.product_id)+'">Guardar</button></td></tr>').join('')+'</tbody></table></div>';if(d.recent_movements)h+='<h3>Movimentos recentes</h3>'+table(d.recent_movements,40);document.getElementById('module').innerHTML=h;document.getElementById('refreshModule').onclick=loadCurrent;document.querySelectorAll('.selCount').forEach(b=>b.onclick=()=>{selectedStockCount=b.dataset.id;renderStock(d)});async function create(type){try{const j=await api('create_stock_count',{countType:type,cutoff:new Date().toISOString(),notes:'Criado no Back Office'});selectedStockCount=j.result.stock_count_id;setStatus('Inventário draft criado: '+selectedStockCount);loadCurrent();}catch(e){setStatus(e.message,true)}}document.getElementById('newFull').onclick=()=>create('full');document.getElementById('newCycle').onclick=()=>create('cycle');document.querySelectorAll('.saveLine').forEach(b=>b.onclick=async()=>{if(!selectedStockCount){setStatus('Cria ou seleciona primeiro um inventário.',true);return}const inp=document.getElementById('q_'+b.dataset.product);if(inp.value===''){setStatus('Introduz a quantidade física.',true);return}try{await api('save_stock_count_line',{stockCount:selectedStockCount,product:b.dataset.product,quantity:Number(inp.value)});setStatus('Contagem guardada.');}catch(e){setStatus(e.message,true)}});document.getElementById('postCount').onclick=async()=>{if(!selectedStockCount){setStatus('Nenhum inventário selecionado.',true);return}if(!confirm('Lançar este inventário e ajustar o stock?'))return;try{const j=await api('post_stock_count',{stockCount:selectedStockCount,idempotencyKey:'bo-stock-'+selectedStockCount});setStatus('Inventário lançado. Ajustes: '+(j.result.adjustment_movements??0));selectedStockCount='';loadCurrent();}catch(e){setStatus(e.message,true)}};}
async function loadCurrent(){try{setStatus('A carregar '+current+'...');const j=await api(current);const d=j.dashboard||j.salesAccounts||j.products||j.suppliersInvoicesPurchases||j.expenses||j.stock||j;if(current==='dashboard')renderDashboard(d);else if(current==='suppliers_invoices_purchases')renderSuppliers(d);else if(current==='stock')renderStock(d);else renderGeneric(modules.find(x=>x[0]===current)[1],d);setStatus('Atualizado.');}catch(e){setStatus(e.message,true);if(String(e.message).includes('sessao'))logout(false)}}
async function login(){const msg=document.getElementById('loginMsg');msg.textContent='';try{const j=await api('login',{operatorCode:document.getElementById('code').value.trim(),pin:document.getElementById('pin').value});token=j.token;sessionStorage.setItem('bo_token',token);document.getElementById('who').textContent=j.operator||'Administrador';showApp();renderDashboard(j.dashboard);setStatus('Sessão iniciada.');}catch(e){msg.textContent=e.message;msg.className='err'}}
async function logout(callApi=true){if(callApi&&token){try{await api('logout')}catch{}}sessionStorage.removeItem('bo_token');token='';location.reload()}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');nav();}
document.getElementById('loginBtn').onclick=login;document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(token){showApp();loadCurrent().catch(()=>logout(false));}
</script></body></html>
