</style><!-- PUG_UX_FINISH_V1_END --></head><body><header><div><strong>GDR Quinta Nova — Back Office</strong> <span class="tag">laboratório operacional</span></div><div id="who" class="muted"></div></header><main class="wrap"><section id="login" class="card"><h2>Entrar</h2><div class="row"><input id="code" placeholder="Código do operador"><input id="pin" type="password" placeholder="PIN"><button id="loginBtn" class="primary">Entrar</button></div><div id="loginMsg" class="muted"></div></section><section id="app" class="hidden"><div class="card"><div class="nav" id="nav"></div></div><div id="status" class="card muted">Pronto.</div><div id="module" class="card"></div></section></main><script>
const API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_api';let token=sessionStorage.getItem('bo_token')||'',current='dashboard',selectedStockCount='';const mods=[['dashboard','Dashboard'],['sales_accounts','Vendas / Contas'],['products','Produtos'],['suppliers_invoices_purchases','Fornecedores / Faturas / Compras'],['expenses','Despesas'],['stock','Stock'],['operators','Operadores']];const esc=v=>String(v==null?'':v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(v||0));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...payload})});const j=await r.json().catch(()=>({error:'Resposta inválida'}));if(!r.ok||j.ok===false)throw new Error((j.error||('HTTP '+r.status))+(j.detail?' — '+j.detail:''));return j}function setStatus(t,b=false){status.textContent=t;status.className='card '+(b?'err':'muted')}function navBuild(){nav.innerHTML=mods.map(m=>'<button data-m="'+m[0]+'" class="'+(m[0]===current?'active':'')+'">'+m[1]+'</button>').join('')+'<button id="out">Sair</button>';nav.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{current=b.dataset.m;navBuild();load()});out.onclick=logout}function cards(o){if(!o||typeof o!=='object'||Array.isArray(o))return'';return'<div class="grid">'+Object.entries(o).filter(x=>x[1]==null||['string','number','boolean'].includes(typeof x[1])).map(x=>'<div class="card"><div class="muted">'+esc(x[0])+'</div><div class="kpi">'+esc(x[1])+'</div></div>').join('')+'</div>'}function table(a,lim=100){if(!Array.isArray(a)||!a.length)return'<div class="muted">Sem registos.</div>';const r=a.slice(0,lim),k=[...new Set(r.flatMap(o=>o&&typeof o==='object'?Object.keys(o):[]))].slice(0,10);return'<div class="tableWrap"><table><thead><tr>'+k.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+r.map(o=>'<tr>'+k.map(x=>'<td>'+esc(typeof o[x]==='object'?JSON.stringify(o[x]):o[x])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function generic(title,d){module.innerHTML='<div class="row" style="justify-content:space-between"><h2>'+title+'</h2><button id="ref">Atualizar</button></div>'+(d.summary?cards(d.summary):'')+Object.entries(d||{}).filter(([k])=>!['summary','meta'].includes(k)).map(([k,v])=>Array.isArray(v)?'<h3>'+esc(k)+'</h3>'+table(v):'').join('');ref.onclick=load}
function salesAccounts(d){const sales=d.sales||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Vendas / Contas</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<h3>Vendas</h3><div class="tableWrap"><table><thead><tr><th>N.º</th><th>Cliente</th><th>Estado</th><th>Total</th><th>Pago</th><th>Pendente</th><th>Ações</th></tr></thead><tbody>'+sales.map(s=>'<tr><td>'+esc(s.official_number||'—')+'</td><td>'+esc(s.customer)+'</td><td>'+esc(s.operational_status+' / '+s.financial_status)+'</td><td>'+eur(s.total_amount)+'</td><td>'+eur(s.paid_amount)+'</td><td>'+eur(s.outstanding_amount)+'</td><td><button class="detailSale" data-id="'+s.id+'">Detalhe</button></td></tr>').join('')+'</tbody></table></div><div id="saleDetailBox"></div>'+(Array.isArray(d.customer_balances)&&d.customer_balances.length?'<h3>Saldos por cliente</h3>'+table(d.customer_balances):'')+(Array.isArray(d.receivables)&&d.receivables.length?'<h3>Pendentes</h3>'+table(d.receivables):'');ref.onclick=load;document.querySelectorAll('.detailSale').forEach(b=>b.onclick=()=>openSaleDetail(b.dataset.id))}
async function openSaleDetail(id){try{setStatus('A carregar detalhe...');const j=await api('sale_detail',{saleId:id}),d=j.saleDetail||{},s=d.sale||{};const canDiscard=s.operational_status==='draft'&&s.financial_status==='unpaid'&&(!d.lines||d.lines.length===0)&&(!d.payments||d.payments.length===0);saleDetailBox.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h3>Detalhe — '+esc(s.customer||'Conta')+'</h3><div class="row">'+(canDiscard?'<button id="discardDraft" class="danger">Eliminar rascunho vazio</button>':'')+'<button id="closeDetail">Fechar</button></div></div>'+cards({numero:s.official_number||'—',estado:(s.operational_status||'')+' / '+(s.financial_status||''),total:eur(s.total_amount),pago:eur(s.paid_amount),pendente:eur(s.outstanding_amount),criado_por:s.created_by||'—'})+'<h4>Linhas</h4>'+table(d.lines||[])+'<h4>Pagamentos</h4>'+table(d.payments||[])+'<h4>Recebíveis</h4>'+table(d.receivables||[])+'<h4>Histórico</h4>'+table(d.history||[])+'</div>';closeDetail.onclick=()=>saleDetailBox.innerHTML='';if(canDiscard)discardDraft.onclick=async()=>{if(!confirm('Eliminar este rascunho vazio? Esta ação só é permitida se continuar sem consumo e sem pagamentos.'))return;try{await api('discard_empty_draft',{saleId:id});setStatus('Rascunho vazio eliminado.');await load()}catch(e){setStatus(e.message,true)}};setStatus('Detalhe carregado.')}catch(e){setStatus(e.message,true)}}
function stock(d){const balances=d.balances||[],counts=d.counts||[],drafts=counts.filter(c=>c.status==='draft');const active=drafts[0]||null;selectedStockCount=active?active.id:'';const existing=new Map((d.draft_detail||[]).filter(x=>!active||x.stock_count_id===active.id).map(x=>[x.product_id,x]));module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Stock</h2><div class="row"><button id="newCycle">Novo inventário parcial</button><button id="newFull">Novo inventário total</button><button id="ref">Atualizar</button></div></div>'+cards(d.summary||{})+(active?'<div class="card"><h3>Inventário em curso</h3><div class="muted">Tipo: '+esc(active.count_type)+' · criado em '+esc(active.created_at)+' · linhas: '+esc(active.line_count)+'</div><div class="tableWrap"><table><thead><tr><th>SKU</th><th>Produto</th><th>Stock atual</th><th>Contagem física</th><th>Ação</th></tr></thead><tbody>'+balances.map(p=>{const ex=existing.get(p.product_id);return'<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.quantity_on_hand==null?'—':p.quantity_on_hand)+'</td><td><input class="stockInput qty" data-product="'+p.product_id+'" value="'+esc(ex?ex.counted_quantity:'')+'" inputmode="decimal"></td><td><button class="saveQty" data-product="'+p.product_id+'">Guardar</button></td></tr>'}).join('')+'</tbody></table></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button id="postCount" class="primary">Lançar inventário</button></div></div>':'<div class="card muted">Não existe inventário em curso.</div>')+'<h3>Saldos atuais</h3>'+table(balances,100)+'<h3>Histórico de inventários</h3>'+table(counts,50)+'<h3>Movimentos recentes</h3>'+table(d.recent_movements||[],50);ref.onclick=load;newCycle.onclick=()=>createCount('cycle');newFull.onclick=()=>createCount('full');document.querySelectorAll('.saveQty').forEach(b=>b.onclick=async()=>{const product=b.dataset.product,input=document.querySelector('.qty[data-product="'+product+'"]'),v=input.value.trim();if(v===''||Number(v)<0||!Number.isFinite(Number(v)))return setStatus('Quantidade inválida.',true);try{await api('save_stock_count_line',{stockCount:selectedStockCount,product,quantity:Number(v)});setStatus('Quantidade guardada.');}catch(e){setStatus(e.message,true)}});if(active)postCount.onclick=async()=>{if(!confirm('Lançar este inventário? Serão criados movimentos de ajuste de stock.'))return;try{const j=await api('post_stock_count',{stockCount:selectedStockCount,idempotencyKey:'bo-stock-post-'+selectedStockCount+'-'+Date.now()});setStatus('Inventário lançado.');await load()}catch(e){setStatus(e.message,true)}}}
async function createCount(type){if(selectedStockCount&&!confirm('Já existe um inventário em curso. Criar outro na mesma?'))return;try{const j=await api('create_stock_count',{countType:type,cutoff:new Date().toISOString(),notes:'Inventário de teste criado no Back Office'});setStatus('Inventário criado.');await load()}catch(e){setStatus(e.message,true)}}
function operators(d){const a=d.operators||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Operadores</h2><button id="ref">Atualizar</button></div><div class="card"><h3>Novo operador</h3><div class="row"><input id="opCode" placeholder="Código (ex.: GONCALO)"><input id="opName" class="grow" placeholder="Nome"><input id="opEmail" placeholder="Email opcional"><select id="opRole"><option value="OPERADOR_VENDAS">Operador de vendas</option><option value="ADMIN_FUNCIONAL">Administrador funcional</option></select><button id="opCreate" class="primary">Criar</button></div></div><div class="tableWrap"><table><thead><tr><th>Código</th><th>Nome</th><th>Perfil</th><th>Ativo</th><th>Ações</th></tr></thead><tbody>'+a.map(o=>'<tr><td><strong>'+esc(o.operator_code)+'</strong></td><td>'+esc(o.display_name)+'</td><td>'+esc((o.roles||[]).join(', '))+'</td><td>'+esc(o.is_active)+'</td><td><button class="editOp" data-id="'+o.id+'">Editar</button> <button class="pinOp" data-id="'+o.id+'">Redefinir PIN</button></td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;opCreate.onclick=async()=>{const c=opCode.value.trim(),n=opName.value.trim();if(!c||!n)return setStatus('Código e nome são obrigatórios.',true);try{await api('save_operator',{operatorCode:c,displayName:n,email:opEmail.value||null,isActive:true,roleCode:opRole.value});setStatus('Operador criado.');load()}catch(e){setStatus(e.message,true)}};document.querySelectorAll('.editOp').forEach(b=>b.onclick=async()=>{const o=a.find(x=>x.id===b.dataset.id);const name=prompt('Nome:',o.display_name);if(name===null)return;const active=confirm('Operador ativo? OK=Sim / Cancelar=Não');const role=prompt('Perfil: OPERADOR_VENDAS ou ADMIN_FUNCIONAL',(o.roles||[])[0]||'OPERADOR_VENDAS');if(!role)return;try{await api('save_operator',{operator:o.id,displayName:name,email:o.email||null,isActive:active,roleCode:role});setStatus('Operador atualizado.');load()}catch(e){setStatus(e.message,true)}});document.querySelectorAll('.pinOp').forEach(b=>b.onclick=async()=>{const o=a.find(x=>x.id===b.dataset.id);const p=prompt('Novo PIN para '+o.operator_code+' (4 a 8 dígitos):');if(p===null)return;if(!/^\d{4,8}$/.test(p))return setStatus('PIN inválido: usa 4 a 8 dígitos.',true);try{await api('set_operator_pin',{operator:o.id,newPin:p});setStatus('PIN de '+o.operator_code+' redefinido e sessões anteriores terminadas.');}catch(e){setStatus(e.message,true)}})}
function dashboard(d){module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Dashboard</h2><div class="row"><button id="open">Abrir caixa</button><button id="close">Fechar caixa</button><button id="ref">Atualizar</button></div></div>'+cards(d.summary||{})+(d.action_queue?'<h3>Atenção</h3>'+table(d.action_queue):'')+(d.cash?'<h3>Caixa</h3>'+cards(d.cash):'')+(d.sales?'<h3>Últimas vendas</h3>'+table(d.sales,20):'');ref.onclick=load;open.onclick=async()=>{const v=prompt('Fundo inicial (€):','30');if(v===null)return;try{await api('open_cash',{openingFloat:Number(v),idempotencyKey:'bo-open-'+Date.now()});setStatus('Caixa aberta.');load()}catch(e){setStatus(e.message,true)}};close.onclick=async()=>{const id=prompt('ID da sessão de caixa:');if(!id)return;const v=prompt('Dinheiro contado (€):');if(v===null)return;try{await api('close_cash',{cashSession:id,countedCash:Number(v),idempotencyKey:'bo-close-'+Date.now()});setStatus('Caixa fechada.');load()}catch(e){setStatus(e.message,true)}}}
function products(d){const a=d.products||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Produtos</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="tableWrap"><table><thead><tr><th>SKU</th><th>Nome</th><th>Preço</th><th>Vendável</th><th>Stock</th><th>Ativo</th><th></th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.current_price==null?'—':eur(p.current_price))+'</td><td>'+esc(p.is_sellable)+'</td><td>'+esc(p.track_stock)+'</td><td>'+esc(p.is_active)+'</td><td><button class="editP" data-id="'+p.id+'">Editar</button></td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;document.querySelectorAll('.editP').forEach(b=>b.onclick=async()=>{const p=a.find(x=>x.id===b.dataset.id),name=prompt('Nome:',p.name);if(name===null)return;const price=prompt('Preço de venda (€). Vazio mantém:',p.current_price??'');if(price===null)return;try{await api('update_product',{product:p.id,name,isSellable:confirm('Vendável?'),trackStock:confirm('Controlar stock?'),isActive:confirm('Ativo?'),salePrice:price===''?null:Number(price)});setStatus('Produto atualizado.');load()}catch(e){setStatus(e.message,true)}})}
function suppliers(d){const a=d.suppliers||[],inv=d.invoices||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Fornecedores / Faturas / Compras</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="card"><h3>Novo fornecedor</h3><div class="row"><input id="supCode" placeholder="Código"><input id="supName" class="grow" placeholder="Nome"><input id="supNif" placeholder="NIF"><input id="supPhone" placeholder="Telefone"><input id="supEmail" placeholder="Email"><button id="saveSup" class="primary">Guardar fornecedor</button></div></div><div class="card"><h3>Registar fatura</h3><div class="row"><select id="invSupplier"><option value="">Fornecedor opcional</option>'+a.map(s=>'<option value="'+s.id+'">'+esc(s.display_name)+'</option>').join('')+'</select><input id="invNum" placeholder="N.º documento"><input id="invDate" type="date"><input id="invDue" type="date"><input id="invTotal" type="number" step="0.01" placeholder="Total €"><select id="invPay"><option value="unpaid">Por pagar</option><option value="paid">Pago</option></select><input id="invFile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"><button id="uploadInv" class="primary">Carregar fatura</button></div><div class="muted">PDF ou imagem, máximo 10 MB.</div></div><h3>Fornecedores</h3>'+table(a,100)+'<h3>Faturas</h3>'+table(inv,100)+'<h3>Ordens de compra</h3>'+table(d.purchase_orders||[],50)+'<h3>Receções de mercadoria</h3>'+table(d.goods_receipts||[],50);ref.onclick=load;saveSup.onclick=async()=>{const name=supName.value.trim();if(!name)return setStatus('Nome do fornecedor obrigatório.',true);try{await api('save_supplier',{code:supCode.value||null,name,taxId:supNif.value||null,phone:supPhone.value||null,email:supEmail.value||null});setStatus('Fornecedor guardado.');await load()}catch(e){setStatus(e.message,true)}};uploadInv.onclick=async()=>{const f=invFile.files[0],total=Number(invTotal.value);if(!f||!Number.isFinite(total))return setS (()=>{const API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_api',FILE_API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_invoice_file';if(typeof suppliers!=='function')return;const originalSuppliers=suppliers;const tok=()=>sessionStorage.getItem('bo_token')||'';const roleName=r=>({receipt:'Recibo',credit_note:'Nota de crédito',delivery_note:'Guia',other:'Outro'})[r]||r||'Documento';async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token:tok(),...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.detail||j.error||('HTTP '+r.status));return j}async function openFile(invoiceId,filename,documentId){if(!tok()){setStatus('Sessão expirada.',true);return}try{setStatus('A abrir documento...');const r=await fetch(FILE_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'download',token:tok(),invoiceId,documentId:documentId||null})});const ct=(r.headers.get('content-type')||'').toLowerCase();if(ct.includes('application/json')){const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));if(j.external){if(j.library){setStatus('Documento arquivado na Library. Abertura direta não disponível neste Back Office.',true);return}const w=window.open(j.url,'_blank','noopener');if(!w)throw new Error('O navegador bloqueou a abertura do documento.');setStatus('Documento aberto.');return}throw new Error(j.error||'Resposta de documento inválida.')}if(!r.ok)throw new Error('HTTP '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob);const w=window.open(url,'_blank','noopener');if(!w){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=filename||'documento';document.body.appendChild(a);a.click();a.remove()}setStatus('Documento aberto.');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){setStatus(e.message||String(e),true)}}async function replaceDoc(invoice,doc){const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/jpeg,image/png,image/webp';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;if(f.size>10485760)return setStatus('Ficheiro superior a 10 MB.',true);if(!confirm('Substituir o ficheiro deste documento associado?'))return;try{setStatus('A substituir documento...');const fd=new FormData();fd.append('token',tok());fd.append('file',f);fd.append('metadata',JSON.stringify({invoiceId:invoice.id,replaceDocumentId:doc.id,notes:doc.notes||null}));const r=await fetch(FILE_API,{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));setStatus('Documento substituído.');await showDocs(invoice)}catch(e){setStatus(e.message||String(e),true)}};input.click()}async function uploadDoc(invoice,panel){const role=panel.querySelector('#pug-doc-role').value,file=panel.querySelector('#pug-doc-file').files?.[0];if(!file)return setStatus('Seleciona o ficheiro do documento.',true);if(file.size>10485760)return setStatus('Ficheiro superior a 10 MB.',true);try{setStatus('A associar documento...');const fd=new FormData();fd.append('token',tok());fd.append('file',file);fd.append('metadata',JSON.stringify({invoiceId:invoice.id,documentRole:role,documentNumber:panel.querySelector('#pug-doc-number').value||null,documentDate:panel.querySelector('#pug-doc-date').value||null,amount:Number(panel.querySelector('#pug-doc-amount').value||0),paymentMethod:panel.querySelector('#pug-doc-method').value||null,notes:panel.querySelector('#pug-doc-notes').value||null}));const r=await fetch(FILE_API,{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));setStatus(role==='receipt'?'Recibo associado; a fatura ficou marcada como paga.':'Documento associado.');await load();setTimeout(()=>document.querySelector('[data-pug-docs-btn="'+invoice.id+'"]')?.click(),80)}catch(e){setStatus(e.message||String(e),true)}}async function showDocs(invoice){let panel=document.getElementById('pug-invoice-docs-panel');if(!panel){const h=[...document.querySelectorAll('h3')].find(e=>(e.textContent||'').trim()==='Faturas'),wrap=h?.nextElementSibling;if(!wrap)return;panel=document.createElement('section');panel.id='pug-invoice-docs-panel';wrap.after(panel)}panel.innerHTML='<div class="row" style="justify-content:space-between"><div><h3>Documentos associados</h3><div class="muted">'+String(invoice.document_number||invoice.original_filename||'Fatura')+'</div></div><button id="pug-doc-close">Fechar</button></div><div class="muted">A carregar...</div>';panel.querySelector('#pug-doc-close').onclick=()=>panel.remove();try{const j=await call('invoice_documents',{invoice:invoice.id}),docs=Array.isArray(j.invoiceDocuments?.documents)?j.invoiceDocuments.documents:[];const list=docs.length?docs.map(d=>'<div class="pug-doc-item"><div><div class="pug-doc-title">'+roleName(d.document_role)+(d.document_number?' — '+String(d.document_number):'')+'</div><div class="pug-doc-meta">'+String(d.document_date||'Sem data')+(d.amount!=null?' · '+eur(d.amount):'')+' · '+String(d.original_filename||'')+'</div></div><div class="bo-doc-actions"><button type="button" data-open="'+d.id+'">Abrir</button><button type="button" data-replace="'+d.id+'">Substituir</button></div></div>').join(''):'<div class="muted">Sem documentos associados.</div>';panel.innerHTML='<div class="row" style="justify-content:space-between"><div><h3>Documentos associados</h3><div class="muted">'+String(invoice.document_number||invoice.original_filename||'Fatura')+'</div></div><button id="pug-doc-close">Fechar</button></div><div class="pug-doc-list">'+list+'</div><div class="pug-doc-upload"><h3>Adicionar documento</h3><div class="muted">Recibo, nota de crédito, guia ou outro documento. Um recibo associado marca a fatura como paga.</div><div class="pug-doc-grid"><div><label>Tipo</label><select id="pug-doc-role"><option value="receipt">Recibo</option><option value="credit_note">Nota de crédito</option><option value="delivery_note">Guia</option><option value="other">Outro</option></select></div><div><label>N.º documento</label><input id="pug-doc-number"></div><div><label>Data</label><input id="pug-doc-date" type="date"></div><div><label>Valor</label><input id="pug-doc-amount" type="number" step="0.01"></div><div><label>Método de pagamento</label><select id="pug-doc-method"><option value="">—</option><option value="cash">Dinheiro</option><option value="mb_way">MB Way</option><option value="bank_transfer">Transferência</option><option value="direct_debit">Débito direto</option><option value="other">Outro</option></select></div><div><label>Ficheiro</label><input id="pug-doc-file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div><div style="grid-column:1/-1"><label>Notas</label><input id="pug-doc-notes"></div></div><div class="pug-doc-upload-actions"><button id="pug-doc-upload" class="primary">Associar documento</button></div></div>';panel.querySelector('#pug-doc-close').onclick=()=>panel.remove();panel.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.open);if(d)openFile(invoice.id,d.original_filename,d.id)});panel.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.replace);if(d)replaceDoc(invoice,d)});panel.querySelector('#pug-doc-upload').onclick=()=>uploadDoc(invoice,panel)}catch(e){panel.innerHTML='<div class="row" style="justify-content:space-between"><h3>Documentos associados</h3><button id="pug-doc-close">Fechar</button></div><div class="err">'+String(e.message||e)+'</div>';panel.querySelector('#pug-doc-close').onclick=()=>panel.remove()}}suppliers=function(d){originalSuppliers(d);try{document.getElementById('pug-invoice-docs-panel')?.remove();const inv=Array.isArray(d?.invoices)?d.invoices.slice(0,100):[];const h=[...document.querySelectorAll('h3')].find(e=>(e.textContent||'').trim()==='Faturas'),wrap=h?.nextElementSibling,table=wrap?.querySelector?.('table'),rows=table?[...table.querySelectorAll('tbody tr')]:[];if(!table||!rows.length||!inv.length)return;const head=table.querySelector('thead tr');if(head&&!head.querySelector('[data-pug-doc-head]')){const th=document.createElement('th');th.textContent='Documentos';th.dataset.pugDocHead='1';head.appendChild(th)}rows.forEach((tr,i)=>{if(tr.querySelector('[data-pug-doc-cell]'))return;const td=document.createElement('td');td.dataset.pugDocCell='1';td.className='bo-doc-actions';const x=inv[i];if(x?.id){if(x.original_filename){const open=document.createElement('button');open.type='button';open.textContent='Abrir fatura';open.title=x.original_filename;open.onclick=()=>openFile(x.id,x.original_filename,null);td.appendChild(open)}const docs=document.createElement('button');docs.type='button';docs.textContent='Associados ('+Number(x.supporting_document_count||0)+')';docs.dataset.pugDocsBtn=x.id;docs.onclick=()=>showDocs(x);td.appendChild(docs)}else td.textContent='—';tr.appendChild(td)})}catch(e){console.warn('pug_documents_v2',e)}}})();
</script><!-- PUG_BACKOFFICE_DOCUMENTS_V2_END --><!-- PUG_ADMIN_CORRECTIONS_V3_START --><style id="pug-admin-corrections-style-v3">#pug-admin-corrections{margin-top:14px;border:1px solid #dedede;border-radius:14px;padding:14px;background:#fff}#pug-admin-corrections h3{margin:0 0 10px}.pug-corr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pug-corr-grid label{font-size:12px;font-weight:800}.pug-corr-grid input{width:100%;min-height:44px;box-sizing:border-box}.pug-corr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pug-corr-actions button{min-height:42px;font-weight:800}.pug-corr-msg{margin-top:8px;font-size:13px;font-weight:700}@media(max-width:600px){.pug-corr-grid{grid-template-columns:1fr}.pug-corr-actions button{width:100%}}</style><script id="pug-admin-corrections-v3">
(()=>{const API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_api';function token(){return sessionStorage.getItem('bo_token')||''}async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token:token(),...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.detail||j.error||('HTTP '+r.status));return j}function isSalesContext(){const txt=(document.querySelector('.boTitle h2')?.textContent||document.querySelector('main h2')?.textContent||'').trim();return /vendas|contas/i.test(txt)}function panel(){const old=document.getElementById('pug-admin-corrections');if(!token()||!isSalesContext()){old?.remove();return}if(old)return;const heading=[...document.querySelectorAll('h2,h3')].find(e=>/vendas|contas/i.test((e.textContent||'').trim()));if(!heading)return;const host=heading.closest('.card')||heading.parentElement;if(!host)return;const d=document.createElement('section');d.id='pug-admin-corrections';d.innerHTML='<h3>Correções administrativas</h3><div class="muted">Correções do POS_TESTE. Selecione primeiro a venda/conta no módulo.</div><div class="pug-corr-grid"><div><label>Venda / conta</label><input id="pug-corr-sale" placeholder="Venda selecionada"></div><div><label>Cliente</label><input id="pug-corr-customer" placeholder="Cliente selecionado"></div><div><label>Novo nome do cliente</label><input id="pug-corr-name" placeholder="Nome correto"></div><div><label>Motivo da anulação</label><input id="pug-corr-reason" placeholder="Motivo obrigatório"></div></div><div class="pug-corr-actions"><button id="pug-corr-name-btn">Corrigir nome</button><button id="pug-corr-reassign-btn">Reatribuir conta</button><button id="pug-corr-cancel-btn">Anular venda</button></div><div id="pug-corr-msg" class="pug-corr-msg"></div>';host.appendChild(d);const msg=(t,ok=true)=>{const e=d.querySelector('#pug-corr-msg');e.textContent=t;e.style.color=ok?'#176b2c':'#9d1c1c'};d.querySelector('#pug-corr-name-btn').onclick=async()=>{try{const customer=d.querySelector('#pug-corr-customer').value.trim(),name=d.querySelector('#pug-corr-name').value.trim();if(!customer||!name)throw new Error('Cliente e nome são obrigatórios.');await call('update_customer_name',{customer,name});msg('Nome corrigido.')}catch(e){msg(e.message||String(e),false)}};d.querySelector('#pug-corr-reassign-btn').onclick=async()=>{try{const sale=d.querySelector('#pug-corr-sale').value.trim(),customer=d.querySelector('#pug-corr-customer').value.trim();if(!sale||!customer)throw new Error('Venda e cliente são obrigatórios.');await call('reassign_sale_customer',{sale,customer});msg('Conta reatribuída.')}catch(e){msg(e.message||String(e),false)}};d.querySelector('#pug-corr-cancel-btn').onclick=async()=>{try{const sale=d.querySelector('#pug-corr-sale').value.trim(),reason=d.querySelector('#pug-corr-reason').value.trim();if(!sale||!reason)throw new Error('Venda e motivo são obrigatórios.');if(!confirm('Anular esta venda?'))return;await call('cancel_sale',{sale,reason,idempotencyKey:'bo-cancel-'+sale+'-'+Date.now()});msg('Venda anulada.')}catch(e){msg(e.message||String(e),false)}}}document.addEventListener('click',ev=>{const el=ev.target.closest?.('[data-sale-id],[data-customer-id]');if(!el)return;const sale=el.dataset.saleId||el.closest('[data-sale-id]')?.dataset.saleId,customer=el.dataset.customerId||el.closest('[data-customer-id]')?.dataset.customerId;setTimeout(()=>{panel();if(sale){const x=document.getElementById('pug-corr-sale');if(x)x.value=sale}if(customer){const x=document.getElementById('pug-corr-customer');if(x)x.value=customer}},0)},true);new MutationObserver(panel).observe(document.documentElement,{childList:true,subtree:true});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',panel);else panel()})();
</script><!-- PUG_ADMIN_CORRECTIONS_V3_END --><!-- PUG_ADMIN_CORRECTION_CONTEXT_V1_START --><style id="pug-admin-correction-context-v1">#pug-corr-customer{width:100%;min-height:44px}</style><script id="pug-admin-correction-context-script-v1">
(()=>{if(typeof salesAccounts!=='function')return;const baseSalesAccounts=salesAccounts;let latest={sales:[],customers:[]};function enhance(){const panel=document.getElementById('pug-admin-corrections');if(!panel)return;const old=panel.querySelector('#pug-corr-customer');if(old&&old.tagName!=='SELECT'){const sel=document.createElement('select');sel.id='pug-corr-customer';sel.innerHTML='<option value="">Selecionar cliente</option>'+latest.customers.map(c=>'<option value="'+c.id+'">'+esc(c.display_name)+(c.customer_code?' ['+esc(c.customer_code)+']':'')+'</option>').join('');old.replaceWith(sel)}else if(old&&old.tagName==='SELECT'){const val=old.value;old.innerHTML='<option value="">Selecionar cliente</option>'+latest.customers.map(c=>'<option value="'+c.id+'">'+esc(c.display_name)+(c.customer_code?' ['+esc(c.customer_code)+']':'')+'</option>').join('');if([...old.options].some(o=>o.value===val))old.value=val}document.querySelectorAll('.detailSale').forEach(b=>{const s=latest.sales.find(x=>String(x.id)===String(b.dataset.id));if(!s)return;b.dataset.saleId=s.id;if(s.customer_id)b.dataset.customerId=s.customer_id;b.title='Selecionar esta venda para correção administrativa'})}salesAccounts=function(d){latest={sales:Array.isArray(d?.sales)?d.sales:[],customers:Array.isArray(d?.customers)?d.customers:[]};baseSalesAccounts(d);setTimeout(enhance,0)};document.addEventListener('click',e=>{const b=e.target.closest?.('.detailSale');if(!b)return;const s=latest.sales.find(x=>String(x.id)===String(b.dataset.id));setTimeout(()=>{enhance();const sale=document.getElementById('pug-corr-sale'),customer=document.getElementById('pug-corr-customer');if(sale)sale.value=b.dataset.id||'';if(customer&&s?.customer_id)customer.value=s.customer_id},0)},true)})();
