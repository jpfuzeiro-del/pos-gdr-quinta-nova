<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDR Quinta Nova — Back Office</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#171717}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.nav{display:flex;gap:8px;overflow:auto}.nav button.active{font-weight:800;border-color:#222}button,input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:10px;background:#fff}button{cursor:pointer}.primary{background:#171717;color:#fff;border-color:#171717}.hidden{display:none}.muted{color:#666;font-size:13px}.err{color:#a00;white-space:pre-wrap}.kpi{font-size:24px;font-weight:800}.tableWrap{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#fafafa}.tag{font-size:12px;border:1px solid #bbb;border-radius:999px;padding:3px 8px}.stockInput{width:90px}.grow{flex:1;min-width:160px}</style></head><body><header><div><strong>GDR Quinta Nova — Back Office</strong> <span class="tag">laboratório operacional</span></div><div id="who" class="muted"></div></header><main class="wrap"><section id="login" class="card"><h2>Entrar</h2><div class="row"><input id="code" placeholder="Código do operador"><input id="pin" type="password" placeholder="PIN"><button id="loginBtn" class="primary">Entrar</button></div><div id="loginMsg" class="muted"></div></section><section id="app" class="hidden"><div class="card"><div class="nav" id="nav"></div></div><div id="status" class="card muted">Pronto.</div><div id="module" class="card"></div></section></main><script>
const API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_api';let token=sessionStorage.getItem('bo_token')||'',current='dashboard',selectedStockCount='';const mods=[['dashboard','Dashboard'],['sales_accounts','Vendas / Contas'],['products','Produtos'],['suppliers_invoices_purchases','Fornecedores / Faturas / Compras'],['expenses','Despesas'],['stock','Stock']];const esc=v=>String(v==null?'':v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(v||0));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...payload})});const j=await r.json().catch(()=>({error:'Resposta inválida'}));if(!r.ok||j.ok===false)throw new Error((j.error||('HTTP '+r.status))+(j.detail?' — '+j.detail:''));return j}function setStatus(t,b=false){status.textContent=t;status.className='card '+(b?'err':'muted')}function navBuild(){nav.innerHTML=mods.map(m=>'<button data-m="'+m[0]+'" class="'+(m[0]===current?'active':'')+'">'+m[1]+'</button>').join('')+'<button id="out">Sair</button>';nav.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{current=b.dataset.m;navBuild();load()});out.onclick=logout}function cards(o){if(!o||typeof o!=='object'||Array.isArray(o))return'';return'<div class="grid">'+Object.entries(o).filter(x=>x[1]==null||['string','number','boolean'].includes(typeof x[1])).map(x=>'<div class="card"><div class="muted">'+esc(x[0])+'</div><div class="kpi">'+esc(x[1])+'</div></div>').join('')+'</div>'}function table(a,lim=100){if(!Array.isArray(a)||!a.length)return'<div class="muted">Sem registos.</div>';const r=a.slice(0,lim),k=[...new Set(r.flatMap(o=>o&&typeof o==='object'?Object.keys(o):[]))].slice(0,10);return'<div class="tableWrap"><table><thead><tr>'+k.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+r.map(o=>'<tr>'+k.map(x=>'<td>'+esc(typeof o[x]==='object'?JSON.stringify(o[x]):o[x])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function generic(title,d){module.innerHTML='<div class="row" style="justify-content:space-between"><h2>'+title+'</h2><button id="ref">Atualizar</button></div>'+(d.summary?cards(d.summary):'')+Object.entries(d||{}).filter(([k])=>!['summary','meta'].includes(k)).map(([k,v])=>Array.isArray(v)?'<h3>'+esc(k)+'</h3>'+table(v):'').join('');ref.onclick=load}
function dashboard(d){module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Dashboard</h2><div class="row"><button id="open">Abrir caixa</button><button id="close">Fechar caixa</button><button id="ref">Atualizar</button></div></div>'+cards(d.summary||{})+(d.action_queue?'<h3>Atenção</h3>'+table(d.action_queue):'')+(d.cash?'<h3>Caixa</h3>'+cards(d.cash):'')+(d.sales?'<h3>Últimas vendas</h3>'+table(d.sales,20):'');ref.onclick=load;open.onclick=async()=>{const v=prompt('Fundo inicial (€):','30');if(v===null)return;try{await api('open_cash',{openingFloat:Number(v),idempotencyKey:'bo-open-'+Date.now()});setStatus('Caixa aberta.');load()}catch(e){setStatus(e.message,true)}};close.onclick=async()=>{const id=prompt('ID da sessão de caixa:');if(!id)return;const v=prompt('Dinheiro contado (€):');if(v===null)return;try{await api('close_cash',{cashSession:id,countedCash:Number(v),idempotencyKey:'bo-close-'+Date.now()});setStatus('Caixa fechada.');load()}catch(e){setStatus(e.message,true)}}}
function products(d){const a=d.products||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Produtos</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="tableWrap"><table><thead><tr><th>SKU</th><th>Nome</th><th>Preço</th><th>Vendável</th><th>Stock</th><th>Ativo</th><th></th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.current_price==null?'—':eur(p.current_price))+'</td><td>'+esc(p.is_sellable)+'</td><td>'+esc(p.track_stock)+'</td><td>'+esc(p.is_active)+'</td><td><button class="editP" data-id="'+p.id+'">Editar</button></td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;document.querySelectorAll('.editP').forEach(b=>b.onclick=async()=>{const p=a.find(x=>x.id===b.dataset.id),name=prompt('Nome:',p.name);if(name===null)return;const price=prompt('Preço de venda (€). Vazio mantém:',p.current_price??'');if(price===null)return;try{await api('update_product',{product:p.id,name,isSellable:confirm('Vendável?'),trackStock:confirm('Controlar stock?'),isActive:confirm('Ativo?'),salePrice:price===''?null:Number(price)});setStatus('Produto atualizado.');load()}catch(e){setStatus(e.message,true)}})}
function suppliers(d){const sups=d.suppliers||[],invs=d.invoices||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Fornecedores / Faturas / Compras</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="card"><h3>Novo fornecedor</h3><div class="row"><input id="sn" class="grow" placeholder="Nome"><input id="st" placeholder="NIF"><button id="ss">Guardar</button></div></div><div class="card"><h3>Registar fatura</h3><div class="row"><select id="invSup" class="grow"><option value="">Sem fornecedor</option>'+sups.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><select id="invType"><option value="invoice">Fatura</option><option value="simplified_invoice">Fatura simplificada</option><option value="invoice_receipt">Fatura-recibo</option><option value="credit_note">Nota crédito</option><option value="receipt">Recibo</option><option value="other">Outro</option></select><input id="invNum" placeholder="N.º documento"><input id="invDate" type="date"><input id="invDue" type="date"><input id="invTotal" type="number" step="0.01" min="0" placeholder="Total €"><select id="invKind"><option value="stock">Stock</option><option value="general_expense">Despesa geral</option><option value="mixed">Mista</option></select><select id="invPay"><option value="unpaid">Não paga</option><option value="paid">Paga</option><option value="partially_paid">Parcial</option></select><input id="invFile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"><button id="saveInv" class="primary">Arquivar fatura</button></div><div class="muted">PDF ou imagem, máximo 10 MB. O ficheiro fica no arquivo privado do POS.</div></div><h3>Fornecedores</h3>'+table(sups)+'<h3>Faturas</h3>'+table(invs);ref.onclick=load;ss.onclick=async()=>{if(!sn.value.trim())return;try{await api('save_supplier',{name:sn.value.trim(),taxId:st.value||null});setStatus('Fornecedor guardado.');load()}catch(e){setStatus(e.message,true)}};saveInv.onclick=async()=>{const f=invFile.files[0];if(!f)return setStatus('Seleciona o ficheiro da fatura.',true);if(f.size>10485760)return setStatus('Ficheiro superior a 10 MB.',true);const total=Number(invTotal.value);if(!Number.isFinite(total))return setStatus('Indica o total.',true);const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});try{setStatus('A arquivar fatura...');await api('upload_invoice',{supplier:invSup.value||null,documentType:invType.value,documentNumber:invNum.value||null,documentDate:invDate.value||null,dueDate:invDue.value||null,purchaseKind:invKind.value,totalAmount:total,paymentStatus:invPay.value,fileName:f.name,mimeType:f.type,fileBase64:data});setStatus('Fatura arquivada.');load()}catch(e){setStatus(e.message,true)}}}
function expenses(d){const defs=d.definitions||[],occs=d.occurrences||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Despesas</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<h3>Configuração</h3><div class="tableWrap"><table><thead><tr><th>Despesa</th><th>Periodicidade</th><th>Valor</th><th>Dia</th><th></th></tr></thead><tbody>'+defs.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.recurrence_kind)+'</td><td>'+eur(x.default_amount)+'</td><td>'+esc(x.default_due_day??x.default_due_weekday??'—')+'</td><td><button class="cfgE" data-id="'+x.id+'">Configurar</button> <button class="schE" data-id="'+x.id+'">Agendar</button></td></tr>').join('')+'</tbody></table></div><h3>Ocorrências</h3><div class="tableWrap"><table><thead><tr><th>Despesa</th><th>Vencimento</th><th>Total</th><th>Pago</th><th>Pendente</th><th>Estado</th><th></th></tr></thead><tbody>'+occs.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.due_date)+'</td><td>'+eur(x.amount_due)+'</td><td>'+eur(x.amount_paid)+'</td><td>'+eur(x.outstanding)+'</td><td>'+esc(x.status)+'</td><td>'+(Number(x.outstanding)>0?'<button class="payE" data-id="'+x.id+'" data-out="'+x.outstanding+'">Pagar</button>':'')+'</td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;document.querySelectorAll('.cfgE').forEach(b=>b.onclick=async()=>{const x=defs.find(v=>v.id===b.dataset.id),amount=prompt('Valor base (€):',x.default_amount??'');if(amount===null)return;const day=prompt(x.recurrence_kind==='weekly'?'Dia da semana (1-7):':'Dia do mês (1-31):',x.default_due_day??x.default_due_weekday??'');if(day===null)return;try{await api('configure_expense',{definition:x.id,amount:Number(amount),dueDay:x.recurrence_kind==='weekly'?null:Number(day),dueWeekday:x.recurrence_kind==='weekly'?Number(day):null});setStatus('Despesa configurada.');load()}catch(e){setStatus(e.message,true)}});document.querySelectorAll('.schE').forEach(b=>b.onclick=async()=>{const x=defs.find(v=>v.id===b.dataset.id),ps=prompt('Início do período (AAAA-MM-DD):',new Date().toISOString().slice(0,10));if(!ps)return;const pe=prompt('Fim do período (AAAA-MM-DD):',ps);if(!pe)return;const due=prompt('Vencimento (AAAA-MM-DD):',pe);if(!due)return;const amount=prompt('Valor (€):',x.default_amount||'');if(!amount)return;try{await api('schedule_expense',{definition:x.id,periodStart:ps,periodEnd:pe,dueDate:due,amount:Number(amount),notes:'Agendada no Back Office'});setStatus('Despesa agendada.');load()}catch(e){setStatus(e.message,true)}});document.querySelectorAll('.payE').forEach(b=>b.onclick=async()=>{const amount=prompt('Valor a pagar (€):',b.dataset.out);if(!amount)return;const method=prompt('Método: cash, mb_way, bank_transfer, direct_debit ou other','cash');if(!method)return;try{await api('pay_expense',{occurrence:b.dataset.id,amount:Number(amount),method,idempotencyKey:'bo-exp-'+b.dataset.id+'-'+Date.now()});setStatus('Pagamento registado.');load()}catch(e){setStatus(e.message,true)}})}
function stock(d){const bal=d.balances||[],cnt=d.counts||[];if(!selectedStockCount){const x=cnt.find(x=>x.status==='draft');if(x)selectedStockCount=x.id}module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Stock</h2><div class="row"><button id="nf">Novo completo</button><button id="nc">Novo cíclico</button><button id="post" class="primary">Lançar selecionado</button><button id="ref">Atualizar</button></div></div>'+cards(d.summary||{})+'<p class="muted">Selecionado: <strong>'+esc(selectedStockCount||'nenhum')+'</strong></p><h3>Inventários</h3><div class="tableWrap"><table><tbody>'+cnt.map(c=>'<tr><td><button class="sel" data-id="'+c.id+'">'+(c.id===selectedStockCount?'Selecionado':'Selecionar')+'</button></td><td>'+c.count_type+'</td><td>'+c.status+'</td><td>'+esc(c.cutoff_at)+'</td><td>'+esc(c.line_count)+'</td></tr>').join('')+'</tbody></table></div><h3>Contagem física</h3><div class="tableWrap"><table><tbody>'+bal.map(b=>'<tr><td>'+esc(b.name||b.sku)+'</td><td>'+esc(b.quantity_on_hand)+'</td><td><input class="stockInput" id="q_'+b.product_id+'" type="number" min="0" step="0.001"></td><td><button class="saveL" data-p="'+b.product_id+'">Guardar</button></td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;document.querySelectorAll('.sel').forEach(b=>b.onclick=()=>{selectedStockCount=b.dataset.id;stock(d)});const create=async t=>{try{const j=await api('create_stock_count',{countType:t,cutoff:new Date().toISOString(),notes:'Criado no Back Office'});selectedStockCount=j.result.stock_count_id;setStatus('Inventário criado.');load()}catch(e){setStatus(e.message,true)}};nf.onclick=()=>create('full');nc.onclick=()=>create('cycle');document.querySelectorAll('.saveL').forEach(b=>b.onclick=async()=>{if(!selectedStockCount)return setStatus('Seleciona um inventário.',true);const i=document.getElementById('q_'+b.dataset.p);if(i.value==='')return setStatus('Introduz quantidade.',true);try{await api('save_stock_count_line',{stockCount:selectedStockCount,product:b.dataset.p,quantity:Number(i.value)});setStatus('Contagem guardada.')}catch(e){setStatus(e.message,true)}});post.onclick=async()=>{if(!selectedStockCount)return setStatus('Seleciona um inventário.',true);if(!confirm('Lançar e ajustar stock?'))return;try{const j=await api('post_stock_count',{stockCount:selectedStockCount,idempotencyKey:'bo-stock-'+selectedStockCount});setStatus('Inventário lançado; ajustes: '+(j.result.adjustment_movements??0));selectedStockCount='';load()}catch(e){setStatus(e.message,true)}}}
async function load(){try{setStatus('A carregar...');const j=await api(current),d=j.dashboard||j.salesAccounts||j.products||j.suppliersInvoicesPurchases||j.expenses||j.stock||j;if(current==='dashboard')dashboard(d);else if(current==='products')products(d);else if(current==='suppliers_invoices_purchases')suppliers(d);else if(current==='expenses')expenses(d);else if(current==='stock')stock(d);else generic(mods.find(x=>x[0]===current)[1],d);setStatus('Atualizado.')}catch(e){setStatus(e.message,true)}}async function loginNow(){loginMsg.textContent='';try{const j=await api('login',{operatorCode:code.value.trim(),pin:pin.value});token=j.token;sessionStorage.setItem('bo_token',token);who.textContent=j.operator||'Administrador';login.classList.add('hidden');app.classList.remove('hidden');navBuild();dashboard(j.dashboard);setStatus('Sessão iniciada.')}catch(e){loginMsg.textContent=e.message;loginMsg.className='err'}}async function logout(){try{if(token)await api('logout')}catch{}sessionStorage.removeItem('bo_token');location.reload()}loginBtn.onclick=loginNow;pin.addEventListener('keydown',e=>{if(e.key==='Enter')loginNow()});if(token){login.classList.add('hidden');app.classList.remove('hidden');navBuild();load()}
</script></body></html>
