<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDR Quinta Nova — Back Office</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#171717}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.nav{display:flex;gap:8px;overflow:auto}.nav button.active{font-weight:800;border-color:#222}button,input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:10px;background:#fff}button{cursor:pointer}.primary{background:#171717;color:#fff;border-color:#171717}.danger{border-color:#a00;color:#a00}.hidden{display:none}.muted{color:#666;font-size:13px}.err{color:#a00;white-space:pre-wrap}.kpi{font-size:24px;font-weight:800}.tableWrap{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#fafafa}.tag{font-size:12px;border:1px solid #bbb;border-radius:999px;padding:3px 8px}.stockInput{width:90px}.grow{flex:1;min-width:160px}</style></head><body><header><div><strong>GDR Quinta Nova — Back Office</strong> <span class="tag">laboratório operacional</span></div><div id="who" class="muted"></div></header><main class="wrap"><section id="login" class="card"><h2>Entrar</h2><div class="row"><input id="code" placeholder="Código do operador"><input id="pin" type="password" placeholder="PIN"><button id="loginBtn" class="primary">Entrar</button></div><div id="loginMsg" class="muted"></div></section><section id="app" class="hidden"><div class="card"><div class="nav" id="nav"></div></div><div id="status" class="card muted">Pronto.</div><div id="module" class="card"></div></section></main><script>
const API='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pos_backoffice_api';let token=sessionStorage.getItem('bo_token')||'',current='dashboard',selectedStockCount='';const mods=[['dashboard','Dashboard'],['sales_accounts','Vendas / Contas'],['products','Produtos'],['suppliers_invoices_purchases','Fornecedores / Faturas / Compras'],['expenses','Despesas'],['stock','Stock'],['operators','Operadores']];const esc=v=>String(v==null?'':v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(v||0));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...payload})});const j=await r.json().catch(()=>({error:'Resposta inválida'}));if(!r.ok||j.ok===false)throw new Error((j.error||('HTTP '+r.status))+(j.detail?' — '+j.detail:''));return j}function setStatus(t,b=false){status.textContent=t;status.className='card '+(b?'err':'muted')}function navBuild(){nav.innerHTML=mods.map(m=>'<button data-m="'+m[0]+'" class="'+(m[0]===current?'active':'')+'">'+m[1]+'</button>').join('')+'<button id="out">Sair</button>';nav.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{current=b.dataset.m;navBuild();load()});out.onclick=logout}function cards(o){if(!o||typeof o!=='object'||Array.isArray(o))return'';return'<div class="grid">'+Object.entries(o).filter(x=>x[1]==null||['string','number','boolean'].includes(typeof x[1])).map(x=>'<div class="card"><div class="muted">'+esc(x[0])+'</div><div class="kpi">'+esc(x[1])+'</div></div>').join('')+'</div>'}function table(a,lim=100){if(!Array.isArray(a)||!a.length)return'<div class="muted">Sem registos.</div>';const r=a.slice(0,lim),k=[...new Set(r.flatMap(o=>o&&typeof o==='object'?Object.keys(o):[]))].slice(0,10);return'<div class="tableWrap"><table><thead><tr>'+k.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+r.map(o=>'<tr>'+k.map(x=>'<td>'+esc(typeof o[x]==='object'?JSON.stringify(o[x]):o[x])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function generic(title,d){module.innerHTML='<div class="row" style="justify-content:space-between"><h2>'+title+'</h2><button id="ref">Atualizar</button></div>'+(d.summary?cards(d.summary):'')+Object.entries(d||{}).filter(([k])=>!['summary','meta'].includes(k)).map(([k,v])=>Array.isArray(v)?'<h3>'+esc(k)+'</h3>'+table(v):'').join('');ref.onclick=load}
function salesAccounts(d){const sales=d.sales||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Vendas / Contas</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<h3>Vendas</h3><div class="tableWrap"><table><thead><tr><th>N.º</th><th>Cliente</th><th>Estado</th><th>Total</th><th>Pago</th><th>Pendente</th><th>Ações</th></tr></thead><tbody>'+sales.map(s=>'<tr><td>'+esc(s.official_number||'—')+'</td><td>'+esc(s.customer)+'</td><td>'+esc(s.operational_status+' / '+s.financial_status)+'</td><td>'+eur(s.total_amount)+'</td><td>'+eur(s.paid_amount)+'</td><td>'+eur(s.outstanding_amount)+'</td><td><button class="detailSale" data-id="'+s.id+'">Detalhe</button></td></tr>').join('')+'</tbody></table></div><div id="saleDetailBox"></div>'+(Array.isArray(d.customer_balances)&&d.customer_balances.length?'<h3>Saldos por cliente</h3>'+table(d.customer_balances):'')+(Array.isArray(d.receivables)&&d.receivables.length?'<h3>Pendentes</h3>'+table(d.receivables):'');ref.onclick=load;document.querySelectorAll('.detailSale').forEach(b=>b.onclick=()=>openSaleDetail(b.dataset.id))}
async function openSaleDetail(id){try{setStatus('A carregar detalhe...');const j=await api('sale_detail',{saleId:id}),d=j.saleDetail||{},s=d.sale||{};const canDiscard=s.operational_status==='draft'&&s.financial_status==='unpaid'&&(!d.lines||d.lines.length===0)&&(!d.payments||d.payments.length===0);saleDetailBox.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h3>Detalhe — '+esc(s.customer||'Conta')+'</h3><div class="row">'+(canDiscard?'<button id="discardDraft" class="danger">Eliminar rascunho vazio</button>':'')+'<button id="closeDetail">Fechar</button></div></div>'+cards({numero:s.official_number||'—',estado:(s.operational_status||'')+' / '+(s.financial_status||''),total:eur(s.total_amount),pago:eur(s.paid_amount),pendente:eur(s.outstanding_amount),criado_por:s.created_by||'—'})+'<h4>Linhas</h4>'+table(d.lines||[])+'<h4>Pagamentos</h4>'+table(d.payments||[])+'<h4>Recebíveis</h4>'+table(d.receivables||[])+'<h4>Histórico</h4>'+table(d.history||[])+'</div>';closeDetail.onclick=()=>saleDetailBox.innerHTML='';if(canDiscard)discardDraft.onclick=async()=>{if(!confirm('Eliminar este rascunho vazio? Esta ação só é permitida se continuar sem consumo e sem pagamentos.'))return;try{await api('discard_empty_draft',{saleId:id});setStatus('Rascunho vazio eliminado.');await load()}catch(e){setStatus(e.message,true)}};setStatus('Detalhe carregado.')}catch(e){setStatus(e.message,true)}}
function stock(d){const balances=d.balances||[],counts=d.counts||[],drafts=counts.filter(c=>c.status==='draft');const active=drafts[0]||null;selectedStockCount=active?active.id:'';const existing=new Map((d.draft_detail||[]).filter(x=>!active||x.stock_count_id===active.id).map(x=>[x.product_id,x]));module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Stock</h2><div class="row"><button id="newCycle">Novo inventário parcial</button><button id="newFull">Novo inventário total</button><button id="ref">Atualizar</button></div></div>'+cards(d.summary||{})+(active?'<div class="card"><h3>Inventário em curso</h3><div class="muted">Tipo: '+esc(active.count_type)+' · criado em '+esc(active.created_at)+' · linhas: '+esc(active.line_count)+'</div><div class="tableWrap"><table><thead><tr><th>SKU</th><th>Produto</th><th>Stock atual</th><th>Contagem física</th><th>Ação</th></tr></thead><tbody>'+balances.map(p=>{const ex=existing.get(p.product_id);return'<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.quantity_on_hand==null?'—':p.quantity_on_hand)+'</td><td><input class="stockInput qty" data-product="'+p.product_id+'" value="'+esc(ex?ex.counted_quantity:'')+'" inputmode="decimal"></td><td><button class="saveQty" data-product="'+p.product_id+'">Guardar</button></td></tr>'}).join('')+'</tbody></table></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button id="postCount" class="primary">Lançar inventário</button></div></div>':'<div class="card muted">Não existe inventário em curso.</div>')+'<h3>Saldos atuais</h3>'+table(balances,100)+'<h3>Histórico de inventários</h3>'+table(counts,50)+'<h3>Movimentos recentes</h3>'+table(d.recent_movements||[],50);ref.onclick=load;newCycle.onclick=()=>createCount('cycle');newFull.onclick=()=>createCount('full');document.querySelectorAll('.saveQty').forEach(b=>b.onclick=async()=>{const product=b.dataset.product,input=document.querySelector('.qty[data-product="'+product+'"]'),v=input.value.trim();if(v===''||Number(v)<0||!Number.isFinite(Number(v)))return setStatus('Quantidade inválida.',true);try{await api('save_stock_count_line',{stockCount:selectedStockCount,product,quantity:Number(v)});setStatus('Quantidade guardada.');}catch(e){setStatus(e.message,true)}});if(active)postCount.onclick=async()=>{if(!confirm('Lançar este inventário? Serão criados movimentos de ajuste de stock.'))return;try{const j=await api('post_stock_count',{stockCount:selectedStockCount,idempotencyKey:'bo-stock-post-'+selectedStockCount+'-'+Date.now()});setStatus('Inventário lançado.');await load()}catch(e){setStatus(e.message,true)}}}
async function createCount(type){if(selectedStockCount&&!confirm('Já existe um inventário em curso. Criar outro na mesma?'))return;try{const j=await api('create_stock_count',{countType:type,cutoff:new Date().toISOString(),notes:'Inventário de teste criado no Back Office'});setStatus('Inventário criado.');await load()}catch(e){setStatus(e.message,true)}}
function operators(d){const a=d.operators||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Operadores</h2><button id="ref">Atualizar</button></div><div class="card"><h3>Novo operador</h3><div class="row"><input id="opCode" placeholder="Código (ex.: GONCALO)"><input id="opName" class="grow" placeholder="Nome"><input id="opEmail" placeholder="Email opcional"><select id="opRole"><option value="OPERADOR_VENDAS">Operador de vendas</option><option value="ADMIN_FUNCIONAL">Administrador funcional</option></select><button id="opCreate" class="primary">Criar</button></div></div><div class="tableWrap"><table><thead><tr><th>Código</th><th>Nome</th><th>Perfil</th><th>Ativo</th><th>Ações</th></tr></thead><tbody>'+a.map(o=>'<tr><td><strong>'+esc(o.operator_code)+'</strong></td><td>'+esc(o.display_name)+'</td><td>'+esc((o.roles||[]).join(', '))+'</td><td>'+esc(o.is_active)+'</td><td><button class="editOp" data-id="'+o.id+'">Editar</button> <button class="pinOp" data-id="'+o.id+'">Redefinir PIN</button></td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;opCreate.onclick=async()=>{const c=opCode.value.trim(),n=opName.value.trim();if(!c||!n)return setStatus('Código e nome são obrigatórios.',true);try{await api('save_operator',{operatorCode:c,displayName:n,email:opEmail.value||null,isActive:true,roleCode:opRole.value});setStatus('Operador criado.');load()}catch(e){setStatus(e.message,true)}};document.querySelectorAll('.editOp').forEach(b=>b.onclick=async()=>{const o=a.find(x=>x.id===b.dataset.id);const name=prompt('Nome:',o.display_name);if(name===null)return;const active=confirm('Operador ativo? OK=Sim / Cancelar=Não');const role=prompt('Perfil: OPERADOR_VENDAS ou ADMIN_FUNCIONAL',(o.roles||[])[0]||'OPERADOR_VENDAS');if(!role)return;try{await api('save_operator',{operator:o.id,displayName:name,email:o.email||null,isActive:active,roleCode:role});setStatus('Operador atualizado.');load()}catch(e){setStatus(e.message,true)}});document.querySelectorAll('.pinOp').forEach(b=>b.onclick=async()=>{const o=a.find(x=>x.id===b.dataset.id);const p=prompt('Novo PIN para '+o.operator_code+' (4 a 8 dígitos):');if(p===null)return;if(!/^\d{4,8}$/.test(p))return setStatus('PIN inválido: usa 4 a 8 dígitos.',true);try{await api('set_operator_pin',{operator:o.id,newPin:p});setStatus('PIN de '+o.operator_code+' redefinido e sessões anteriores terminadas.');}catch(e){setStatus(e.message,true)}})}
function dashboard(d){module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Dashboard</h2><div class="row"><button id="open">Abrir caixa</button><button id="close">Fechar caixa</button><button id="ref">Atualizar</button></div></div>'+cards(d.summary||{})+(d.action_queue?'<h3>Atenção</h3>'+table(d.action_queue):'')+(d.cash?'<h3>Caixa</h3>'+cards(d.cash):'')+(d.sales?'<h3>Últimas vendas</h3>'+table(d.sales,20):'');ref.onclick=load;open.onclick=async()=>{const v=prompt('Fundo inicial (€):','30');if(v===null)return;try{await api('open_cash',{openingFloat:Number(v),idempotencyKey:'bo-open-'+Date.now()});setStatus('Caixa aberta.');load()}catch(e){setStatus(e.message,true)}};close.onclick=async()=>{const id=prompt('ID da sessão de caixa:');if(!id)return;const v=prompt('Dinheiro contado (€):');if(v===null)return;try{await api('close_cash',{cashSession:id,countedCash:Number(v),idempotencyKey:'bo-close-'+Date.now()});setStatus('Caixa fechada.');load()}catch(e){setStatus(e.message,true)}}}
function products(d){const a=d.products||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Produtos</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="tableWrap"><table><thead><tr><th>SKU</th><th>Nome</th><th>Preço</th><th>Vendável</th><th>Stock</th><th>Ativo</th><th></th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.current_price==null?'—':eur(p.current_price))+'</td><td>'+esc(p.is_sellable)+'</td><td>'+esc(p.track_stock)+'</td><td>'+esc(p.is_active)+'</td><td><button class="editP" data-id="'+p.id+'">Editar</button></td></tr>').join('')+'</tbody></table></div>';ref.onclick=load;document.querySelectorAll('.editP').forEach(b=>b.onclick=async()=>{const p=a.find(x=>x.id===b.dataset.id),name=prompt('Nome:',p.name);if(name===null)return;const price=prompt('Preço de venda (€). Vazio mantém:',p.current_price??'');if(price===null)return;try{await api('update_product',{product:p.id,name,isSellable:confirm('Vendável?'),trackStock:confirm('Controlar stock?'),isActive:confirm('Ativo?'),salePrice:price===''?null:Number(price)});setStatus('Produto atualizado.');load()}catch(e){setStatus(e.message,true)}})}
function suppliers(d){const a=d.suppliers||[],inv=d.invoices||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Fornecedores / Faturas / Compras</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="card"><h3>Novo fornecedor</h3><div class="row"><input id="supCode" placeholder="Código"><input id="supName" class="grow" placeholder="Nome"><input id="supNif" placeholder="NIF"><input id="supPhone" placeholder="Telefone"><input id="supEmail" placeholder="Email"><button id="saveSup" class="primary">Guardar fornecedor</button></div></div><div class="card"><h3>Registar fatura</h3><div class="row"><select id="invSupplier"><option value="">Fornecedor opcional</option>'+a.map(s=>'<option value="'+s.id+'">'+esc(s.display_name)+'</option>').join('')+'</select><input id="invNum" placeholder="N.º documento"><input id="invDate" type="date"><input id="invDue" type="date"><input id="invTotal" type="number" step="0.01" placeholder="Total €"><select id="invPay"><option value="unpaid">Por pagar</option><option value="paid">Pago</option></select><input id="invFile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"><button id="uploadInv" class="primary">Carregar fatura</button></div><div class="muted">PDF ou imagem, máximo 10 MB.</div></div><h3>Fornecedores</h3>'+table(a,100)+'<h3>Faturas</h3>'+table(inv,100)+'<h3>Ordens de compra</h3>'+table(d.purchase_orders||[],50)+'<h3>Receções de mercadoria</h3>'+table(d.goods_receipts||[],50);ref.onclick=load;saveSup.onclick=async()=>{const name=supName.value.trim();if(!name)return setStatus('Nome do fornecedor obrigatório.',true);try{await api('save_supplier',{code:supCode.value||null,name,taxId:supNif.value||null,phone:supPhone.value||null,email:supEmail.value||null});setStatus('Fornecedor guardado.');await load()}catch(e){setStatus(e.message,true)}};uploadInv.onclick=async()=>{const f=invFile.files[0],total=Number(invTotal.value);if(!f||!Number.isFinite(total))return setStatus('Seleciona um ficheiro e indica o total.',true);if(f.size>10485760)return setStatus('Ficheiro superior a 10 MB.',true);try{setStatus('A carregar fatura...');const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});await api('upload_invoice',{supplier:invSupplier.value||null,fileName:f.name,mimeType:f.type,fileBase64:b64,documentType:'invoice',documentNumber:invNum.value||null,documentDate:invDate.value||null,dueDate:invDue.value||null,purchaseKind:'stock',totalAmount:total,paymentStatus:invPay.value});setStatus('Fatura registada.');await load()}catch(e){setStatus(e.message,true)}}}function expenses(d){const defs=d.definitions||[],occ=d.occurrences||[],pays=d.payments||[];module.innerHTML='<div class="row" style="justify-content:space-between"><h2>Despesas</h2><button id="ref">Atualizar</button></div>'+cards(d.summary||{})+'<div class="card"><h3>Configurar obrigação</h3><div class="row"><select id="expDef"><option value="">Selecionar</option>'+defs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><input id="expAmount" type="number" step="0.01" placeholder="Valor €"><input id="expDueDay" type="number" min="1" max="31" placeholder="Dia do mês"><input id="expDueWeekday" type="number" min="1" max="7" placeholder="Dia semana 1-7"><button id="expCfg" class="primary">Guardar configuração</button></div></div><div class="card"><h3>Agendar despesa</h3><div class="row"><select id="schDef"><option value="">Selecionar</option>'+defs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><input id="schStart" type="date"><input id="schEnd" type="date"><input id="schDue" type="date"><input id="schAmount" type="number" step="0.01" placeholder="Valor €"><input id="schNotes" class="grow" placeholder="Notas"><button id="schBtn" class="primary">Criar ocorrência</button></div></div><h3>Definições</h3>'+table(defs,100)+'<h3>Ocorrências</h3>  function point(d){const s=d.summary||d.kpis||{},cash=d.cash||{},q=(d.action_queue||d.actions||[]).filter(x=>Number(x.count||0)>0),sales=s.sales_total||s.sales_total_amount||s.total_sales||0,open=s.open_sales_count||s.draft_count||s.sales_draft||0,recv=s.receivables_total||s.outstanding_total||s.receivables_open_total||0;const high=q.filter(x=>x.severity==='high').length;const cls=high?'high':q.length?'warn':'ok';const headline=high?'Há assuntos prioritários':q.length?'Há assuntos que requerem atenção':'Tudo operacional';const detail=high?high+' situação(ões) prioritária(s).':q.length?q.length+' assunto(s) por acompanhar.':'Sem alertas operacionais neste momento.';module.innerHTML='<div class="boTitle"><h2>Ponto de Situação</h2><small>Agora</small></div><div class="psStatus '+cls+'"><span class="dot"></span><div><b>'+headline+'</b><small>'+detail+'</small></div></div>'+(q.length?'<div class="psSection">Requer atenção</div><div class="boAlerts">'+q.slice(0,5).map(x=>'<div class="boAlert '+(x.severity==='high'?'high':'')+'"><b>'+alertText(x.code)+'</b><span>'+Number(x.count||0)+'</span></div>').join('')+'</div>':'')+'<div class="psSection">Hoje</div><div class="boKpis"><button class="boKpi" data-k="sales"><div class="ico">€</div><small>Vendas</small><strong>'+eur(sales)+'</strong></button><button class="boKpi" data-k="open"><div class="ico">▤</div><small>Contas abertas</small><strong>'+Number(open)+'</strong></button><button class="boKpi" data-k="cash"><div class="ico">◉</div><small>Caixa</small><strong>'+(cash.status==='open'?'Aberta':cash.status==='closed'?'Fechada':'—')+'</strong></button><button class="boKpi" data-k="recv"><div class="ico">↘</div><small>A receber</small><strong>'+eur(recv)+'</strong></button></div><div class="psSection">Gestão</div><div class="boActions">'+[['▤','Vendas e contas','sales_accounts'],['▦','Produtos','products'],['▣','Compras','suppliers_invoices_purchases'],['▥','Fornecedores','suppliers_invoices_purchases'],['−€','Despesas','expenses'],['▥','Stock','stock'],['●●','Operadores','operators'],['€','Caixa','cash']].map(x=>'<button class="boAction" data-go="'+x[2]+'"><span class="ico">'+x[0]+'</span><b>'+x[1]+'</b></button>').join('')+'</div><div class="boReady">✓ Sistema operacional</div>';module.querySelector('[data-k="sales"]').onclick=()=>goPS('sales_accounts');module.querySelector('[data-k="open"]').onclick=()=>goPS('sales_accounts');module.querySelector('[data-k="recv"]').onclick=()=>goPS('sales_accounts');module.querySelector('[data-k="cash"]').onclick=()=>cashPS(cash);module.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='cash'?cashPS(cash):goPS(b.dataset.go))}
 function rename(){document.querySelectorAll('button,h1,h2,h3').forEach(e=>{const t=(e.textContent||'').trim();if(t==='Dashboard')e.textContent='Ponto de Situação';if(t==='← Voltar ao Dashboard')e.textContent='← Voltar ao Ponto de Situação'});if(typeof window.dashboard==='function'&&!window.dashboard.__point){window.dashboard=point;window.dashboard.__point=true;window.dashboard.__human2=true}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',rename);else rename();new MutationObserver(rename).observe(document.documentElement,{subtree:true,childList:true});setInterval(rename,400);
})();
</script><!-- PUG_PONTO_SITUACAO_V1_END --></body></html>
