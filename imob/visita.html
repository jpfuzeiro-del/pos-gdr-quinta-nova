<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://kvqfekjjsxjrtwwdplrn.supabase.co; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>Ficha de visita</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f5}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:680px;margin:0 auto}.card{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.05)}h1{font-size:1.45rem;margin:0 0 12px}.identity{background:#f7f7f7;border:1px solid #e5e5e5;border-radius:13px;padding:12px 14px;margin:0 0 12px}.meta{color:#444;margin:5px 0;line-height:1.35}.hint{color:#666;font-size:.94rem;line-height:1.45;margin:14px 0 22px}.q{padding:17px 0;border-top:1px solid #eee}.label{font-weight:700;margin-bottom:10px;line-height:1.3}.scale,.choices{display:flex;gap:8px;flex-wrap:wrap}.opt{position:relative;cursor:pointer}.opt input{position:absolute;opacity:0;pointer-events:none}.pill{display:flex;align-items:center;justify-content:center;min-width:48px;min-height:46px;padding:9px 13px;border:1px solid #ccc;border-radius:12px;background:#fff;font-weight:650;transition:.12s}.opt input:checked+.pill{border:2px solid #111;background:#efefef;padding:8px 12px}.opt input:focus-visible+.pill{outline:3px solid #777;outline-offset:2px}.legend{display:flex;justify-content:space-between;max-width:270px;color:#777;font-size:.78rem;margin-top:7px}textarea{width:100%;min-height:82px;padding:12px;border:1px solid #ccc;border-radius:12px;font:inherit;resize:vertical}.submit{width:100%;border:0;border-radius:13px;background:#111;color:#fff;font-weight:750;font-size:1rem;padding:16px;margin-top:22px;cursor:pointer}.submit:disabled{opacity:.5;cursor:wait}.status{text-align:center;padding:30px 8px;line-height:1.5}.status h1{margin-bottom:12px}.error{background:#fff3f3;border:1px solid #efb8b8;padding:12px;border-radius:12px;margin:12px 0;color:#7d1111}.loading{padding:40px 0;text-align:center;color:#666}.small{font-size:.82rem;color:#777;margin-top:20px;text-align:center}@media(max-width:420px){body{padding:10px}.card{padding:16px}.pill{min-width:44px}.choices .pill{min-width:auto}}
</style>
</head>
<body><main class="wrap"><section class="card" id="app"><div class="loading">A abrir a ficha…</div></section></main>
<script>
const API='https://kvqfekjjsxjrtwwdplrn.supabase.co/functions/v1/imob_visita_feedback';
const app=document.getElementById('app');
const key='pug_imob_visit_token';
let token='';
try{const hp=new URLSearchParams(location.hash.slice(1));token=hp.get('t')||sessionStorage.getItem(key)||'';if(hp.get('t')){sessionStorage.setItem(key,token);history.replaceState(null,'',location.pathname)}}catch(_){token=''}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(name,label){return '<div class="q"><div class="label">'+esc(label)+'</div><div class="scale">'+[1,2,3,4,5].map(n=>'<label class="opt"><input required type="radio" name="'+name+'" value="'+n+'"><span class="pill">'+n+'</span></label>').join('')+'</div><div class="legend"><span>Não gostei</span><span>Gostei muito</span></div></div>'}
function choice(name,label,opts){return '<div class="q"><div class="label">'+esc(label)+'</div><div class="choices">'+opts.map(o=>'<label class="opt"><input required type="radio" name="'+name+'" value="'+o[0]+'"><span class="pill">'+esc(o[1])+'</span></label>').join('')+'</div></div>'}
function textq(name,label){return '<div class="q"><div class="label">'+esc(label)+'</div><textarea name="'+name+'" maxlength="1500" placeholder="Escreve aqui…"></textarea></div>'}
async function call(action,answers){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,answers})});const j=await r.json().catch(()=>({ok:false,error:'invalid_response'}));if(!r.ok||!j.ok)throw new Error(j.error||('http_'+r.status));return j}
function fail(msg){app.innerHTML='<div class="status"><h1>Não foi possível abrir a ficha.</h1><p>'+esc(msg||'Tenta novamente a partir do link que o João te enviou.')+'</p></div>'}
function thanks(name){sessionStorage.removeItem(key);app.innerHTML='<div class="status"><h1>Obrigada, '+esc(name||'cliente')+'! ✓</h1><p>A tua avaliação ficou registada.</p></div>'}
function render(data){if(data.state==='submitted'){thanks(data.client_name);return}const f=data.form||{},m=f.property_meta||{};const meta=[m.typology,m.area_m2?m.area_m2+' m²':'',m.price_eur?Number(m.price_eur).toLocaleString('pt-PT')+' €':''].filter(Boolean).join(' · ');app.innerHTML='<h1>Ficha de visita</h1><div class="identity"><p class="meta"><strong>Cliente:</strong> '+esc(f.client_name||'—')+'</p><p class="meta"><strong>Imóvel:</strong> '+esc(f.property_label||'—')+'</p>'+(meta?'<p class="meta">'+esc(meta)+'</p>':'')+'</div><p class="hint">Toca diretamente na opção que melhor representa a tua opinião. Nas notas, 1 = não gostei e 5 = gostei muito.</p><form id="visitForm">'+
score('impressao_geral','1. Impressão geral do imóvel')+score('localizacao','2. Localização / zona')+score('predio_acessos','3. Prédio e acessos')+score('distribuicao','4. Distribuição dos espaços')+score('areas','5. Tamanho das divisões')+score('luz_natural','6. Luz natural')+score('cozinha','7. Cozinha')+score('casa_banho','8. Casa de banho')+score('acabamentos','9. Estado / acabamentos')+score('qualidade_preco','10. Relação qualidade/preço')+
choice('imaginar_viver','11. Conseguias imaginar-te a viver aqui?',[['sim','Sim'],['talvez','Talvez'],['nao','Não']])+choice('percecao_preco','12. O preço parece-te:',[['bom','Bom'],['justo','Justo'],['alto','Alto'],['muito_alto','Muito alto']])+choice('decisao','13. Neste momento, o que queres fazer com este imóvel?',[['excluir','Excluir'],['guardar','Guardar'],['favorito','Favorito'],['revisitar','Voltar a visitar'],['avancar','Avançar']])+
textq('mais_gostou','14. O que mais gostaste?')+textq('menos_gostou','15. O que menos gostaste?')+textq('motivo_exclusao','16. Há alguma coisa que te faria excluir este imóvel?')+textq('sim_claro','17. O que teria de mudar para ser um “sim” claro?')+'<div id="err"></div><button class="submit" type="submit">Enviar resposta</button></form><p class="small">A resposta é guardada no processo desta visita.</p>';
const form=document.getElementById('visitForm');form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form),a={};for(const [k,v] of fd.entries())a[k]=['impressao_geral','localizacao','predio_acessos','distribuicao','areas','luz_natural','cozinha','casa_banho','acabamentos','qualidade_preco'].includes(k)?Number(v):v;const btn=form.querySelector('button');btn.disabled=true;document.getElementById('err').innerHTML='';try{const out=await call('submit',a);thanks(out.client_name||f.client_name)}catch(err){btn.disabled=false;document.getElementById('err').innerHTML='<div class="error">Não consegui enviar. Confirma a ligação à internet e tenta novamente.</div>'}})}
(async()=>{if(!token){fail('O link está incompleto. Pede ao João que te envie novamente a ficha.');return}try{const data=await call('load');render(data)}catch(e){fail('Este link não está ativo ou ocorreu um erro ao abrir a ficha.')}})();
</script>
</body></html>
