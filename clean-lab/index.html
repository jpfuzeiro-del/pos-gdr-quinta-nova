<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PUG POS Clean Lab</title><style>body{font-family:system-ui;margin:0;background:#f5f7f9;color:#17233a}main{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit}button{padding:14px 16px;border:0;border-radius:14px;background:#e8eef3;font-weight:750}button.primary{background:#15803d;color:white}button.warn{background:#b45309;color:white}input{padding:13px;border:1px solid #ccd5dd;border-radius:12px;min-width:0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.muted{color:#64748b}.big{font-size:28px;font-weight:800}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f6}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}</style></head><body><main><div class="top"><h1>POS Clean Lab</h1><span class="badge">LAB • produção intocada</span></div><div id="msg" class="muted"></div>
<section id="login" class="card"><h2>Entrada</h2><div class="row"><input id="code" placeholder="Operador"><input id="pin" type="password" placeholder="PIN"><button class="primary" onclick="login()">Entrar</button></div></section>
<section id="home" class="hidden"><div class="card"><div class="top"><div><div class="muted">Operador</div><b id="operator"></b></div><div class="row"><button onclick="showClients()">Abrir conta</button><button onclick="showAccounts()">Contas</button></div></div></div><div class="card"><h2>Famílias</h2><div id="families" class="grid"></div></div></section>
<section id="clients" class="hidden card"><div class="top"><h2>Clientes</h2><button onclick="neutral()">Voltar</button></div><input id="search" placeholder="Pesquisar" oninput="renderClients()" style="width:100%;box-sizing:border-box"><div id="clientList" class="grid" style="margin-top:12px"></div></section>
<section id="accounts" class="hidden card"><div class="top"><h2>Contas abertas</h2><button onclick="neutral()">Voltar</button></div><div id="accountList" class="grid"></div></section>
<section id="work" class="hidden"><div class="card"><div class="top"><div><div class="muted">Conta ativa</div><div id="accountName" class="big"></div></div><div class="big" id="accountTotal"></div></div><div id="lines"></div><div class="row" style="margin-top:12px"><button onclick="leaveOpen()">DEIXAR EM CONTA</button><button class="primary" onclick="receive()">RECEBER</button></div></div><div class="card"><div class="top"><h2>Produtos</h2><button onclick="neutral()">Famílias</button></div><div id="products" class="grid"></div></div></section>
<section id="payment" class="hidden card"><div class="top"><h2>Pagamento</h2><button onclick="showWork()">Voltar</button></div><div class="big" id="payTotal"></div><div class="row"><input id="tendered" inputmode="decimal" placeholder="Valor entregue"><button class="primary" onclick="payCash()">Dinheiro</button><button onclick="deferPay()">Conta corrente</button></div><div id="change" class="big" style="margin-top:12px"></div></section>
<script>
const URL='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const KEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';let token=null,data=null,activeAccount=null,activeCategory=null;
async function rpc(name,args){const r=await fetch(URL+name,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify(args)});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null}
function msg(x){document.getElementById('msg').textContent=x||''}
function hideAll(){['login','home','clients','accounts','work','payment'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
async function login(){try{msg('A entrar...');const r=await rpc('pos_front_login',{p_operator_code:code.value,p_pin:pin.value});token=r.token;await boot();operator.textContent=r.operator_name;neutral();msg('')}catch(e){msg('Erro: '+e.message)}}
async function boot(){data=await rpc('pos_front_bootstrap',{p_token:token});renderFamilies()}
function neutral(){activeAccount=null;activeCategory=null;hideAll();home.classList.remove('hidden');renderFamilies()}
function renderFamilies(){if(!data)return;families.innerHTML=(data.categories||[]).map(c=>'<button onclick="openCategory(''+c.id+'')">'+c.name+'</button>').join('')}
function openCategory(id){activeCategory=id;const ps=(data.products||[]).filter(p=>p.category_id===id);products.innerHTML=ps.map(p=>'<button onclick="addProduct(''+p.id+'')"><b>'+p.name+'</b><br>'+Number(p.price).toFixed(2)+' €</button>').join('');hideAll();work.classList.remove('hidden');renderAccount()}
function showClients(){hideAll();clients.classList.remove('hidden');renderClients()}
function renderClients(){const q=(search.value||'').toLowerCase();clientList.innerHTML=(data.customers||[]).filter(c=>c.display_name.toLowerCase().includes(q)).map(c=>'<button onclick="selectCustomer(''+c.id+'')">'+c.display_name+'</button>').join('')}
async function selectCustomer(id){try{const a=await rpc('pos_front_open_account',{p_token:token,p_customer:id,p_label:null});activeAccount={...a,id:a.sale_id};await boot();const fresh=(data.accounts||[]).find(x=>x.id===a.sale_id);if(fresh)activeAccount=fresh;showWork();}catch(e){msg(e.message)}}
function showAccounts(){hideAll();accounts.classList.remove('hidden');accountList.innerHTML=(data.accounts||[]).map(a=>'<button onclick="openExisting(''+a.id+'')">'+a.account_name+' — '+Number(a.total_amount).toFixed(2)+' €</button>').join('')||'<div class="muted">Sem contas abertas</div>'}
function openExisting(id){activeAccount=(data.accounts||[]).find(a=>a.id===id)||null;showWork()}
function showWork(){hideAll();work.classList.remove('hidden');if(!activeCategory&&data?.categories?.length)openCategory(data.categories[0].id);else renderAccount()}
function renderAccount(){accountName.textContent=activeAccount?.account_name||'Sem cliente';accountTotal.textContent=Number(activeAccount?.total_amount||0).toFixed(2)+' €';lines.innerHTML=(activeAccount?.lines||[]).map(l=>'<div class="line"><span>'+l.name+' × '+l.quantity+'</span><b>'+Number(l.line_total).toFixed(2)+' €</b></div>').join('')}
async function addProduct(id){if(!activeAccount){showClients();return}try{const saleId=activeAccount.id||activeAccount.sale_id;await rpc('pos_front_add_item',{p_token:token,p_sale:saleId,p_product:id,p_quantity:1});await boot();activeAccount=(data.accounts||[]).find(a=>a.id===saleId);renderAccount()}catch(e){msg(e.message)}}
function leaveOpen(){neutral()}
function receive(){if(!activeAccount)return;hideAll();payment.classList.remove('hidden');payTotal.textContent=Number(activeAccount.total_amount).toFixed(2)+' €';tendered.value=Number(activeAccount.total_amount).toFixed(2);change.textContent=''}
async function payCash(){try{const saleId=activeAccount.id;const v=Number(String(tendered.value).replace(',','.'));const r=await rpc('pos_front_pay',{p_token:token,p_sale:saleId,p_method:'cash',p_tendered:v});change.textContent='Troco: '+Number(r.change||0).toFixed(2)+' €';await boot();setTimeout(neutral,700)}catch(e){msg(e.message)}}
async function deferPay(){try{const saleId=activeAccount.id;await rpc('pos_front_pay',{p_token:token,p_sale:saleId,p_method:'deferred',p_tendered:null});await boot();neutral()}catch(e){msg(e.message)}}
</script></main></body></html>
