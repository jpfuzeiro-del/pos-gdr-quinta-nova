<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Clean Lab G2</title><style>body{font-family:system-ui;background:#f5f7f9;color:#17233a;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}input,button{font:inherit;padding:14px;border-radius:12px}input{border:1px solid #ccd5dd;box-sizing:border-box}button{border:0;font-weight:750;background:#e8eef3}.primary{background:#15803d;color:#fff}.hidden{display:none}.error{color:#b91c1c;white-space:pre-wrap}.ok{color:#166534}.muted{color:#64748b}</style></head><body><main><h1>POS Clean Lab</h1><p>LAB · produção intocada · G2</p><div id="status"></div><section id="loginBox" class="card"><h2>Entrada</h2><div class="row"><input id="operatorCode" placeholder="Operador"><input id="operatorPin" type="password" inputmode="numeric" placeholder="PIN"><button id="loginBtn" class="primary" type="button">Entrar</button></div></section><section id="homeBox" class="card hidden"><h2>G1 PASS</h2><p>Operador: <b id="operatorName"></b></p><p id="bootInfo"></p><button id="openClientsBtn" class="primary">ABRIR CLIENTE</button></section><section id="clientsBox" class="card hidden"><div class="row"><button id="backBtn">← Voltar</button><h2>Clientes</h2></div><input id="searchBox" style="width:100%" placeholder="Pesquisar cliente"><div id="clientList" class="grid" style="margin-top:12px"></div></section><section id="accountBox" class="card hidden"><h2>G2 PASS — cliente aberto</h2><p>Cliente: <b id="accountName"></b></p><p>Sale ID: <span id="saleId"></span></p><p>Total: <b id="accountTotal"></b></p><p>Linhas existentes: <b id="lineCount"></b></p><button id="accountBackBtn">← Voltar aos clientes</button></section><script>
const RPC='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const KEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';let token=null,data=null;
const $=id=>document.getElementById(id);const el={status:$('status'),login:$('loginBox'),home:$('homeBox'),clients:$('clientsBox'),account:$('accountBox'),code:$('operatorCode'),pin:$('operatorPin'),loginBtn:$('loginBtn'),operator:$('operatorName'),boot:$('bootInfo'),openClients:$('openClientsBtn'),back:$('backBtn'),search:$('searchBox'),list:$('clientList'),name:$('accountName'),sale:$('saleId'),total:$('accountTotal'),lines:$('lineCount'),accountBack:$('accountBackBtn')};
async function rpc(n,a){const r=await fetch(RPC+n,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(a)});const t=await r.text();let b;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw new Error(b?.message||t||('HTTP '+r.status));return b}
function only(x){[el.login,el.home,el.clients,el.account].forEach(v=>v.classList.add('hidden'));x.classList.remove('hidden')}
function error(e){el.status.className='error';el.status.textContent=e?.message||String(e)}
async function login(){el.status.textContent='A entrar…';try{const a=await rpc('pos_front_login',{p_operator_code:el.code.value.trim(),p_pin:el.pin.value});token=a.token;data=await rpc('pos_front_bootstrap',{p_token:token});el.operator.textContent=a.operator_name;el.boot.textContent='Bootstrap OK · '+data.categories.length+' famílias · '+data.customers.length+' clientes';el.status.className='ok';el.status.textContent='G1 PASS';only(el.home)}catch(e){error(e)}}
function clients(){only(el.clients);el.search.value='';renderClients()}
function renderClients(){const q=el.search.value.trim().toLocaleLowerCase('pt-PT');const cs=(data?.customers||[]).filter(c=>(c.display_name||'').toLocaleLowerCase('pt-PT').includes(q));el.list.innerHTML='';for(const c of cs){const b=document.createElement('button');b.type='button';b.textContent=c.display_name;b.addEventListener('click',()=>openCustomer(c));el.list.appendChild(b)}}
async function openCustomer(c){el.status.className='';el.status.textContent='A abrir '+c.display_name+'…';try{const a=await rpc('pos_front_open_account',{p_token:token,p_customer:c.id,p_label:null});el.name.textContent=c.display_name;el.sale.textContent=a.sale_id;el.total.textContent=Number(a.total_amount||0).toFixed(2)+' €';el.lines.textContent=(a.lines||[]).length;el.status.className='ok';el.status.textContent='G2 PASS — pos_front_open_account respondeu.';only(el.account)}catch(e){error(e)}}
el.loginBtn.addEventListener('click',login);el.pin.addEventListener('keydown',e=>{if(e.key==='Enter')login()});el.openClients.addEventListener('click',clients);el.back.addEventListener('click',()=>only(el.home));el.accountBack.addEventListener('click',clients);el.search.addEventListener('input',renderClients);
</script></main></body></html>
