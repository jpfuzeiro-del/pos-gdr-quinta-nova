<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Clean Lab</title><style>body{font-family:system-ui;background:#f5f7f9;color:#17233a;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{font:inherit;padding:14px;border-radius:12px}input{border:1px solid #ccd5dd}button{border:0;font-weight:750}.primary{background:#15803d;color:#fff}.hidden{display:none}.error{color:#b91c1c;white-space:pre-wrap}.ok{color:#166534}</style></head><body><main><h1>POS Clean Lab</h1><p>LAB · produção intocada</p><div id="status"></div><section id="loginBox" class="card"><h2>Entrada</h2><div class="row"><input id="operatorCode" autocomplete="username" placeholder="Operador"><input id="operatorPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button id="loginBtn" class="primary" type="button">Entrar</button></div></section><section id="homeBox" class="card hidden"><h2>Login validado</h2><p>Operador: <b id="operatorName"></b></p><p id="bootInfo"></p></section><script>
const RPC='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const KEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';
const el={status:document.getElementById('status'),loginBox:document.getElementById('loginBox'),homeBox:document.getElementById('homeBox'),code:document.getElementById('operatorCode'),pin:document.getElementById('operatorPin'),btn:document.getElementById('loginBtn'),name:document.getElementById('operatorName'),boot:document.getElementById('bootInfo')};
async function rpc(name,args){const r=await fetch(RPC+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});const text=await r.text();let body;try{body=text?JSON.parse(text):null}catch{body=text}if(!r.ok){const m=body?.message||body?.error||text||('HTTP '+r.status);throw new Error(m)}return body}
async function doLogin(){el.status.className='';el.status.textContent='A entrar…';el.btn.disabled=true;try{const code=el.code.value.trim(),pin=el.pin.value;if(!code||!pin)throw new Error('Preenche operador e PIN.');const auth=await rpc('pos_front_login',{p_operator_code:code,p_pin:pin});const boot=await rpc('pos_front_bootstrap',{p_token:auth.token});el.name.textContent=auth.operator_name||code;el.boot.textContent='Bootstrap OK · '+((boot.categories||[]).length)+' famílias · '+((boot.customers||[]).length)+' clientes';el.loginBox.classList.add('hidden');el.homeBox.classList.remove('hidden');el.status.className='ok';el.status.textContent='G1 PASS — login e bootstrap.'}catch(e){el.status.className='error';el.status.textContent='LOGIN NÃO CONCLUÍDO: '+(e?.message||String(e))}finally{el.btn.disabled=false}}
el.btn.addEventListener('click',doLogin);el.pin.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script></main></body></html>
