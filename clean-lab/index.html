<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Clean Lab G5</title><style>body{font-family:system-ui;background:#f5f7f9;color:#17233a;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}input,button{font:inherit;padding:14px;border-radius:12px}input{border:1px solid #ccd5dd;box-sizing:border-box}button{border:0;font-weight:750;background:#e8eef3}.primary{background:#15803d;color:#fff}.hidden{display:none}.error{color:#b91c1c;white-space:pre-wrap}.ok{color:#166534}.product{background:#fff;border:1px solid #d7dee7}.muted{color:#64748b}.proof{padding:12px;border-radius:12px;background:#ecfdf5;margin:12px 0}</style></head><body><main><h1>POS Clean Lab</h1><p>LAB · produção intocada · G5</p><div id="status"></div><section id="loginBox" class="card"><h2>Entrada</h2><div class="row"><input id="operatorCode" autocomplete="username" placeholder="Operador"><input id="operatorPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button id="loginBtn" class="primary" type="button">Entrar</button></div></section><section id="homeBox" class="card hidden"><h2>G1 PASS</h2><p>Operador: <b id="operatorName"></b></p><p id="bootInfo"></p><button id="openClientsBtn" class="primary" type="button">ABRIR CLIENTE</button></section><section id="clientsBox" class="card hidden"><div class="row"><button id="backBtn" type="button">← Voltar</button><h2>Clientes</h2></div><input id="searchBox" style="width:100%" placeholder="Pesquisar cliente"><div id="clientList" class="grid" style="margin-top:12px"></div></section><section id="accountBox" class="card hidden"><h2>G2 PASS — cliente aberto</h2><p>Cliente: <b id="accountName"></b></p><p>Sale ID: <span id="saleId"></span></p><p>Total: <b id="accountTotal"></b></p><p>Linhas existentes: <b id="lineCount"></b></p><button id="showFamiliesBtn" class="primary" type="button">VER FAMÍLIAS</button> <button id="accountBackBtn" type="button">← Voltar aos clientes</button></section><section id="familiesBox" class="card hidden"><h2>G3 — Famílias</h2><p>Cliente mantém-se: <b id="familyClientName"></b></p><div id="familyList" class="grid"></div><p id="familyProof"></p><button id="familiesBackBtn" type="button">← Voltar à conta</button></section><section id="productsBox" class="card hidden"><h2>G4/G5 — Produtos</h2><p>Cliente mantém-se: <b id="productClientName"></b></p><p>Família: <b id="productFamilyName"></b></p><div id="g5Proof" class="proof hidden"></div><div id="productList" class="grid"></div><p id="productProof" class="muted"></p><button id="productsBackBtn" type="button">← Voltar às famílias</button></section><script>
const RPC='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const KEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';let token=null,data=null,activeSaleId=null;
const el={status:document.getElementById('status'),loginBox:document.getElementById('loginBox'),homeBox:document.getElementById('homeBox'),code:document.getElementById('operatorCode'),pin:document.getElementById('operatorPin'),btn:document.getElementById('loginBtn'),name:document.getElementById('operatorName'),boot:document.getElementById('bootInfo')};
async function rpc(name,args){const r=await fetch(RPC+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});const text=await r.text();let body;try{body=text?JSON.parse(text):null}catch{body=text}if(!r.ok){const m=body?.message||body?.error||text||('HTTP '+r.status);throw new Error(m)}return body}
async function doLogin(){el.status.className='';el.status.textContent='A entrar…';el.btn.disabled=true;try{const code=el.code.value.trim(),pin=el.pin.value;if(!code||!pin)throw new Error('Preenche operador e PIN.');const auth=await rpc('pos_front_login',{p_operator_code:code,p_pin:pin});token=auth.token;const boot=await rpc('pos_front_bootstrap',{p_token:auth.token});data=boot;el.name.textContent=auth.operator_name||code;el.boot.textContent='Bootstrap OK · '+((boot.categories||[]).length)+' famílias · '+((boot.customers||[]).length)+' clientes';el.loginBox.classList.add('hidden');el.homeBox.classList.remove('hidden');el.status.className='ok';el.status.textContent='G1 PASS — login e bootstrap.'}catch(e){el.status.className='error';el.status.textContent='LOGIN NÃO CONCLUÍDO: '+(e?.message||String(e))}finally{el.btn.disabled=false}}
el.btn.addEventListener('click',doLogin);el.pin.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
const g2={home:document.getElementById('homeBox'),clients:document.getElementById('clientsBox'),account:document.getElementById('accountBox'),open:document.getElementById('openClientsBtn'),back:document.getElementById('backBtn'),search:document.getElementById('searchBox'),list:document.getElementById('clientList'),name:document.getElementById('accountName'),sale:document.getElementById('saleId'),total:document.getElementById('accountTotal'),lines:document.getElementById('lineCount'),accountBack:document.getElementById('accountBackBtn')};
const g3={families:document.getElementById('familiesBox'),show:document.getElementById('showFamiliesBtn'),list:document.getElementById('familyList'),proof:document.getElementById('familyProof'),client:document.getElementById('familyClientName'),back:document.getElementById('familiesBackBtn')};
const g4={products:document.getElementById('productsBox'),list:document.getElementById('productList'),client:document.getElementById('productClientName'),family:document.getElementById('productFamilyName'),proof:document.getElementById('productProof'),back:document.getElementById('productsBackBtn'),g5:document.getElementById('g5Proof')};
function showOnly(box){[g2.home,g2.clients,g2.account,g3.families,g4.products].forEach(x=>x.classList.add('hidden'));box.classList.remove('hidden')}
function renderClients(){const q=(g2.search.value||'').trim().toLocaleLowerCase('pt-PT');g2.list.innerHTML='';for(const c of (data?.customers||[]).filter(c=>(c.display_name||'').toLocaleLowerCase('pt-PT').includes(q))){const b=document.createElement('button');b.type='button';b.textContent=c.display_name;b.addEventListener('click',async()=>{el.status.className='';el.status.textContent='A abrir '+c.display_name+'…';try{const a=await rpc('pos_front_open_account',{p_token:token,p_customer:c.id,p_label:null});activeSaleId=a.sale_id;g2.name.textContent=c.display_name;g2.sale.textContent=a.sale_id;g2.total.textContent=Number(a.total_amount||0).toFixed(2)+' €';g2.lines.textContent=(a.lines||[]).length;el.status.className='ok';el.status.textContent='G2 PASS — cliente aberto.';showOnly(g2.account)}catch(e){el.status.className='error';el.status.textContent='G2 NÃO CONCLUÍDO: '+(e?.message||String(e))}});g2.list.appendChild(b)}}
g2.open.addEventListener('click',()=>{g2.search.value='';renderClients();showOnly(g2.clients)});g2.back.addEventListener('click',()=>showOnly(g2.home));g2.accountBack.addEventListener('click',()=>{renderClients();showOnly(g2.clients)});g2.search.addEventListener('input',renderClients);
async function addOneProduct(p,b){if(!activeSaleId){el.status.className='error';el.status.textContent='G5 BLOQUEADO — sem sale_id ativo.';return}const before=activeSaleId;b.disabled=true;g4.g5.classList.add('hidden');el.status.className='';el.status.textContent='G5 — a adicionar 1 × '+(p.name||'Produto')+'…';try{await rpc('pos_front_add_item',{p_token:token,p_sale:before,p_product:p.id,p_quantity:1});data=await rpc('pos_front_bootstrap',{p_token:token});const fresh=(data.accounts||[]).find(a=>a.id===before);if(!fresh)throw new Error('conta_nao_encontrada_apos_adicao');if(fresh.id!==before)throw new Error('sale_id_alterado');activeSaleId=fresh.id;g2.sale.textContent=fresh.id;g2.total.textContent=Number(fresh.total_amount||0).toFixed(2)+' €';g2.lines.textContent=(fresh.lines||[]).length;g4.g5.innerHTML='<b>G5 PASS</b><br>1 × '+String(p.name||'Produto')+' adicionado.<br>Mesmo sale_id: '+fresh.id+'<br>Total: '+Number(fresh.total_amount||0).toFixed(2)+' € · Linhas: '+(fresh.lines||[]).length;g4.g5.classList.remove('hidden');el.status.className='ok';el.status.textContent='G5 PASS — 1 unidade adicionada; cliente e sale_id mantidos.';}catch(e){el.status.className='error';el.status.textContent='G5 NÃO CONCLUÍDO: '+(e?.message||String(e))}finally{b.disabled=false}}
function openProducts(c){g4.client.textContent=g2.name.textContent;g4.family.textContent=c.name||c.display_name||'Família';g4.g5.classList.add('hidden');g4.g5.textContent='';g4.list.innerHTML='';const ps=(data?.products||[]).filter(p=>p.category_id===c.id);for(const p of ps){const b=document.createElement('button');b.type='button';b.className='product';const price=(p.price===null||p.price===undefined)?'—':Number(p.price).toFixed(2)+' €';b.innerHTML='<b>'+String(p.name||'Produto')+'</b><br><span class="muted">'+price+'</span>';b.addEventListener('click',()=>addOneProduct(p,b));g4.list.appendChild(b)}g4.proof.textContent=ps.length+' produtos apresentados. Neste gate, cada toque adiciona exatamente 1 unidade à conta ativa.';el.status.className='ok';el.status.textContent='G4 PASS — '+ps.length+' produtos renderizados em '+g4.family.textContent+'. G5 pronto.';showOnly(g4.products)}
g3.show.addEventListener('click',()=>{g3.client.textContent=g2.name.textContent;g3.list.innerHTML='';const cats=data?.categories||[];for(const c of cats){const b=document.createElement('button');b.type='button';b.textContent=c.name||c.display_name||'Família';b.addEventListener('click',()=>openProducts(c));g3.list.appendChild(b)}g3.proof.textContent=cats.length+' famílias apresentadas.';el.status.className='ok';el.status.textContent='G3 PASS — '+cats.length+' famílias renderizadas.';showOnly(g3.families)});g3.back.addEventListener('click',()=>showOnly(g2.account));g4.back.addEventListener('click',()=>showOnly(g3.families));
</script></main></body></html>
