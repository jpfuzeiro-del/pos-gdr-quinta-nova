<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUG · Renderer Declarativo Lab</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17233a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#111827;color:#fff;padding:12px 16px;z-index:5}header b{font-size:18px}.sub{opacity:.75;font-size:12px}main{max-width:920px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:11px;background:#fff}button{font-weight:750;cursor:pointer}.primary{background:#166534;color:#fff;border-color:#166534}.nav{background:#e2e8f0}.muted{color:#64748b}.ok{color:#166534}.err{color:#b91c1c;white-space:pre-wrap}.hidden{display:none}.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #e5e7eb}.money{font-weight:800}.summary{font-size:22px;font-weight:900;text-align:right}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:12px;font-weight:700;color:#475569}.qty{width:78px}.section-title{font-size:13px;font-weight:900;text-transform:uppercase;color:#475569;margin:12px 0 7px}.tile-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tile-actions button{padding:7px 9px;font-size:12px}.busy{opacity:.55;pointer-events:none}</style></head><body><header><b>PUG · Renderer Declarativo Lab</b><div class="sub">FUNCIONAL · manifesto Supabase · produção V19 intocada</div></header><main>
<section id="login" class="card"><h2>Entrada</h2><div class="row"><input id="code" placeholder="Operador" autocomplete="username"><input id="pin" type="password" placeholder="PIN" autocomplete="current-password"><button id="go" class="primary">Entrar</button></div><div id="loginErr" class="err"></div></section>
<section id="app" class="hidden"><div id="root"></div><div id="status" class="card muted"></div></section>
</main><script>
const U='https://cxymfqaokexihupbphur.supabase.co',K='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';
const S={token:null,manifest:null,bootstrap:null,screen:null,context:{},data:null,form:{},ui:{tendered:null,items:[],beneficiary_operator:null,voice_items:[],line_quantity:null,price:null,idempotency_key:null},busy:false};
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const money=x=>Number(x||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function path(o,p){if(!p)return o;return String(p).split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
async function rpc(n,p){const r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,'content-type':'application/json'},body:JSON.stringify(p||{})}),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok)throw Error((j&&j.message)||String(j||n));return j}
function screens(){return S.manifest?.screens||[]} function screen(k){return screens().find(x=>x.key===k)}
function setStatus(t,cls='muted'){$('#status').className='card '+cls;$('#status').textContent=t}
function resolve(v,row=null,result=null){if(Array.isArray(v))return v.map(x=>resolve(x,row,result));if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v))o[k]=resolve(x,row,result);return o}if(typeof v!=='string'||v[0]!=='$')return v;const [root,...rest]=v.slice(1).split('.'),p=rest.join('.');if(root==='context')return path(S.context,p);if(root==='ui')return path(S.ui,p);if(root==='form')return path(S.form,p);if(root==='row')return path(row,p);if(root==='result')return path(result,p);return v}
async function refresh(){S.bootstrap=await rpc('pos_front_bootstrap',{p_token:S.token});S.manifest=await rpc('pos_front_ui_manifest',{p_token:S.token})}
function visible(a){const c=a.config||{};if(a.allowed===false)return false;if(c.requires_customer&&!S.context.customer_id)return false;if(c.requires_no_customer&&S.context.customer_id)return false;if(c.requires_sale&&!S.context.sale_id)return false;if(c.requires_cash_management&&!S.bootstrap?.cash?.management_allowed)return false;if(c.requires_cash_closed&&S.bootstrap?.cash_open)return false;return true}
function clearContext(a){for(const k of(a.success?.clear_context||[]))delete S.context[k]}
function applyUseResult(a,r){for(const[k,p]of Object.entries(a.success?.use_result||{}))S.context[k]=path(r,p)}
async function dispatch(a,row=null){if(S.busy)return;try{S.busy=true;document.body.classList.add('busy');const collect=a.config?.collect;if(collect){let initial=row?.price??S.ui[collect.key]??'';const raw=prompt(collect.label||collect.key,String(initial));if(raw===null)return;S.ui[collect.key]=collect.type==='money'||collect.type==='number'?Number(String(raw).replace(',','.')):raw;if((collect.type==='money'||collect.type==='number')&&!Number.isFinite(S.ui[collect.key]))throw Error('Valor inválido')}
 if(a.action_type==='navigate'||a.action_type==='back'||a.action_type==='local_ui'){const p=resolve(a.payload||{},row);if(p?.context)Object.assign(S.context,p.context);clearContext(a);return await show(a.target_screen_key||a.success?.navigate||'families')}
 if(a.action_type!=='rpc'||!a.rpc_name)throw Error('Ação sem RPC: '+a.key);const p=resolve(a.payload||{},row);if(p.p_token===undefined)p.p_token=S.token;const r=await rpc(a.rpc_name,p);applyUseResult(a,r);clearContext(a);await refresh();const target=a.success?.navigate||a.target_screen_key||S.screen?.key||'families';setStatus((a.label||a.key)+' concluído.','ok');await show(target)}catch(e){setStatus(e.message||String(e),'err')}finally{S.busy=false;document.body.classList.remove('busy')}}
async function loadData(s){const n=s.config?.data_rpc;if(!n)return S.bootstrap;const p=resolve(s.config?.data_payload||{});p.p_token=S.token;let d=await rpc(n,p);const dataPath=s.config?.data_path;if(dataPath&&s.config?.select_by_context){const rows=path(d,dataPath)||[];const cond=resolve(s.config.select_by_context);d=rows.find(r=>Object.entries(cond).every(([k,v])=>String(r?.[k])===String(v)))||null}return d}
function groupRows(rows,s){const key=s.config?.group_by;if(!key||!Array.isArray(rows))return rows||[];const bm=s.config?.balance_model||{},m=new Map;for(const r of rows){const id=r[key];if(!m.has(id))m.set(id,{...r});else{const z=m.get(id);for(const field of Object.values(bm)){if(typeof r[field]==='number'||r[field]!=null)z[field]=Number(z[field]||0)+Number(r[field]||0)}m.set(id,z)}}return [...m.values()]}
function rowsFor(sec,d){let rows=path(d,sec.config?.source_path);if(rows==null&&S.screen?.config?.data_path)rows=path(d,S.screen.config.data_path);if(rows==null&&Array.isArray(d))rows=d;if(rows==null&&S.screen?.key==='current_account_detail')rows=d?.aggregated_lines||[];rows=groupRows(rows,S.screen||{});const ff=sec.config?.filter_field,fc=sec.config?.filter_context;if(ff&&fc)rows=(rows||[]).filter(r=>String(r?.[ff])===String(S.context?.[fc]));return rows||[]}
function actionFor(sec,kind){return (S.screen?.actions||[]).find(a=>a.section_key===sec.key&&a.config?.[kind]&&visible(a))||(S.screen?.actions||[]).find(a=>a.config?.[kind]&&visible(a))}
function sectionActions(sec){return (S.screen?.actions||[]).filter(a=>a.section_key===sec.key&&!a.config?.row_action&&!a.config?.secondary_row_action&&!a.config?.line_quantity_action&&visible(a))}
function renderActionButtons(sec,host){const acts=sectionActions(sec);if(!acts.length)return;const bar=document.createElement('div');bar.className='row';for(const a of acts){const b=document.createElement('button');b.textContent=(a.icon||'')+' '+(a.label||a.key);if(a.action_type==='rpc')b.className='primary';b.onclick=()=>dispatch(a);bar.appendChild(b)}host.appendChild(bar)}
function renderTiles(sec,d,search=false){const box=document.createElement('div');box.className='card';if(sec.title)box.innerHTML='<div class="section-title">'+esc(sec.title)+'</div>';let rows=rowsFor(sec,d),input=null;if(search){input=document.createElement('input');input.placeholder='Pesquisar';input.style.width='100%';box.appendChild(input)}const g=document.createElement('div');g.className='grid';g.style.marginTop='8px';box.appendChild(g);const draw=()=>{g.innerHTML='';const q=(input?.value||'').toLocaleLowerCase('pt-PT');for(const r of rows.filter(x=>String(x.display_name||x.customer_name||x.account_name||x.name||'').toLocaleLowerCase('pt-PT').includes(q))){const wrap=document.createElement('div');wrap.className='card';wrap.style.margin='0';const main=document.createElement('button');main.style.width='100%';main.innerHTML='<b>'+esc(r.name||r.display_name||r.customer_name||r.account_name||'Item')+'</b>'+(r.price!=null?'<br><span class="muted">'+money(r.price)+'</span>':'')+(r.outstanding_total!=null?'<br><span class="money">'+money(r.outstanding_total)+'</span>':'');const ra=actionFor(sec,'row_action');main.onclick=()=>ra?dispatch(ra,r):setStatus('Sem ação declarada para esta linha.','muted');wrap.appendChild(main);const sa=actionFor(sec,'secondary_row_action');if(sa){const x=document.createElement('div');x.className='tile-actions';const b=document.createElement('button');b.textContent=sa.label||sa.key;b.onclick=()=>dispatch(sa,r);x.appendChild(b);wrap.appendChild(x)}g.appendChild(wrap)}};if(input)input.oninput=draw;draw();renderActionButtons(sec,box);return box}
function renderHeader(sec,d){const box=document.createElement('div');box.className='card';const fs=sec.fields||[];if(fs.length)box.innerHTML=fs.map(f=>'<div><span class="muted">'+esc(f.label||f.key)+'</span><br><b>'+esc(path(d,f.source_path)??'—')+'</b></div>').join('');else{const c=d?.customer||{};box.innerHTML='<h3 style="margin:0">'+esc(c.name||d?.account_name||S.context.account_name||'Conta')+'</h3>'}renderActionButtons(sec,box);return box}
function renderLines(sec,d){const box=document.createElement('div');box.className='card';const rows=rowsFor(sec,d),qa=actionFor(sec,'line_quantity_action');box.innerHTML='<div class="section-title">'+esc(sec.title||'Linhas')+'</div>';for(const r of rows){const line=document.createElement('div');line.className='line';const left=document.createElement('div');left.innerHTML='<b>'+esc(r.name||r.product_name||'Movimento')+'</b><br><span class="muted">'+esc(r.quantity??'')+(r.unit_price!=null?' × '+money(r.unit_price):'')+'</span>';const right=document.createElement('div');right.innerHTML='<div class="money">'+money(r.line_total??r.total??0)+'</div>';if(qa&&r.line_id){const ctr=document.createElement('div');ctr.className='row';const minus=document.createElement('button'),inp=document.createElement('input'),plus=document.createElement('button'),del=document.createElement('button');minus.textContent='−';plus.textContent='+';del.textContent='×';inp.className='qty';inp.value=String(r.quantity??1);const send=async v=>{S.ui.line_quantity=Math.max(0,Number(v)||0);await dispatch(qa,r)};minus.onclick=()=>send(Number(inp.value)-1);plus.onclick=()=>send(Number(inp.value)+1);del.onclick=()=>send(0);inp.onchange=()=>send(inp.value);ctr.append(minus,inp,plus,del);right.appendChild(ctr)}line.append(left,right);box.appendChild(line)}renderActionButtons(sec,box);return box}
function renderSummary(sec,d){const box=document.createElement('div');box.className='card';const f=(sec.fields||[])[0],src=sec.config?.source_path,v=src?path(d,src):(f?path(d,f.source_path):(d?.outstanding_total??d?.grand_total_with_open??d?.total_amount));box.innerHTML='<div class="muted">'+esc(f?.label||sec.title||'Total')+'</div><div class="summary">'+money(v)+'</div>';renderActionButtons(sec,box);return box}
function quickVals(total,preset){const cfg=preset?.config||{},vals=[];if(cfg.include_exact!==false)vals.push(total);for(const step of(cfg.steps||[])){const v=Math.ceil((total-1e-9)/Number(step))*Number(step);if(v>=total)vals.push(Number(v.toFixed(2)))}for(const v of(cfg.fixed||[]))if(v>=total)vals.push(Number(v));return [...new Set(vals)].sort((a,b)=>a-b).slice(0,cfg.max_suggestions||6)}
function renderQuick(sec,d){const box=document.createElement('div');box.className='card';const total=Number(d?.outstanding_total??d?.grand_total_with_open??d?.total_amount??0),preset=S.manifest?.presets?.[sec.config?.preset],vals=quickVals(total,preset);box.innerHTML='<div class="section-title">'+esc(sec.title||'Numerário')+'</div><div class="row">'+vals.map(v=>'<button type="button" data-v="'+v+'">'+money(v)+'</button>').join('')+'</div><div class="field"><label>Valor recebido</label><input id="tender" inputmode="decimal" value="'+total.toFixed(2)+'"></div><div id="change" class="money"></div>';const input=box.querySelector('#tender'),chg=box.querySelector('#change');const upd=()=>{const v=Number(String(input.value).replace(',','.'));S.ui.tendered=Number.isFinite(v)?v:null;chg.textContent=S.ui.tendered==null?'':(S.ui.tendered>=total?'Troco: '+money(S.ui.tendered-total):'Falta: '+money(total-S.ui.tendered))};box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{input.value=b.dataset.v;upd()});input.oninput=upd;upd();renderActionButtons(sec,box);return box}
function renderForm(sec,d){const box=document.createElement('div');box.className='card';box.innerHTML='<div class="section-title">'+esc(sec.title||'Formulário')+'</div>';for(const f of(sec.fields||[])){const key=String(f.source_path||f.key).split('.').pop(),wrap=document.createElement('div');wrap.className='field';const lab=document.createElement('label');lab.textContent=f.label||f.key;let inp=f.field_type==='textarea'?document.createElement('textarea'):document.createElement('input');if(f.field_type==='money'||f.field_type==='number')inp.inputMode='decimal';inp.value=path(d,f.source_path)??S.form[key]??'';S.form[key]=inp.value;inp.oninput=()=>S.form[key]=inp.value;wrap.append(lab,inp);box.appendChild(wrap)}renderActionButtons(sec,box);return box}
function renderContext(sec,d){const box=document.createElement('div');box.className='card';box.innerHTML='<span class="pill">Conta '+esc(S.context.account_name||'—')+'</span> <span class="pill">Venda '+esc(S.context.sale_id||'—')+'</span>';renderActionButtons(sec,box);return box}
function renderBatch(sec,d){const box=document.createElement('div');box.className='card';const products=path(d,sec.config?.items_path)||d?.products||[];const basket=new Map((S.ui.items||[]).map(x=>[x.product_id,Number(x.quantity||0)]));const sync=()=>S.ui.items=[...basket.entries()].filter(([,q])=>q>0).map(([product_id,quantity])=>({product_id,quantity}));const g=document.createElement('div');g.className='grid';for(const p of products){const w=document.createElement('div');w.className='card';w.style.margin='0';w.innerHTML='<b>'+esc(p.name)+'</b><div class="row"><button data-d="-1">−</button><input class="qty" value="'+(basket.get(p.id)||0)+'"><button data-d="1">+</button></div>';const inp=w.querySelector('input');const set=v=>{basket.set(p.id,Math.max(0,Number(v)||0));inp.value=String(basket.get(p.id));sync()};w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>set(Number(inp.value)+Number(b.dataset.d)));inp.onchange=()=>set(inp.value);g.appendChild(w)}box.appendChild(g);renderActionButtons(sec,box);return box}
function component(sec,d){switch(sec.component_type){case'tile_list':return renderTiles(sec,d,false);case'searchable_list':return renderTiles(sec,d,true);case'entity_header':return renderHeader(sec,d);case'line_list':return renderLines(sec,d);case'summary':return renderSummary(sec,d);case'quick_amounts':return renderQuick(sec,d);case'form':return renderForm(sec,d);case'context_summary':return renderContext(sec,d);case'batch_product_picker':return renderBatch(sec,d);case'action_bar':{const b=document.createElement('div');b.className='card';renderActionButtons(sec,b);return b}default:{const x=document.createElement('div');x.className='card err';x.textContent='Componente não suportado: '+sec.component_type;return x}}}
async function show(k){try{const s=screen(k);if(!s)throw Error('Ecrã inexistente: '+k);S.screen=s;S.form={};S.data=await loadData(s);const root=$('#root');root.innerHTML='';const title=document.createElement('div');title.className='card';title.innerHTML='<h2 style="margin:0">'+esc(s.title||s.key)+'</h2><div class="muted">'+esc(s.key)+' · '+esc(s.surface_type||'')+'</div>';root.appendChild(title);for(const sec of(s.sections||[]))root.appendChild(component(sec,S.data));const unsectioned=(s.actions||[]).filter(a=>!a.section_key&&!a.config?.row_action&&!a.config?.secondary_row_action&&!a.config?.line_quantity_action&&visible(a));if(unsectioned.length){const b=document.createElement('div');b.className='card row';for(const a of unsectioned){const x=document.createElement('button');x.textContent=a.label||a.key;x.onclick=()=>dispatch(a);b.appendChild(x)}root.appendChild(b)}setStatus('Manifesto: '+(s.sections||[]).length+' secções · '+(s.actions||[]).filter(visible).length+' ações visíveis','ok')}catch(e){setStatus(e.message||String(e),'err')}}
$('#go').onclick=async()=>{try{$('#loginErr').textContent='';const a=await rpc('pos_front_login',{p_operator_code:$('#code').value.trim(),p_pin:$('#pin').value});S.token=a.token;await refresh();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await show('families')}catch(e){$('#loginErr').textContent=e.message||String(e)}};
</script></body></html>
