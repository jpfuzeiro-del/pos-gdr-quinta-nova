function actionFor(sec,k){return(S.screen?.actions||[]).find(a=>a.section_key===sec.key&&a.config?.[k]&&visible(a))||(S.screen?.actions||[]).find(a=>a.config?.[k]&&visible(a))}function sectionActions(sec){return(S.screen?.actions||[]).filter(a=>a.section_key===sec.key&&!a.config?.row_action&&!a.config?.secondary_row_action&&!a.config?.line_quantity_action&&visible(a))}
function actionButtons(sec,host){const acts=sectionActions(sec);if(!acts.length)return;const bar=document.createElement('div');bar.className='row';for(const a of acts){const b=document.createElement('button');b.textContent=a.label||a.key;if(a.action_type==='rpc')b.className='primary';b.onclick=()=>dispatch(a);bar.appendChild(b)}host.appendChild(bar)}
function tiles(sec,d,search=false){const box=document.createElement('div');box.className='card';let rows=rowsFor(sec,d),inp=null;if(search){inp=document.createElement('input');inp.placeholder='Pesquisar';inp.style.width='100%';box.appendChild(inp)}const g=document.createElement('div');g.className='grid';g.style.marginTop='8px';box.appendChild(g);const draw=()=>{g.innerHTML='';const q=(inp?.value||'').toLocaleLowerCase('pt-PT');for(const r of rows.filter(x=>String(x.display_name||x.customer_name||x.account_name||x.name||'').toLocaleLowerCase('pt-PT').includes(q))){const w=document.createElement('div');w.className='card';w.style.margin='0';const b=document.createElement('button');b.style.width='100%';b.innerHTML='<b>'+esc(r.name||r.display_name||r.customer_name||r.account_name||'Item')+'</b>'+(r.price!=null?'<br><span class="muted">'+money(r.price)+'</span>':'')+(r.outstanding_total!=null?'<br><span class="money">'+money(r.outstanding_total)+'</span>':'');const ra=actionFor(sec,'row_action');b.onclick=()=>ra?dispatch(ra,r):status('Sem ação declarada.');w.appendChild(b);const sa=actionFor(sec,'secondary_row_action');if(sa){const x=document.createElement('div');x.className='tile-actions';const q=document.createElement('button');q.textContent=sa.label||sa.key;q.onclick=()=>dispatch(sa,r);x.appendChild(q);w.appendChild(x)}g.appendChild(w)}};if(inp)inp.oninput=draw;draw();actionButtons(sec,box);return box}
function header(sec,d){const box=document.createElement('div');box.className='card';const fs=sec.fields||[];box.innerHTML=fs.length?fs.map(f=>'<div><span class="muted">'+esc(f.label||f.key)+'</span><br><b>'+esc(path(d,f.source_path)??'—')+'</b></div>').join(''):'<h3 style="margin:0">'+esc(d?.customer?.name||d?.account_name||S.context.account_name||'Conta')+'</h3>';actionButtons(sec,box);return box}
function lines(sec,d){const box=document.createElement('div');box.className='card',rows=rowsFor(sec,d),qa=actionFor(sec,'line_quantity_action'),ra=actionFor(sec,'row_action'),cfg=sec.config||{};box.innerHTML='<div class="section-title">'+esc(sec.title||'Linhas')+'</div>';for(const r of rows){const name=r[cfg.name_field||'name']||r.product_name||r.account_name||'Movimento',total=r[cfg.total_field||'line_total']??r.total_amount??r.total??0;const line=document.createElement('div');line.className='line'+(ra?' clickable':'');const left=document.createElement('div');let meta=[];for(const f of(cfg.meta_fields||[])){if(r[f]!=null)meta.push(String(r[f]))}if(r.quantity!=null)meta.unshift(String(r.quantity)+(r.unit_price!=null?' × '+money(r.unit_price):''));left.innerHTML='<b>'+esc(name)+'</b>'+(meta.length?'<br><span class="muted">'+esc(meta.join(' · '))+'</span>':'');if(Array.isArray(r[cfg.lines_field||'__none'])&&r[cfg.lines_field||'__none'].length)left.innerHTML+='<br><span class="muted">'+r[cfg.lines_field||'__none'].map(x=>esc(x.quantity+'× '+x.name)).join(' · ')+'</span>';const right=document.createElement('div');right.innerHTML='<div class="money">'+money(total)+'</div>';if(qa&&r.line_id){const ctr=document.createElement('div');ctr.className='row';for(const spec of[['−',-1],['+',1],['×','delete']]){const b=document.createElement('button');b.textContent=spec[0];b.onclick=e=>{e.stopPropagation();S.ui.line_quantity=spec[1]==='delete'?0:Math.max(0,Number(r.quantity||0)+Number(spec[1]));dispatch(qa,r)};ctr.appendChild(b)}right.appendChild(ctr)}line.append(left,right);if(ra)line.onclick=()=>dispatch(ra,r);box.appendChild(line)}actionButtons(sec,box);return box}
function summary(sec,d){const box=document.createElement('div');box.className='card',src=sec.config?.source_path,f=(sec.fields||[])[0],v=src?path(d,src):(f?path(d,f.source_path):(d?.outstanding_total??d?.grand_total_with_open??d?.total_amount));box.innerHTML='<div class="muted">'+esc(f?.label||sec.title||'Total')+'</div><div class="summary">'+money(v)+'</div>';actionButtons(sec,box);return box}
function qvals(total,preset){const c=preset?.config||{},v=[];if(c.include_exact!==false)v.push(total);for(const s of(c.steps||[])){const x=Math.ceil((total-1e-9)/Number(s))*Number(s);if(x>=total)v.push(Number(x.toFixed(2)))}return[...new Set(v)].sort((a,b)=>a-b).slice(0,c.max_suggestions||6)}
function quick(sec,d){const box=document.createElement('div');box.className='card',total=Number(d?.outstanding_total??d?.grand_total_with_open??d?.total_amount??0),vals=qvals(total,S.manifest?.presets?.[sec.config?.preset]);box.innerHTML='<div class="row">'+vals.map(v=>'<button data-v="'+v+'">'+money(v)+'</button>').join('')+'</div><div class="field"><label>Valor recebido</label><input id="tender" inputmode="decimal" value="'+total.toFixed(2)+'"></div><div id="change" class="money"></div>';const i=box.querySelector('#tender'),c=box.querySelector('#change'),u=()=>{const v=Number(String(i.value).replace(',','.'));S.ui.tendered=Number.isFinite(v)?v:null;c.textContent=S.ui.tendered==null?'':(S.ui.tendered>=total?'Troco: '+money(S.ui.tendered-total):'Falta: '+money(total-S.ui.tendered))};box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{i.value=b.dataset.v;u()});i.oninput=u;u();actionButtons(sec,box);return box}
function form(sec,d){const box=document.createElement('div');box.className='card';for(const f of(sec.fields||[])){const src=String(f.source_path||f.key),key=src.replace(/^\$form\./,'').split('.').pop(),w=document.createElement('div');w.className='field';const l=document.createElement('label');l.textContent=f.label||f.key;const i=f.field_type==='textarea'?document.createElement('textarea'):document.createElement('input');if(f.field_type==='money'||f.field_type==='number')i.inputMode='decimal';const val=src.startsWith('$form.')?S.form[key]:(path(d,src)??S.form[key]);i.value=val??'';S.form[key]=i.value;i.oninput=()=>S.form[key]=i.value;w.append(l,i);box.appendChild(w)}actionButtons(sec,box);return box}
function context(sec,d){const box=document.createElement('div');box.className='card';box.innerHTML='<span class="pill">Conta '+esc(S.context.account_name||'—')+'</span> <span class="pill">Venda '+esc(S.context.sale_id||'—')+'</span>';actionButtons(sec,box);return box}
function batch(sec,d){const box=document.createElement('div');box.className='card',cfg=sec.config||{},mode=S.context.stock_action,products=path(d,cfg.items_path)||d?.products||[],basket=new Map((S.ui.items||[]).map(x=>[x.product_id,Number(x.quantity||0)]));if(mode==='offer'){const panel=document.createElement('div');panel.className='card';panel.innerHTML='<div class="section-title">Oferta a</div>';const sel=document.createElement('select');sel.innerHTML='<option value="">Cliente registado (opcional)</option>'+((path(d,cfg.customers_path)||d?.customers||[]).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.display_name||c.name)+'</option>').join(''));sel.value=S.ui.offer_recipient_customer_id||'';sel.onchange=()=>S.ui.offer_recipient_customer_id=sel.value||null;const name=document.createElement('input');name.placeholder='Ou escrever nome / nota do destinatário';name.value=S.form.offer_recipient_name||'';name.oninput=()=>S.form.offer_recipient_name=name.value;panel.append(sel,name);box.appendChild(panel)}else if(mode==='internal_consumption'){const panel=document.createElement('div');panel.className='field';const l=document.createElement('label');l.textContent='Consumo de';const sel=document.createElement('select'),ops=path(d,cfg.operators_path)||d?.operators||[];sel.innerHTML=ops.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.display_name||o.name)+'</option>').join('');if(!S.ui.beneficiary_operator)S.ui.beneficiary_operator=d?.operator?.id||ops[0]?.id||null;sel.value=S.ui.beneficiary_operator||'';sel.onchange=()=>S.ui.beneficiary_operator=sel.value||null;panel.append(l,sel);box.appendChild(panel)}const g=document.createElement('div');g.className='grid';for(const p of products){const w=document.createElement('div');w.className='card';w.style.margin='0';w.innerHTML='<b>'+esc(p.name)+'</b><div class="row"><button data-d="-1">−</button><input class="qty" value="'+(basket.get(p.id)||0)+'"><button data-d="1">+</button></div>';const i=w.querySelector('input'),set=v=>{basket.set(p.id,Math.max(0,Number(v)||0));i.value=String(basket.get(p.id));S.ui.items=[...basket.entries()].filter(([,q])=>q>0).map(([product_id,quantity])=>({product_id,quantity}))};w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>set(Number(i.value)+Number(b.dataset.d)));i.onchange=()=>set(i.value);g.appendChild(w)}box.appendChild(g);actionButtons(sec,box);return box}
function comp(sec,d){return sec.component_type==='tile_list'?tiles(sec,d):sec.component_type==='searchable_list'?tiles(sec,d,true):sec.component_type==='entity_header'?header(sec,d):sec.component_type==='line_list'?lines(sec,d):sec.component_type==='summary'?summary(sec,d):sec.component_type==='quick_amounts'?quick(sec,d):sec.component_type==='form'?form(sec,d):sec.component_type==='context_summary'?context(sec,d):sec.component_type==='batch_product_picker'?batch(sec,d):(()=>{const x=document.createElement('div');x.className='card';actionButtons(sec,x);return x})()}
async function show(k){try{const s=screen(k);if(!s)throw Error('Ecrã inexistente: '+k);S.screen=s;S.data=await loadData(s);const root=$('#root');root.innerHTML='<div class="card"><h2 style="margin:0">'+esc(s.title||s.key)+'</h2></div>'+(S.bootstrap&&!S.bootstrap.cash_open?'<div class="notice">Caixa fechada. '+(S.bootstrap?.cash?.management_allowed?'Podes abri-la no Front Office.':'Aguarda a abertura pelo responsável.')+'</div>':'');for(const sec of(s.sections||[]))root.appendChild(comp(sec,S.data));const loose=(s.actions||[]).filter(a=>!a.section_key&&!a.config?.row_action&&!a.config?.secondary_row_action&&!a.config?.line_quantity_action&&visible(a));if(loose.length){const b=document.createElement('div');b.className='card row';for(const a of loose){const x=document.createElement('button');x.textContent=a.label||a.key;x.onclick=()=>dispatch(a);b.appendChild(x)}root.appendChild(b)}status('Pronto.','ok')}catch(e){status(e.message||String(e),'err')}}
async function home(){S.context={};S.pendingProduct=null;S.ui.items=[];S.ui.voice_items=[];S.form={};await refresh();await show('families')}
async function login(code,pin){const a=await rpc('pos_front_login',{p_operator_code:code,p_pin:pin});S.token=a.token;localStorage.setItem('pos_gdr_token',S.token);await refresh();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await show('families')}
$('#go').onclick=async()=>{try{$('#loginErr').textContent='';await login($('#code').value.trim(),$('#pin').value)}catch(e){$('#loginErr').textContent=e.message||String(e)}};$('#pin').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};$('#brand').onclick=()=>home().catch(e=>status(e.message,'err'));
(async()=>{const t=localStorage.getItem('pos_gdr_token');if(!t)return;try{S.token=t;await refresh();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await show('families')}catch(_e){localStorage.removeItem('pos_gdr_token');S.token=null}})();
</script></body></html>
