.accounts{display:flex!important}.app{padding-bottom:118px}.lab-utility{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.lab-utility button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-weight:750}.lab-toprow{grid-template-columns:1fr 1fr 1fr 76px!important}.lab-toprow button{min-height:58px}.lab-toprow .mic-btn{width:auto!important;height:auto!important;font-size:.72rem!important;line-height:1.05}.stock-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.account-focus.lab-visible{display:block!important}.lab-product-image{width:100%;height:82px;object-fit:contain;border-radius:10px;margin-bottom:7px}.lab-list{display:grid;gap:8px}.lab-listbtn{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:10px}.lab-list-main{flex:1;min-width:0}.lab-list-title{font-weight:850}.lab-meta{font-size:.78rem;color:#6b7280}.lab-amount{font-weight:850;white-space:nowrap}.lab-actions{display:grid;gap:8px;margin-top:12px}.lab-actions button{width:100%;border:0;border-radius:14px;padding:13px;font-weight:850;background:#eef1f4;color:var(--ink)}.lab-actions button[data-primary="1"]{background:var(--blue);color:#fff}.lab-actions button:disabled{opacity:.38}.lab-search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;margin:0 0 10px}.lab-field{margin:9px 0}.lab-field label{display:block;font-weight:750;font-size:.86rem;margin-bottom:5px}.lab-field input,.lab-field select,.lab-field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.lab-field textarea{min-height:100px}.lab-quick{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.lab-quick button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-weight:800}.lab-notice{margin:8px 14px;padding:10px 12px;border-radius:12px;background:#e9f7ef;color:#145a32;font-weight:750}.lab-error{margin:8px 14px;padding:10px 12px;border-radius:12px;background:#fdecea;color:#922b21;font-weight:750}.lab-badge{font-size:.67rem;border:1px solid var(--purple);color:var(--purple);border-radius:999px;padding:3px 7px;font-weight:850}.lab-panel-title{margin-top:0}.bottom .pay-btn{cursor:pointer}.chip{cursor:pointer}.tile,.product,button{cursor:pointer}.product{display:flex;flex-direction:column;justify-content:space-between}.product .lab-product-image{height:96px}.overlay .panel{max-height:90vh;overflow:auto}.lab-review{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fff}.lab-review div{margin:3px 0}.lab-share-actions{display:flex;gap:8px;flex-wrap:wrap}.lab-share-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:850}.lab-hidden{display:none!important}@media(max-width:420px){.lab-toprow{grid-template-columns:1fr 1fr 1fr 62px!important}.lab-toprow button{font-size:.66rem!important}.grid{grid-template-columns:repeat(3,1fr)!important}.tile{min-height:96px!important}}
</style></head><body>
<div id="loginOverlay" class="overlay"><div class="panel"><img src="../../assets/gdr-quinta-nova-logo.png" style="width:140px;display:block;margin:auto" alt="GDR Quinta Nova"><h2>Entrada no POS GDR Quinta Nova</h2><input id="code" class="field" placeholder="Operador" autocomplete="username"><input id="pin" class="field" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><div id="loginError" class="error hidden"></div><button id="loginBtn" class="primary cash">Entrar</button><div class="status">Front Office · LAB SUPABASE · V21 visual</div></div></div>
<div id="shell" class="app lab-hidden"><header id="appHeader"></header><div id="status"></div><main id="main"></main></div>
<script>
(function(){'use strict';
const G='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pug_frontoffice_core_clean_v1';const login=document.getElementById('loginOverlay'),shell=document.getElementById('shell'),main=document.getElementById('main'),header=document.getElementById('appHeader'),status=document.getElementById('status');let sid=sessionStorage.getItem('pug_supabase_v21_lab_session')||'',model=null,busy=false,inputSource='manual';
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function euro(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}):''}
async function call(op,body){const r=await fetch(G+'?op='+encodeURIComponent(op),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={error:t}}if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function payload(el){try{return JSON.parse(el.dataset.payload||'{}')}catch{return {}}}
function fields(){const o={};document.querySelectorAll('[data-field]').forEach(x=>o[x.dataset.field]=x.value);if(inputSource!=='manual')o.input_source=inputSource;return o}
async function send(key,p){if(!key||busy||!sid)return;busy=true;try{model=await call('dispatch',{p_session:sid,p_action:key,p_payload:Object.assign({},fields(),p||{}),p_event_id:crypto.randomUUID()});inputSource='manual';render()}catch(e){showError(e.message)}finally{busy=false}}
function showError(m){status.innerHTML='<div class="lab-error">'+esc(m)+'</div>'}
function showNotice(){const n=model&&model.notice;if(!n){status.innerHTML='';return}let d='';if(n.applied!=null)d+=' Recebido: '+euro(n.applied)+'.';if(n.change!=null&&Number(n.change)>0)d+=' Troco: '+euro(n.change)+'.';if(n.remaining!=null&&Number(n.remaining)>0)d+=' Restante: '+euro(n.remaining)+'.';status.innerHTML='<div class="lab-notice"><b>'+esc(n.title||'Concluído')+'</b>'+esc(d)+'</div>'}
function actionBtn(a,cls){if(!a)return'';const icon=a.icon?'<span>'+esc(a.icon)+'</span>':'';const br=a.icon?'<br>':'';return '<button type="button" class="'+esc(a.ui_class||cls||'')+(a.active?' active':'')+'" data-key="'+esc(a.key)+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"'+(a.device?' data-device="'+esc(a.device)+'"':'')+(a.disabled?' disabled':'')+(a.style==='primary'?' data-primary="1"':'')+'>'+icon+br+esc(a.label||'')+'</button>'}
function renderHeader(h){const x=h||{};header.innerHTML='<div class="brand" id="homeBrand" role="button" tabindex="0"><img src="../../assets/gdr-quinta-nova-logo.png"><div><h1>'+esc(x.title||'GDR Quinta Nova POS')+'</h1><small>'+esc(x.operator||(model.operator&&model.operator.name)||'')+'</small><span class="cash-status '+((x.cash_status||'').includes('aberta')?'open':'closed')+'">'+esc(x.cash_status||'')+'</span><span class="sync-pill">'+esc(x.sync_status||'● Sincronizado')+'</span> <span class="lab-badge">LAB</span></div></div>';document.getElementById('homeBrand').onclick=()=>{const k=(model.home_action||{}).key;if(k)send(k,{})}}
function itemImage(i){const u=i.image_url||(i.visual&&i.visual.image_url);return u?'<img class="lab-product-image" src="'+esc(u)+'" alt="">':''}
function renderTiles(items,family){return '<div class="'+(family?'grid':'products')+'">'+(items||[]).map(i=>{const a=i.action||{};return '<button type="button" class="'+(family?'tile':'product')+'" data-key="'+esc(a.key||'')+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'">'+(family?'<span>'+esc(i.icon||'•')+'</span>':itemImage(i))+'<strong>'+esc(i.title||i.name||'')+'</strong>'+(i.amount!=null?'<b>'+euro(i.amount)+'</b>':'')+'</button>'}).join('')+'</div>'}
function renderList(items){return '<div class="lab-list">'+(items||[]).map(i=>{const a=i.action||{};const acts=(i.item_actions||[]).map(x=>actionBtn(x,'')).join('');return '<div class="lab-listbtn"'+(a.key?' data-key="'+esc(a.key)+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"':'')+'>'+itemImage(i)+'<div class="lab-list-main"><div class="lab-list-title">'+esc(i.title||i.name||i.customer_name||i.account_name||'Item')+'</div><div class="lab-meta">'+esc(i.subtitle||'')+(i.quantity!=null?' · × '+esc(i.quantity):'')+'</div>'+acts+'</div>'+(i.amount!=null?'<div class="lab-amount">'+euro(i.amount)+'</div>':'')+'</div>'}).join('')+'</div>'}
function renderFields(fs){return (fs||[]).map(f=>{let c='';const val=f.value==null?'':f.value;if(f.type==='select'){c='<select data-field="'+esc(f.key)+'"><option value="">—</option>'+((f.options||[]).map(o=>'<option value="'+esc(o.id||o.operator_id||o.customer_id||o.value||'')+'">'+esc(o.display_name||o.name||o.operator_name||o.operator_code||o.label||'')+'</option>').join(''))+'</select>'}else if(f.type==='textarea'){c='<textarea data-field="'+esc(f.key)+'">'+esc(val)+'</textarea>'}else{const type=f.type==='money'?'number':(f.type||'text');c='<input data-field="'+esc(f.key)+'" type="'+esc(type)+'"'+(f.type==='money'?' step="0.01" min="0" inputmode="decimal"':'')+' value="'+esc(val)+'">'}return '<div class="lab-field"><label>'+esc(f.label||f.key)+'</label>'+c+'</div>'}).join('')}
function renderActions(as){return '<div class="lab-actions">'+(as||[]).filter(Boolean).map(a=>actionBtn(a,'')).join('')+'</div>'}
function renderBottom(){if(!model.cart||Number(model.cart.count)<=0)return'';const ls=(model.cart.items||[]).map(i=>'<div class="line"><span>'+esc(i.name)+' × '+esc(i.quantity)+'</span><span></span><b>'+euro(i.line_total)+'</b></div>').join('');const a=(model.surface&&model.surface.cart_focus&&model.surface.cart_focus.action)||{key:'',label:'Continuar'};return '<div class="bottom"><div class="lines">'+ls+'</div><div class="total"><span>Total</span><b>'+euro(model.cart.total)+'</b></div>'+actionBtn(a,'pay-btn')+'</div>'}
function renderFamilies(){const sf=model.surface||{},s=model.screen||{};renderHeader(sf.header);let h='<div class="toprow lab-toprow">'+(sf.top_actions||[]).map(a=>actionBtn(a,a.ui_class)).join('')+'</div><div class="stock-actions">'+(sf.stock_actions||[]).map(a=>actionBtn(a,a.ui_class)).join('')+'</div><div class="stock-mode-note">'+esc(sf.stock_mode_note||'')+'</div><div class="sub no-account">'+esc(sf.account_sub||'')+'</div>';if((sf.account_chips||[]).length)h+='<div class="accounts">'+sf.account_chips.map(i=>'<button class="chip" data-key="'+esc((i.action||{}).key||'')+'" data-payload="'+esc(JSON.stringify((i.action||{}).payload||{}))+'">'+esc(i.title)+' · '+euro(i.amount)+'</button>').join('')+'</div>';h+='<div class="section"><h2>'+esc(sf.family_title||s.title||'')+'</h2><small>'+esc(sf.family_count||0)+' famílias</small></div>'+renderTiles(sf.family_items||s.items||[],true);if((sf.utility_actions||[]).filter(Boolean).length)h+='<div class="lab-utility">'+sf.utility_actions.filter(Boolean).map(a=>actionBtn(a,'')).join('')+'</div>';main.innerHTML=h+renderBottom();bind()}
function renderProductsV21(){const sf=model.surface||{},s=model.screen||{};renderHeader(sf.header);let h='<div class="backbar">'+actionBtn(sf.back_action,'backbtn')+'<strong>'+esc(s.title||'')+'</strong><small>'+esc((s.items||[]).length)+' produtos</small></div>'+renderTiles(s.items||[],false);if((sf.utility_actions||[]).length)h+='<div class="lab-utility">'+sf.utility_actions.map(a=>actionBtn(a,'')).join('')+'</div>';main.innerHTML=h+renderBottom();bind()}
function renderAccountFocusV21(){const sf=model.surface||{},s=model.screen||{};renderHeader(sf.header);let h='<section class="account-focus lab-visible"><h2>'+esc(s.title||'Conta')+'</h2><div class="account-card">';if(s.summary)h+='<div class="total"><span>'+esc(s.summary.label||'Total')+'</span><b>'+euro(s.summary.amount)+'</b></div>';h+='</div><div class="focus-lines">'+renderList(s.items||[])+'</div><div class="focus-actions">'+(s.actions||[]).map((a,i)=>actionBtn(a,i===0?'focus-receive':'focus-share')).join('')+'</div></section>';main.innerHTML=h+renderBottom();bind()}
function renderCcItems(items){return '<div class="pug4-list">'+(items||[]).map(i=>{const a=i.action||{};return '<button class="pug4-card" data-key="'+esc(a.key||'')+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"><div class="pug4-row"><div class="pug4-avatar">'+esc((i.title||'?').slice(0,2).toUpperCase())+'</div><div class="pug4-main"><div class="pug4-name">'+esc(i.title||'')+'</div><div class="pug4-sub">'+esc(i.subtitle||'')+'</div></div>'+(i.amount!=null?'<div class="pug4-amount">'+euro(i.amount)+'</div>':'')+'</div></button>'}).join('')+'</div>'}
function renderModalV21(){const sf=model.surface||{},s=model.screen||{},v=sf.variant||'';renderHeader(sf.header);let body='<div class="overlay"><div class="panel"><h2 class="lab-panel-title">'+esc(s.title||'')+'</h2>';if(s.summary)body+='<div class="total"><span>'+esc(s.summary.label||'')+'</span><b>'+euro(s.summary.amount)+'</b></div>';if(v==='V21_CC_LIST'||s.kind==='search_list')body+='<input id="search" class="lab-search" placeholder="Pesquisar">';body+=renderFields(s.fields);if(Array.isArray(s.quick_values)&&s.quick_values.length)body+='<div class="lab-quick">'+s.quick_values.map(x=>'<button type="button" data-quick="'+esc(x)+'">'+euro(x)+'</button>').join('')+'</div>';if(s.review)body+='<div class="lab-review"><b>Reconhecido</b><div>'+esc(s.review.raw||'')+'</div>'+((s.review.items||[]).map(i=>'<div>'+esc(i.name)+' × '+esc(i.quantity)+'</div>').join(''))+(s.review.unmatched_text?'<div class="lab-error">Por rever: '+esc(s.review.unmatched_text)+'</div>':'')+'</div>';if(v==='V21_CC_LIST')body+=renderCcItems(s.items||[]);else if(v==='V21_CC_DETAIL')body+='<div class="pug4-detail">'+renderList(s.items||[])+'</div>';else if(Array.isArray(s.items))body+=renderList(s.items);if(v==='V21_PAYMENT'||v==='V21_CC_PAYMENT')body+='<div class="payment-choice">'+(s.actions||[]).map(a=>actionBtn(a,a.style==='primary'?'cash':'cancel')).join('')+'</div>';else body+=renderActions(s.actions);if(Array.isArray(s.external_actions)&&s.external_actions.length)body+='<div class="lab-share-actions">'+s.external_actions.map(a=>'<button type="button" data-protocol="'+esc(a.protocol)+'">'+esc(a.label||a.protocol)+'</button>').join('')+'</div>';body+='</div></div>'+renderBottom();main.innerHTML=body;bind()}
function bind(){document.querySelectorAll('[data-key]').forEach(el=>el.onclick=async e=>{e.stopPropagation();if(el.disabled)return;const dev=el.dataset.device;if(dev){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showError('Reconhecimento de voz indisponível neste dispositivo.');return}const r=new SR();r.lang='pt-PT';r.interimResults=false;r.maxAlternatives=1;r.onresult=x=>{const t=x.results[0][0].transcript||'';if(dev==='speech_fill'){const f=document.querySelector('[data-field]');if(f){f.value=t;inputSource='voice'}}else send(el.dataset.key,{transcript:t})};r.onerror=x=>showError('Microfone: '+x.error);r.start();return}await send(el.dataset.key,payload(el))});const q=document.getElementById('search');if(q)q.oninput=()=>{const n=q.value.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();document.querySelectorAll('.lab-listbtn').forEach(x=>x.style.display=!n||x.textContent.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(n)?'':'none')};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const f=document.querySelector('[data-field][type="number"]');if(f)f.value=b.dataset.quick});document.querySelectorAll('[data-protocol]').forEach(b=>b.onclick=async()=>{const tel=document.querySelector('[data-field][type="tel"]');const ta=document.querySelector('textarea[data-field]');const p=tel?tel.value:'';const m=ta?ta.value:'';if(b.dataset.protocol==='whatsapp')window.open('https://wa.me/'+p.replace(/D/g,'')+'?text='+encodeURIComponent(m),'_blank');else if(b.dataset.protocol==='sms')location.href='sms:'+p.replace(/[^0-9+]/g,'')+'?body='+encodeURIComponent(m);else if(b.dataset.protocol==='clipboard'){await navigator.clipboard.writeText(m);status.innerHTML='<div class="lab-notice">Mensagem copiada.</div>'}})}
function render(){login.classList.add('hidden');shell.classList.remove('lab-hidden');showNotice();const v=model&&model.surface&&model.surface.variant;if(v==='V21_HOME')renderFamilies();else if(v==='V21_PRODUCTS')renderProductsV21();else if(v==='V21_ACCOUNT_FOCUS')renderAccountFocusV21();else renderModalV21()}
async function start(){try{model=await call('start',{p_operator_code:document.getElementById('code').value,p_pin:document.getElementById('pin').value});sid=model.session_id;sessionStorage.setItem('pug_supabase_v21_lab_session',sid);render()}catch(e){const x=document.getElementById('loginError');x.textContent=e.message;x.classList.remove('hidden')}}
document.getElementById('loginBtn').onclick=start;document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
(async()=>{if(!sid)return;try{model=await call('view',{p_session:sid});render()}catch{sid='';sessionStorage.removeItem('pug_supabase_v21_lab_session')}})();
})();
</script></body></html>
