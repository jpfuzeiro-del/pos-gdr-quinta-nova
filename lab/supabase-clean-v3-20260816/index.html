*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{max-width:520px;margin:auto;min-height:100vh;background:#fafafa;padding-bottom:128px}header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:7px 10px}.brand{display:flex;align-items:center;gap:9px;cursor:pointer}.brand img{width:38px;height:38px;object-fit:contain}.brand h1{margin:0;font-size:1rem;line-height:1.05}.brand small{font-size:.72rem;color:var(--green);font-weight:800}.badge{display:inline-flex;align-items:center;margin-left:6px;padding:3px 7px;border-radius:999px;font-size:.68rem;font-weight:850}.cash-open,.sync{background:#dcfce7;color:#166534}.cash-closed{background:#fee2e2;color:#991b1b}.lab{border:1px solid var(--purple);color:var(--purple);background:#fff}main{padding:10px 14px 16px}.toprow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:8px 0}.toprow button{min-height:58px;border-radius:13px;font-size:.72rem;font-weight:900;padding:6px;border:0}.nav-clients{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important}.nav-accounts{background:var(--purple)!important;color:#fff!important}.shortage-btn{background:var(--warn)!important;color:#222!important}.mic-btn{background:var(--green)!important;color:#fff!important}.stock-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stock-action-btn{border:0;border-radius:14px;padding:11px;font-weight:800;background:#f3f4f6}.stock-action-btn.active{outline:3px solid currentColor}.stock-note{font-size:.86rem;margin:6px 0}.account-sub{color:#666;margin:8px 2px 12px}.section{display:flex;justify-content:space-between;align-items:end;margin:14px 2px 9px}.section h2{font-size:1rem;margin:0}.section small{color:#777}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{min-height:105px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-weight:850;box-shadow:0 4px 14px #0000000b}.tile .ico{font-size:1.85rem}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px;text-align:left;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;font-weight:800}.product img{width:100%;height:105px;object-fit:contain;border-radius:10px;margin-bottom:8px}.product b{margin-top:8px;color:var(--green)}.backbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}.backbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:850}.utility{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.utility button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-weight:750}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 14px 14px;box-shadow:0 -6px 22px #00000010}.lines{max-height:180px;overflow:auto}.cart-line{display:grid;grid-template-columns:minmax(0,1.25fr) auto minmax(90px,.8fr) 42px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px dashed #ddd}.cart-name{min-width:0;font-size:.94rem;line-height:1.18}.qty{display:flex;align-items:center;gap:5px;font-weight:900}.qty-btn{width:38px;height:38px;border:0;border-radius:10px;background:#eee;color:var(--ink);font-weight:950;padding:0}.cart-money{text-align:right;white-space:nowrap}.cart-money span{display:block;color:var(--muted);font-size:.72rem}.cart-money b{display:block;font-size:.92rem}.cart-remove{width:42px;height:42px;border:0;border-radius:12px;background:#fde1e1;color:#a11;font-size:1.15rem;font-weight:950;padding:0}.total{display:flex;justify-content:space-between;align-items:center;font-size:1.16rem;font-weight:900;margin:8px 0}.total b{color:var(--green);font-size:1.34rem}.cart-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}.cart-actions button{width:100%;border:0;border-radius:15px;padding:14px;font-size:1.05rem;font-weight:950}.cart-debt{background:var(--purple);color:#fff}.cart-receive{background:var(--blue);color:#fff}.contract-error{padding:11px;border-radius:12px;background:#fdecea;color:var(--danger);font-weight:800;text-align:center}@media(max-width:430px){.cart-line{grid-template-columns:minmax(0,1fr) auto 82px 40px;gap:5px}.qty-btn{width:34px;height:36px}.cart-remove{width:40px;height:40px}.cart-money span{font-size:.66rem}.cart-money b{font-size:.82rem}}.overlay{position:fixed;inset:0;z-index:100;background:#0008;display:grid;place-items:center;padding:16px}.panel{background:#fff;width:min(470px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:18px}.panel h2{margin-top:0}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;margin:0 0 10px}.person-list,.list{display:grid;gap:8px}.person-card,.list-card{width:100%;border:1px solid #e4e6ea;border-radius:14px;background:#fff;padding:11px 12px;text-align:left}.person-row{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person-main,.list-main{flex:1;min-width:0}.person-name,.list-title{font-weight:850;font-size:1rem}.meta{font-size:.78rem;color:var(--muted);margin-top:2px}.amount{font-weight:900;white-space:nowrap}.list-card{display:flex;align-items:center;gap:10px}.item-img{width:42px;height:42px;object-fit:contain;border-radius:9px;flex:none}.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.item-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-weight:800}.summary{background:#f6f8fb;border-radius:14px;padding:12px;margin:8px 0}.fields{display:grid;gap:9px}.field label{display:block;font-size:.84rem;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:100px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.quick button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-weight:800}.actions{display:grid;gap:8px;margin-top:12px}.actions button{width:100%;border:0;border-radius:14px;padding:13px;font-weight:850;background:#eef1f4;color:var(--ink)}.actions button[data-primary="1"]{background:var(--blue);color:#fff}.actions button:disabled{opacity:.38}.payment-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.payment-choice button{min-height:52px;border:0;border-radius:13px;font-weight:850}.payment-choice button[data-primary="1"]{background:var(--green);color:#fff}.notice,.error{margin:8px 14px;padding:10px 12px;border-radius:12px;font-weight:750}.notice{background:#e9f7ef;color:#145a32}.error{background:#fdecea;color:var(--danger)}.review{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.review div{margin:3px 0}.share-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.share-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:850}.account-focus{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}.focus-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.focus-actions button{border:0;border-radius:12px;padding:12px;font-weight:850}.focus-actions button:first-child{background:var(--blue);color:#fff}

<div id="login" class="overlay"><div class="panel"><img src="../../assets/gdr-quinta-nova-logo.png" alt="GDR Quinta Nova" style="width:140px;display:block;margin:auto"><h2>Entrada no POS GDR Quinta Nova</h2><div class="fields"><div class="field"><label>Operador</label><input id="code" autocomplete="username"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div></div><div id="loginError" class="error hidden"></div><div class="actions"><button id="loginBtn" data-primary="1">Entrar</button></div></div></div>
<div id="shell" class="app hidden"><header id="header"></header><div id="status"></div><main id="main"></main></div>
<script id="PUG_PRESENTATION_ONLY_V2">
(()=>{'use strict';
const TRANSPORT='https://cxymfqaokexihupbphur.supabase.co/functions/v1/pug_frontoffice_core_clean_v1';
const $=id=>document.getElementById(id),login=$('login'),shell=$('shell'),main=$('main'),header=$('header'),status=$('status');
let sid=sessionStorage.getItem('pug_clean_v2_session')||'',model=null,busy=false,inputSource='manual';
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const euro=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}):''};
async function call(op,body){const r=await fetch(TRANSPORT+'?op='+encodeURIComponent(op),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={error:t}}if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function fields(){const out={};document.querySelectorAll('[data-field]').forEach(x=>out[x.dataset.field]=x.value);if(inputSource!=='manual')out.input_source=inputSource;return out}
function payload(el){try{return JSON.parse(el.dataset.payload||'{}')}catch{return {}}}
async function send(key,p){if(!key||busy||!sid)return;busy=true;try{model=await call('dispatch',{p_session:sid,p_action:key,p_payload:Object.assign({},fields(),p||{}),p_event_id:crypto.randomUUID()});inputSource='manual';render()}catch(e){showError(e.message)}finally{busy=false}}
function showError(m){status.innerHTML='<div class="error">'+esc(m)+'</div>'}
function showNotice(){const n=model?.notice;if(!n){status.innerHTML='';return}let d='';if(n.applied!=null)d+=' Recebido: '+euro(n.applied)+'.';if(n.change!=null&&Number(n.change)>0)d+=' Troco: '+euro(n.change)+'.';if(n.remaining!=null&&Number(n.remaining)>0)d+=' Restante: '+euro(n.remaining)+'.';status.innerHTML='<div class="notice"><b>'+esc(n.title||'Concluído')+'</b>'+esc(d)+'</div>'}
function actionBtn(a,cls=''){if(!a||!a.key)return'';return '<button type="button" class="'+esc(a.ui_class||cls)+(a.active?' active':'')+'" data-key="'+esc(a.key)+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"'+(a.device?' data-device="'+esc(a.device)+'"':'')+(a.disabled?' disabled':'')+(a.style==='primary'?' data-primary="1"':'')+'>'+(a.icon?'<span>'+esc(a.icon)+'</span><br>':'')+esc(a.label||'')+'</button>'}
function renderHeader(h){const x=h||{};const open=(x.cash_status||'').includes('aberta');header.innerHTML='<div class="brand" id="brand"><img src="../../assets/gdr-quinta-nova-logo.png" alt=""><div><h1>'+esc(x.title||'GDR Quinta Nova POS')+'</h1><small>'+esc(x.operator||model?.operator?.name||'')+'</small><span class="badge '+(open?'cash-open':'cash-closed')+'">'+esc(x.cash_status||'')+'</span><span class="badge sync">'+esc(x.sync_status||'')+'</span><span class="badge lab">LAB</span></div></div>';const k=model?.home_action?.key;$('brand').onclick=()=>{if(k)send(k,{})}}
function image(i,cls='item-img'){const u=i?.photo_url||i?.image_url||i?.visual?.image_url;return u?'<img class="'+cls+'" src="'+esc(u)+'" alt="">':''}
function initials(name){const w=String(name||'').trim().split(/\s+/).filter(Boolean);if(!w.length)return'?';if(w.length===1)return w[0].slice(0,2).toUpperCase();return (w[0][0]+w[w.length-1][0]).toUpperCase()}
function avatar(i){const u=i?.photo_url||i?.avatar_url;return '<div class="avatar">'+(u?'<img src="'+esc(u)+'" alt="">':esc(initials(i?.title||i?.name)))+'</div>'}
function renderTiles(items,family){return '<div class="'+(family?'grid':'products')+'">'+(items||[]).map(i=>{const a=i.action||{};return '<button type="button" class="'+(family?'tile':'product')+'" data-key="'+esc(a.key||'')+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'">'+(family?'<span class="ico">'+esc(i.icon||'•')+'</span>':image(i,'product-image'))+'<strong>'+esc(i.title||i.name||'')+'</strong>'+(i.amount!=null?'<b>'+euro(i.amount)+'</b>':'')+'</button>'}).join('')+'</div>'}
function renderPeople(items){return '<div class="person-list">'+(items||[]).map(i=>{const a=i.action||{};return '<button type="button" class="person-card searchable-item" data-key="'+esc(a.key||'')+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"><div class="person-row">'+avatar(i)+'<div class="person-main"><div class="person-name">'+esc(i.title||i.name||'')+'</div>'+(i.subtitle?'<div class="meta">'+esc(i.subtitle)+'</div>':'')+'</div>'+(i.amount!=null?'<div class="amount">'+euro(i.amount)+'</div>':'')+'</div></button>'}).join('')+'</div>'}
function renderList(items){return '<div class="list">'+(items||[]).map(i=>{const a=i.action||{},acts=(i.item_actions||[]).map(x=>actionBtn(x,'')).join('');return '<div class="list-card searchable-item"'+(a.key?' data-key="'+esc(a.key)+'" data-payload="'+esc(JSON.stringify(a.payload||{}))+'"':'')+'>'+image(i)+'<div class="list-main"><div class="list-title">'+esc(i.title||i.name||i.customer_name||i.account_name||'')+'</div>'+(i.subtitle?'<div class="meta">'+esc(i.subtitle)+'</div>':'')+(i.quantity!=null?'<div class="meta">× '+esc(i.quantity)+'</div>':'')+(acts?'<div class="item-actions">'+acts+'</div>':'')+'</div>'+(i.amount!=null?'<div class="amount">'+euro(i.amount)+'</div>':'')+'</div>'}).join('')+'</div>'}
function renderFields(fs){return '<div class="fields">'+(fs||[]).map(f=>{const val=f.value==null?'':f.value;let control;if(f.type==='select'){control='<select data-field="'+esc(f.key)+'"><option value="">—</option>'+((f.options||[]).map(o=>'<option value="'+esc(o.id||o.operator_id||o.customer_id||o.value||'')+'">'+esc(o.display_name||o.name||o.operator_name||o.operator_code||o.label||'')+'</option>').join(''))+'</select>'}else if(f.type==='textarea'){control='<textarea data-field="'+esc(f.key)+'">'+esc(val)+'</textarea>'}else{const type=f.type==='money'?'number':(f.type||'text');control='<input data-field="'+esc(f.key)+'" type="'+esc(type)+'"'+(f.type==='money'?' step="0.01" min="0" inputmode="decimal"':'')+' value="'+esc(val)+'">'}return '<div class="field"><label>'+esc(f.label||f.key)+'</label>'+control+'</div>'}).join('')+'</div>'}
function renderActions(as,cls='actions'){return '<div class="'+cls+'">'+(as||[]).filter(a=>a&&a.key).map(a=>actionBtn(a,'')).join('')+'</div>'}
function renderBottom(){const cart=model?.cart,cf=model?.surface?.cart_focus;if(!cart||Number(cart.count)<=0)return'';if(!cf||cf.contract!=='V42_CART_FOOTER_SUPABASE_V1')return '<div class="bottom"><div class="contract-error">Contrato V42 do carrinho em falta no Supabase.</div></div>';const items=Array.isArray(cf.items)?cf.items:[];const ls=items.map(i=>{const d=i.decrement_action,p=i.increment_action,r=i.remove_action;if(!d?.key||!p?.key||!r?.key)return '<div class="contract-error">Ações da linha do carrinho em falta no contrato Supabase.</div>';return '<div class="cart-line"><div class="cart-name">'+esc(i.name||i.title||'')+'</div><div class="qty">'+actionBtn(d,'qty-btn')+'<b>'+esc(i.quantity)+'</b>'+actionBtn(p,'qty-btn')+'</div><div class="cart-money"><span>'+euro(i.unit_price)+' cada</span><b>'+euro(i.line_total)+' total</b></div>'+actionBtn(r,'cart-remove')+'</div>'}).join('');const acts=Array.isArray(cf.actions)?cf.actions.filter(a=>a&&a.key):[];const ctl=acts.length?'<div class="cart-actions">'+acts.map(a=>actionBtn(a,a.ui_class||'')).join('')+'</div>':'<div class="contract-error">Ações finais do carrinho em falta no contrato Supabase.</div>';return '<div class="bottom"><div class="lines">'+ls+'</div><div class="total"><span>Total</span><b>'+euro(cf.total??cart.total)+'</b></div>'+ctl+'</div>'}
function renderHome(){const sf=model.surface||{},s=model.screen||{};renderHeader(sf.header);let h='<div class="toprow">'+(sf.top_actions||[]).map(a=>actionBtn(a,a.ui_class)).join('')+'</div><div class="stock-actions">'+(sf.stock_actions||[]).map(a=>actionBtn(a,a.ui_class)).join('')+'</div>'+(sf.stock_mode_note?'<div class="stock-note">'+esc(sf.stock_mode_note)+'</div>':'')+'<div class="account-sub">'+esc(sf.account_sub||'')+'</div><div class="section"><h2>'+esc(sf.family_title||s.title||'')+'</h2><small>'+esc(sf.family_count||0)+' famílias</small></div>'+renderTiles(sf.family_items||s.items||[],true);const u=(sf.utility_actions||[]).filter(a=>a&&a.key);if(u.length)h+='<div class="utility">'+u.map(a=>actionBtn(a,'')).join('')+'</div>';main.innerHTML=h+renderBottom();bind()}
function renderProducts(){const sf=model.surface||{},s=model.screen||{};renderHeader(sf.header);main.innerHTML='<div class="backbar">'+actionBtn(sf.back_action,'backbtn')+'<strong>'+esc(s.title||'')+'</strong><small>'+esc((s.items||[]).length)+' produtos</small></div>'+renderTiles(s.items||[],false)+renderBottom();bind()}
function renderAccount(){const sf=model.surface||{},s=model.screen||{};renderHeader(sf.header);let h='<section class="account-focus"><h2>'+esc(s.title||'')+'</h2>';if(s.summary)h+='<div class="summary"><div class="total"><span>'+esc(s.summary.label||'')+'</span><b>'+euro(s.summary.amount)+'</b></div></div>';h+=renderList(s.items||[])+'<div class="focus-actions">'+(s.actions||[]).map(a=>actionBtn(a,'')).join('')+'</div></section>';main.innerHTML=h;bind()}
function renderModal(){const sf=model.surface||{},s=model.screen||{},v=sf.variant||'';renderHeader(sf.header);let b='<div class="overlay"><div class="panel"><h2>'+esc(s.title||'')+'</h2>';if(s.summary)b+='<div class="summary"><div class="total"><span>'+esc(s.summary.label||'')+'</span><b>'+euro(s.summary.amount)+'</b></div></div>';const searchable=s.kind==='search_list'||v==='V21_CC_LIST';if(searchable)b+='<input id="search" class="search" placeholder="Pesquisar">';b+=renderFields(s.fields);if(Array.isArray(s.quick_values)&&s.quick_values.length)b+='<div class="quick">'+s.quick_values.map(x=>'<button type="button" data-quick="'+esc(x)+'">'+euro(x)+'</button>').join('')+'</div>';if(s.review)b+='<div class="review"><b>Reconhecido</b><div>'+esc(s.review.raw||'')+'</div>'+((s.review.items||[]).map(i=>'<div>'+esc(i.name)+' × '+esc(i.quantity)+'</div>').join(''))+(s.review.unmatched_text?'<div class="error">Por rever: '+esc(s.review.unmatched_text)+'</div>':'')+'</div>';if(Array.isArray(s.items)){if(v==='V21_CLIENTS_MODAL'&&s.kind==='search_list')b+=renderPeople(s.items);else if(v==='V21_CC_LIST')b+=renderPeople(s.items);else b+=renderList(s.items)}if(v==='V21_PAYMENT'||v==='V21_CC_PAYMENT')b+=renderActions(s.actions,'payment-choice');else b+=renderActions(s.actions);if(Array.isArray(s.external_actions)&&s.external_actions.length)b+='<div class="share-actions">'+s.external_actions.map(a=>'<button type="button" data-protocol="'+esc(a.protocol)+'">'+esc(a.label||'')+'</button>').join('')+'</div>';b+='</div></div>';main.innerHTML=b;bind()}
function bind(){document.querySelectorAll('[data-key]').forEach(el=>el.onclick=async e=>{e.stopPropagation();if(el.disabled)return;const dev=el.dataset.device;if(dev){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showError('Reconhecimento de voz indisponível neste dispositivo.');return}const r=new SR();r.lang='pt-PT';r.interimResults=false;r.maxAlternatives=1;r.onresult=x=>{const t=x.results[0][0].transcript||'';if(dev==='speech_fill'){const f=document.querySelector('[data-field]');if(f){f.value=t;inputSource='voice'}}else send(el.dataset.key,{transcript:t})};r.onerror=x=>showError('Microfone: '+x.error);r.start();return}await send(el.dataset.key,payload(el))});const q=$('search');if(q)q.oninput=()=>{const n=q.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();document.querySelectorAll('.searchable-item').forEach(x=>x.style.display=!n||x.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(n)?'':'none')};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const f=document.querySelector('[data-field][type="number"]');if(f)f.value=b.dataset.quick});document.querySelectorAll('[data-protocol]').forEach(b=>b.onclick=async()=>{const tel=document.querySelector('[data-field][type="tel"]'),ta=document.querySelector('textarea[data-field]'),p=tel?tel.value:'',m=ta?ta.value:'';if(b.dataset.protocol==='whatsapp')window.open('https://wa.me/'+p.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(m),'_blank');else if(b.dataset.protocol==='sms')location.href='sms:'+p.replace(/[^0-9+]/g,'')+'?body='+encodeURIComponent(m);else if(b.dataset.protocol==='clipboard'){await navigator.clipboard.writeText(m);status.innerHTML='<div class="notice">Mensagem copiada.</div>'}})}
function render(){login.classList.add('hidden');shell.classList.remove('hidden');showNotice();const v=model?.surface?.variant;if(v==='V21_HOME')renderHome();else if(v==='V21_PRODUCTS')renderProducts();else if(v==='V21_ACCOUNT_FOCUS')renderAccount();else renderModal()}
async function start(){try{model=await call('start',{p_operator_code:$('code').value,p_pin:$('pin').value});sid=model.session_id;sessionStorage.setItem('pug_clean_v2_session',sid);render()}catch(e){const x=$('loginError');x.textContent=e.message;x.classList.remove('hidden')}}
$('loginBtn').onclick=start;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
(async()=>{if(!sid)return;try{model=await call('view',{p_session:sid});render()}catch{sid='';sessionStorage.removeItem('pug_clean_v2_session')}})();
})();
</script>
