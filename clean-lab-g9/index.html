<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Clean Lab G9</title><style>body{font-family:system-ui;background:#f5f7f9;color:#17233a;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0}.grid{display:grid;gap:10px}input,button{font:inherit;padding:14px;border-radius:12px}input{border:1px solid #ccd5dd}button{border:0;font-weight:750;background:#e8eef3}.primary{background:#15803d;color:#fff}.hidden{display:none}.ok{color:#166534}.error{color:#b91c1c}.proof{padding:12px;border-radius:12px;background:#ecfdf5;margin:12px 0}.debt{text-align:left}</style></head><body><main><h1>POS Clean Lab</h1><p>LAB · produção intocada · G9</p><div id="status"></div><section id="login" class="card"><h2>Entrada</h2><div class="grid"><input id="code" placeholder="Operador"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="enter" class="primary">Entrar</button></div></section><section id="debts" class="card hidden"><h2>Contas correntes em aberto</h2><p id="count"></p><div id="list" class="grid"></div></section><section id="detail" class="card hidden"><h2>G9 — dívida reaberta</h2><p>Cliente: <b id="name"></b></p><p>Sale ID: <span id="sale"></span></p><p>Recebível: <span id="rec"></span></p><p>Saldo em dívida: <b id="amount"></b></p><p>Linhas: <b id="lines"></b></p><div id="proof" class="proof"></div><button id="back">← Voltar às contas correntes</button></section><script>
const RPC='https://cxymfqaokexihupbphur.supabase.co/rest/v1/rpc/';const KEY='sb_publishable_ccDeMsnWJ3Uq059MiS_09A_hkzvaxaQ';let token=null,debts=[];const $=id=>document.getElementById(id);const e={status:$('status'),login:$('login'),debts:$('debts'),detail:$('detail'),code:$('code'),pin:$('pin'),enter:$('enter'),count:$('count'),list:$('list'),name:$('name'),sale:$('sale'),rec:$('rec'),amount:$('amount'),lines:$('lines'),proof:$('proof'),back:$('back')};
async function rpc(n,a){const r=await fetch(RPC+n,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(a)});const t=await r.text();let b;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw new Error(b?.message||t||('HTTP '+r.status));return b}
function show(x){[e.login,e.debts,e.detail].forEach(v=>v.classList.add('hidden'));x.classList.remove('hidden')}
async function loadDebts(){debts=await rpc('pos_front_debts',{p_token:token});e.list.innerHTML='';e.count.textContent=debts.length+' dívida(s) em aberto';for(const d of debts){const b=document.createElement('button');b.className='debt';b.innerHTML='<b>'+d.customer_name+'</b><br>'+Number(d.outstanding_amount).toFixed(2)+' €';b.addEventListener('click',()=>openDebt(d));e.list.appendChild(b)}show(e.debts)}
async function login(){try{e.status.textContent='A entrar…';const a=await rpc('pos_front_login',{p_operator_code:e.code.value.trim(),p_pin:e.pin.value});token=a.token;await rpc('pos_front_bootstrap',{p_token:token});await loadDebts();e.status.className='ok';e.status.textContent='G1 preservado — login e bootstrap OK. G9 pronto.'}catch(x){e.status.className='error';e.status.textContent='NÃO CONCLUÍDO: '+x.message}}
async function openDebt(d){try{const a=await rpc('pos_front_customer_account',{p_token:token,p_customer:d.customer_id});const h=(a.history||[]).find(x=>x.receivable_id===d.receivable_id);if(!h)throw new Error('recebivel_nao_encontrado_no_historico');if(h.sale_id!==d.sale_id)throw new Error('sale_id_alterado');if(Number(h.outstanding_amount)!==Number(d.outstanding_amount))throw new Error('saldo_alterado');e.name.textContent=d.customer_name;e.sale.textContent=d.sale_id;e.rec.textContent=d.receivable_id;e.amount.textContent=Number(d.outstanding_amount).toFixed(2)+' €';e.lines.textContent=(h.lines||[]).length;e.proof.innerHTML='<b>G9 PASS</b><br>Dívida recuperada pelo recebível existente.<br>Mesmo sale_id: '+d.sale_id+'<br>Nenhuma nova venda foi criada.';e.status.className='ok';e.status.textContent='G9 PASS — conta corrente reaberta sem criar nova venda.';show(e.detail)}catch(x){e.status.className='error';e.status.textContent='G9 NÃO CONCLUÍDO: '+x.message}}
e.enter.addEventListener('click',login);e.pin.addEventListener('keydown',x=>{if(x.key==='Enter')login()});e.back.addEventListener('click',()=>show(e.debts));
</script></main></body></html>
